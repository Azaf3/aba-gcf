function removeCategory(i){
  DB.settings.costCategories.splice(i,1);
  saveDB(); render();
}
function addExpenseCategory(){
  const input = document.getElementById('newExpCatInput');
  const val = input.value.trim();
  if(!val) return;
  if(DB.settings.expenseCategories.includes(val)){ toast('Categoria já existe.'); return; }
  DB.settings.expenseCategories.push(val);
  saveDB(); render(); toast('Categoria adicionada.');
}
function removeExpenseCategory(i){
  DB.settings.expenseCategories.splice(i,1);
  saveDB(); render();
}
function addProductCategory(){
  const val = document.getElementById('newProdCatInput').value.trim();
  if(!val) return;
  if(DB.settings.productCategories.some(c=> c.toLowerCase()===val.toLowerCase())){ toast('Categoria já existe.', 'error'); return; }
  DB.settings.productCategories.push(val);
  saveDB(); render(); toast('Categoria adicionada.');
}
function removeProductCategory(i){
  DB.settings.productCategories.splice(i,1);
  saveDB(); render();
}
function exportData(prefix){
  downloadJSON(DB, (typeof prefix === 'string' ? prefix : 'aba-gestao-backup-') + todayISO() + '.json');
  toast('Backup exportado.');
}

const MERGE_COLLECTIONS = ['clients','suppliers','products','purchases','orders','expenses','baskets','stockMoves'];

function importDataFile(input){
  const file = input.files && input.files[0];
  input.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onerror = ()=> toast('Não foi possível ler o arquivo.', 'error');
  reader.onload = ()=>{
    let data;
    try{ data = JSON.parse(reader.result); }
    catch(e){ toast('Arquivo inválido: não é um JSON legível.', 'error'); return; }
    if(!data || typeof data !== 'object'){ toast('Arquivo inválido.', 'error'); return; }
    if(data.abaImport === 'lancamento') importMerge(data);
    else if(Array.isArray(data.clients) && Array.isArray(data.orders)) importReplace(data);
    else toast('Este arquivo não parece ser um backup do ABA Gestão.', 'error');
  };
  reader.readAsText(file);
}
function importReplace(data){
  if(!confirm('Este é um backup completo. Importar vai SUBSTITUIR todos os dados atuais da sua conta.\n\nSe ainda não exportou um backup do que está aqui, cancele e exporte antes. Continuar?')) return;
  DB = migrateDB(data);
  saveDB(); render(); toast('Backup importado.');
}
// Lançamento: acrescenta só os registros cujo id ainda não existe
function importMerge(data){
  const counts = {};
  // fornecedor ou produto com o mesmo nome de um já cadastrado é reaproveitado, não duplicado
  const remap = {};
  [['suppliers', DB.suppliers], ['products', DB.products]].forEach(([k, existing])=>{
    if(!Array.isArray(data[k])) return;
    data[k] = data[k].filter(x=>{
      if(!x || !x.id || !x.name) return false;
      const same = existing.find(e=> e.id!==x.id && e.name.trim().toLowerCase()===x.name.trim().toLowerCase());
      if(same){ remap[x.id] = same.id; return false; }
      return true;
    });
  });
  const fix = id=> remap[id] || id;
  (data.products||[]).forEach(p=>{ if(p.supplierId) p.supplierId = fix(p.supplierId); });
  (data.purchases||[]).forEach(p=>{ if(p.supplierId) p.supplierId = fix(p.supplierId); (p.items||[]).forEach(it=> it.productId = fix(it.productId)); });
  (data.baskets||[]).forEach(b=> (b.items||[]).forEach(it=> it.productId = fix(it.productId)));
  (data.orders||[]).forEach(o=> (o.baskets||[]).forEach(b=> (b.items||[]).forEach(it=> it.productId = fix(it.productId))));
  (data.stockMoves||[]).forEach(m=> m.productId = fix(m.productId));
  (data.productCosts||[]).forEach(pc=> pc.productId = fix(pc.productId));
  MERGE_COLLECTIONS.forEach(k=>{
    if(!Array.isArray(data[k])) return;
    const ids = new Set(DB[k].map(x=>x.id));
    const fresh = data[k].filter(x=> x && x.id && !ids.has(x.id));
    if(fresh.length){ DB[k].push(...fresh); counts[k] = fresh.length; }
  });
  // produtos com o custo mais recente das compras do arquivo
  (data.productCosts||[]).forEach(pc=>{
    const p = productById(pc.productId);
    if(p && (!p.costDate || pc.date >= p.costDate)){ p.cost = pc.cost; p.costDate = pc.date; }
  });
  const total = Object.values(counts).reduce((a,b)=>a+b,0);
  if(!total){ toast('Nada novo para importar: esses registros já estão no sistema.'); return; }
  DB = migrateDB(DB);
  saveDB(); render();
  const labels = { clients:'cliente(s)', suppliers:'fornecedor(es)', products:'produto(s)', purchases:'compra(s)', orders:'pedido(s)', expenses:'despesa(s)', baskets:'cesta(s)' };
  const parts = Object.entries(counts).filter(([k])=>labels[k]).map(([k,v])=> v+' '+labels[k]);
  toast(parts.length ? 'Importado: ' + parts.join(', ') + '.' : 'Importação concluída.');
}
function resetData(){
  if(!confirm('Isso vai apagar TODOS os dados da sua conta, em todos os aparelhos. Deseja continuar?')) return;
  if(!confirm('Tem certeza? Só será possível voltar por Versões anteriores ou por um backup exportado.')) return;
  DB = migrateDB(emptyDB());
  saveDB(); render(); toast('Todos os dados foram apagados.');
}
</script>

<script>
/* ============================================================
   CALCULADORA DE LUCRO / SIMULADOR
   ============================================================ */
const calcState = { qty:1, unitPrice:0, unitCost:0, freight:0, gas:0, delivery:0, other:0 };

function renderCalculator(){
  return `
    <div class="topbar">
      <div>
        <div class="page-title">Calculadora de lucro</div>
        <div class="page-sub">Simule uma venda antes de fechar e veja o lucro na hora</div>
      </div>
    </div>
    <div class="calc-grid">
      <div class="card">
        <div class="section-title" style="margin:0 0 14px;">Dados da venda</div>
        ${DB.baskets.length ? `<div class="field"><label for="c_basket">Preencher com uma cesta (opcional)</label><select id="c_basket" onchange="fillCalcFromBasket(this.value)"><option value="">Escolha uma cesta...</option>${DB.baskets.map(b=>`<option value="${b.id}">${escapeHtml(b.name)}</option>`).join('')}</select><div class="field-hint">Usa o custo atual do estoque e o preço de venda cadastrado.</div></div>` : ''}
        <div class="field-row">
          <div class="field"><label>Quantidade</label><input type="number" min="1" step="1" id="c_qty" value="${calcState.qty}" oninput="updateCalc('qty',this.value)"></div>
          <div class="field"><label>Preço de venda (unitário)</label><input type="number" min="0" step="0.01" id="c_unitPrice" value="${calcState.unitPrice}" oninput="updateCalc('unitPrice',this.value)"></div>
        </div>
        <div class="field"><label>Custo dos produtos (unitário)</label><input type="number" min="0" step="0.01" id="c_unitCost" value="${calcState.unitCost}" oninput="updateCalc('unitCost',this.value)"></div>
        <div class="field-row">
          <div class="field"><label>Frete (total)</label><input type="number" min="0" step="0.01" id="c_freight" value="${calcState.freight}" oninput="updateCalc('freight',this.value)"></div>
          <div class="field"><label>Gasolina (total)</label><input type="number" min="0" step="0.01" id="c_gas" value="${calcState.gas}" oninput="updateCalc('gas',this.value)"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Entrega (total)</label><input type="number" min="0" step="0.01" id="c_delivery" value="${calcState.delivery}" oninput="updateCalc('delivery',this.value)"></div>
          <div class="field"><label>Outros custos (total)</label><input type="number" min="0" step="0.01" id="c_other" value="${calcState.other}" oninput="updateCalc('other',this.value)"></div>
        </div>
        <div class="field-hint">Dica: para simular uma venda como "10 cestas a R$ 65,90", informe a quantidade e o preço unitário. A receita é calculada automaticamente.</div>
      </div>
      <div class="card calc-result-card" id="calcResult"></div>
    </div>
  `;
}
function fillCalcFromBasket(id){
  const b = DB.baskets.find(x=>x.id===id);
  if(!b) return;
  calcState.unitCost = round2(basketUnitCost(b));
  calcState.unitPrice = Number(b.price)||0;
  render();
}
function updateCalc(key, val){
  calcState[key] = key==='qty' ? Math.max(1, parseInt(val)||1) : (parseFloat(val)||0);
  renderCalcResult();
}
function renderCalcResult(){
  const el = document.getElementById('calcResult');
  if(!el) return;
  const revenue = calcState.qty * calcState.unitPrice;
  const productCost = calcState.qty * calcState.unitCost;
  const totalCost = productCost + calcState.freight + calcState.gas + calcState.delivery + calcState.other;
  const profit = revenue - totalCost;
  const margin = revenue>0 ? (profit/revenue)*100 : 0;
  let tag, tagClass;
  if(revenue<=0){ tag='Informe os valores'; tagClass='tag-low'; }
  else if(margin >= 20){ tag='Venda saudável'; tagClass='tag-healthy'; }
  else if(margin >= 10){ tag='Margem baixa, atenção'; tagClass='tag-low'; }
  else { tag='Margem crítica'; tagClass='tag-bad'; }

  el.innerHTML = `
    <div class="section-title" style="margin:0 0 6px;">Resultado</div>
    <div class="calc-big">${fmtBRL(profit)}</div>
    <div class="field-hint" style="margin:2px 0 14px;">Lucro estimado</div>
    <div class="calc-line"><span>Receita (${calcState.qty} × ${fmtBRL(calcState.unitPrice)})</span><b class="mono">${fmtBRL(revenue)}</b></div>
    <div class="calc-line"><span>Custo dos produtos</span><b class="mono">${fmtBRL(productCost)}</b></div>
    <div class="calc-line"><span>Frete + gasolina + entrega + outros</span><b class="mono">${fmtBRL(calcState.freight+calcState.gas+calcState.delivery+calcState.other)}</b></div>
    <div class="calc-line"><span>Custo total</span><b class="mono">${fmtBRL(totalCost)}</b></div>
    <div class="calc-line"><span>Margem de lucro</span><b class="mono">${fmtPct(margin)}</b></div>
    <div class="calc-tag ${tagClass}">${tag}</div>
  `;
}
</script>

<script>

}

/* ============================================================

   ============================================================ */
function openClientModal(id){

      <div class="field"><label>CPF / CNPJ</label><input id="f_doc" value="${escapeHtml(c.doc)}"></div>
      <div class="field"><label>Status</label>
        <select id="f_status"><option value="ativo" ${c.status==='ativo'?'selected':''}>Ativo</option><option value="inativo" ${c.status==='inativo'?'selected':''}>Inativo</option></select>
      </div>
    </div>
    <div class="field-row">
      <div class="field"><label>Telefone</label><input id="f_phone" value="${escapeHtml(c.phone)}"></div>
      <div class="field"><label>WhatsApp</label><input id="f_whatsapp" value="${escapeHtml(c.whatsapp)}"></div>
    </div>
    <div class="field"><label>Endereço</label><input id="f_address" value="${escapeHtml(c.address)}"></div>
    <div class="field-row">
      <div class="field"><label>CEP</label><input id="f_cep" value="${escapeHtml(c.cep)}"></div>
      <div class="field"><label>Cidade</label><input id="f_city" value="${escapeHtml(c.city)}"></div>
    </div>
    <div class="field"><label>Observações</label><textarea id="f_notes">${escapeHtml(c.notes)}</textarea></div>
  `;
  const foot = `
    <div>${editing ? `<button class="btn btn-danger btn-sm" onclick="deleteClient('${c.id}')">${ic('trash')} Excluir</button>` : '<span></span>'}</div>
    <div style="display:flex; gap:8px;"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveClient('${c.id||''}')">Salvar cliente</button></div>
  `;
  document.getElementById('modalRoot').innerHTML = modalShell(editing?'Editar cliente':'Novo cliente', body, foot);
}
function saveClient(id){
  const name = document.getElementById('f_name').value.trim();
  if(!name){ toast('Informe o nome do cliente.'); return; }
  const data = {
    name,
    doc: document.getElementById('f_doc').value.trim(),
    status: document.getElementById('f_status').value,
    phone: document.getElementById('f_phone').value.trim(),
    whatsapp: document.getElementById('f_whatsapp').value.trim(),
    address: document.getElementById('f_address').value.trim(),
    cep: document.getElementById('f_cep').value.trim(),
    city: document.getElementById('f_city').value.trim(),
    notes: document.getElementById('f_notes').value.trim(),
  };
  if(id){
    const c = DB.clients.find(x=>x.id===id);
    Object.assign(c, data);
  } else {
    DB.clients.push({ id: uid(), createdAt: todayISO(), ...data });
  }
  saveDB(); closeModal(); render(); toast('Cliente salvo.');
}
function deleteClient(id){
  const hasOrders = DB.orders.some(o=>o.clientId===id);
  if(hasOrders){ toast('Este cliente possui pedidos vinculados e não pode ser excluído.'); return; }
  if(!confirm('Excluir este cliente?')) return;
  DB.clients = DB.clients.filter(c=>c.id!==id);
  saveDB(); closeModal(); navigateTo('clients'); toast('Cliente excluído.');
}

/* ============================================================
   MODAL: PEDIDO / SERVIÇO  (com custos e pagamentos dinâmicos)
   ============================================================ */
let orderDraft = null;

function openOrderModal(id, presetClientId){
  const editing = id ? DB.orders.find(o=>o.id===id) : null;
  orderDraft = editing ? JSON.parse(JSON.stringify(editing)) : {
    id:null, clientId: presetClientId||'', date: todayISO(), description:'', type:'Cesta Básica',
    saleValue:0, costs:[], payments:[], baskets:[], stockOut:true, notes:'', overdue:false, receipts:[]
  };
  if(!Array.isArray(orderDraft.baskets)) orderDraft.baskets = [];
  if(orderDraft.stockOut === undefined) orderDraft.stockOut = true;
  document.getElementById('modalRoot').innerHTML = orderModalHtml(editing);
}
function orderModalHtml(editing){
  const o = orderDraft;
  const clientOptions = DB.clients.map(c=> `<option value="${c.id}" ${o.clientId===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('');
  const body = `
    <div class="field-row">
      <div class="field"><label>Cliente *</label>
        <select id="f_clientId">${clientOptions || '<option value="">Cadastre um cliente primeiro</option>'}</select>
      </div>
      <div class="field"><label>Data *</label><input type="date" id="f_date" value="${o.date}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Tipo</label>
        <select id="f_type">
          ${['Cesta Básica','Compra sob demanda','Outro serviço'].map(t=>`<option ${o.type===t?'selected':''}>${t}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Valor total cobrado do cliente (R$) *</label><input type="number" step="0.01" min="0" id="f_saleValue" value="${o.saleValue}" oninput="orderDraft.saleValue=parseFloat(this.value)||0; renderOrderTotals();"></div>
    </div>
    <div class="field"><label>Descrição</label><input id="f_description" value="${escapeHtml(o.description)}" placeholder="Ex: 10 Cestas Básicas P"></div>

    <div class="subblock">
      <div class="subblock-head"><div class="subblock-title">Cestas do catálogo</div>${o.baskets.length ? `<button class="inline-link" style="font-size:12px;" onclick="useBasketPrice()">Usar preço das cestas no valor cobrado</button>` : ''}</div>
      ${DB.baskets.length===0 ? `<div class="field-hint">Nenhuma cesta cadastrada. Em "Cestas" você monta a composição e o custo sai automático do estoque.</div>` : `
      <div id="basketRows">${renderOrderBasketRows()}</div>
      <div class="add-row-form">
        <select class="f-prod" id="nb_basket" aria-label="Cesta">${DB.baskets.filter(b=>b.active!==false).map(b=>`<option value="${b.id}">${escapeHtml(b.name)} · ${fmtBRL(basketUnitCost(b))} de custo</option>`).join('')}</select>
        <input class="f-qty" id="nb_qty" type="number" min="1" step="1" value="1" aria-label="Quantidade de cestas">
        <button class="btn btn-ghost btn-sm" onclick="addOrderBasket()">${ic('plus')} Add</button>
      </div>
      <label class="checkbox-row" style="font-size:12px; color:var(--text-dim); margin-top:10px;"><input type="checkbox" id="f_stockOut" ${o.stockOut?'checked':''} onchange="orderDraft.stockOut=this.checked;"> Dar baixa dos produtos no estoque ao salvar</label>`}
      <div class="totals-mini"><span>Custo das cestas (preço do dia)</span><b>${fmtBRL(orderBasketsCost(o))}</b></div>
    </div>

    <div class="subblock">
      <div class="subblock-head"><div class="subblock-title">Outros custos do pedido</div></div>
      <div id="costRows">${renderCostRows()}</div>
      <div class="add-row-form">
        <select class="f-cat" id="nc_cat" aria-label="Categoria do custo">${DB.settings.costCategories.map(c=>`<option>${escapeHtml(c)}</option>`).join('')}</select>
        <input class="f-desc" id="nc_desc" placeholder="Descrição (ex: comprovante 1)" aria-label="Descrição do custo">
        <input class="f-val" id="nc_val" type="number" step="0.01" min="0" placeholder="Valor" aria-label="Valor do custo">
        <label class="checkbox-row" style="font-size:11.5px; color:var(--text-dim);"><input type="checkbox" id="nc_receipt"> Tem comprovante</label>
        <button class="btn btn-ghost btn-sm" onclick="addCostRow()">${ic('plus')} Add</button>
      </div>
      <div class="totals-mini"><span>Custos lançados</span><b id="costTotalDisplay">${fmtBRL(orderCostRowsTotal(o))}</b></div>
    </div>

    <div class="subblock">
      <div class="subblock-head"><div class="subblock-title">Pagamentos recebidos</div></div>
      <div id="paymentRows">${renderPaymentRows()}</div>
      <div class="add-row-form">
        <input class="f-val" id="np_date" type="date" value="${todayISO()}" style="width:140px;" aria-label="Data do pagamento">
        <input class="f-val" id="np_val" type="number" step="0.01" min="0" placeholder="Valor" style="width:100px;" aria-label="Valor do pagamento">
        <input class="f-desc" id="np_method" placeholder="Forma (PIX, dinheiro...)" aria-label="Forma de pagamento">
        ${orderBalance(o) > 0.005 && (Number(o.saleValue)||0) > 0 ? `<button class="btn btn-ghost btn-sm" onclick="document.getElementById('np_val').value='${round2(orderBalance(o)).toFixed(2)}'">Saldo</button>` : ''}
        <button class="btn btn-ghost btn-sm" onclick="addPaymentRow()">${ic('plus')} Add</button>
      </div>
    </div>

    <div class="field checkbox-row" style="margin-bottom:14px;">
      <input type="checkbox" id="f_overdue" ${o.overdue?'checked':''} onchange="orderDraft.overdue=this.checked;">
      <label style="margin:0; text-transform:none; font-size:12.5px;">Marcar como pagamento em atraso</label>
    </div>
    <div class="field"><label>Observações</label><textarea id="f_notes">${escapeHtml(o.notes)}</textarea></div>

    <div id="orderTotalsBox"></div>
  `;
  const foot = `
    <div>${editing ? `<button class="btn btn-danger btn-sm" onclick="if(deleteOrder('${o.id}')) closeModal();">${ic('trash')} Excluir</button>` : '<span></span>'}</div>
    <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-ghost" title="Salva o pedido e abre o recibo para o cliente" onclick="saveOrderAndReceipt()">${ic('receipt')} Salvar e gerar recibo</button><button class="btn btn-primary" onclick="saveOrder()">Salvar pedido</button></div>
  `;
  return modalShell(editing?'Editar pedido':'Novo pedido / serviço', body, foot) ;
}
function renderOrderBasketRows(){
  const o = orderDraft;
  if(o.baskets.length===0) return `<div class="field-hint">Nenhuma cesta adicionada.</div>`;
  return o.baskets.map((b,i)=> `<div class="mini-row">
    <div class="mr-qty">${fmtQty(b.qty)} ×</div>
    <div class="mr-desc">${escapeHtml(b.name)} <span class="client-row-sub">custo ${fmtBRL(b.unitCost)} · venda ${fmtBRL(b.unitPrice)} cada</span></div>
    <div class="mr-val">${fmtBRL(b.qty*b.unitCost)}</div>
    <button class="icon-btn mr-del" aria-label="Remover cesta" onclick="removeOrderBasket(${i})">${ic('trash')}</button>
  </div>`).join('');
}
function addOrderBasket(){
  const b = DB.baskets.find(x=> x.id===document.getElementById('nb_basket').value);
  const qty = parseInt(document.getElementById('nb_qty').value)||0;
  if(!b){ toast('Escolha uma cesta.', 'error'); return; }
  if(qty<=0){ toast('Informe a quantidade de cestas.', 'error'); return; }
  const missing = basketMissingCost(b);
  if(missing.length) toast(`Atenção: ${missing.length} item(ns) da cesta estão sem custo cadastrado, o custo pode estar abaixo do real.`, 'error');
  // guarda nome, preço, custo e composição do dia para o histórico não mudar
  orderDraft.baskets.push({ id: uid(), basketId: b.id, name: b.name, qty, unitPrice: Number(b.price)||0, unitCost: round2(basketUnitCost(b)), items: (b.items||[]).map(it=>({productId: it.productId, qty: Number(it.qty)||0})) });
  const typeSel = document.getElementById('f_type');
  if(typeSel && !orderDraft.id) typeSel.value = 'Cesta Básica';
  refreshOrderModal();
}
function removeOrderBasket(i){ orderDraft.baskets.splice(i,1); refreshOrderModal(); }
function useBasketPrice(){
  orderDraft.saleValue = round2(orderBasketsPrice(orderDraft));
  refreshOrderModal();
}
// Movimentações de saída que o pedido gera (uma por produto)
function orderStockMoves(o){
  if(!o.stockOut) return [];
  const byProduct = {};
  (o.baskets||[]).forEach(b=> (b.items||[]).forEach(it=>{
    if(!productById(it.productId)) return;
    byProduct[it.productId] = (byProduct[it.productId]||0) + (Number(it.qty)||0) * (Number(b.qty)||0);
  }));
  return Object.entries(byProduct).filter(([,q])=> q>0).map(([productId, qty])=> ({ productId, type:'saida', qty, date: o.date, notes: 'Pedido: ' + clientName(o.clientId) }));
}
function renderCostRows(){
  const o = orderDraft;
  if(o.costs.length===0) return `<div class="field-hint">Nenhum custo adicionado ainda.</div>`;
  return o.costs.map((c,i)=> `<div class="mini-row">
    <div class="mr-cat">${escapeHtml(c.category)}</div>
    <div class="mr-desc">${escapeHtml(c.description||'')} ${c.hasReceipt? '<span class="badge badge-green" style="margin-left:4px;">com nota</span>' : '<span class="badge badge-gray" style="margin-left:4px;">sem nota</span>'}</div>
    <div class="mr-val">${fmtBRL(c.value)}</div>
    <button class="icon-btn mr-del" aria-label="Remover custo" onclick="removeCostRow(${i})">${ic('trash')}</button>
  </div>`).join('');
}
function renderPaymentRows(){
  const o = orderDraft;
  if(o.payments.length===0) return `<div class="field-hint">Nenhum pagamento registrado ainda.</div>`;
  return o.payments.map((p,i)=> `<div class="mini-row">
    <div class="mr-cat">${fmtDate(p.date)}</div>
    <div class="mr-desc">${escapeHtml(p.method||'')}</div>
    <div class="mr-val" style="color:var(--green-400);">${fmtBRL(p.value)}</div>
    <button class="icon-btn mr-del" aria-label="Remover pagamento" onclick="removePaymentRow(${i})">${ic('trash')}</button>
  </div>`).join('');
}
function addCostRow(){
  const cat = document.getElementById('nc_cat').value;
  const desc = document.getElementById('nc_desc').value.trim();
  const val = parseFloat(document.getElementById('nc_val').value)||0;
  const hasReceipt = document.getElementById('nc_receipt').checked;
  if(val<=0){ toast('Informe um valor de custo maior que zero.', 'error'); document.getElementById('nc_val').focus(); return; }
  orderDraft.costs.push({id:uid(), category:cat, description:desc, value:val, hasReceipt});
  document.getElementById('nc_desc').value=''; document.getElementById('nc_val').value=''; document.getElementById('nc_receipt').checked=false;
  refreshOrderModal();
}
function removeCostRow(i){ orderDraft.costs.splice(i,1); refreshOrderModal(); }
function addPaymentRow(){
  const date = document.getElementById('np_date').value || todayISO();
  const val = parseFloat(document.getElementById('np_val').value)||0;
  const method = document.getElementById('np_method').value.trim();
  if(val<=0){ toast('Informe um valor de pagamento maior que zero.', 'error'); document.getElementById('np_val').focus(); return; }
  orderDraft.payments.push({id:uid(), date, value:val, method});
  document.getElementById('np_val').value=''; document.getElementById('np_method').value='';
  refreshOrderModal();
}
function removePaymentRow(i){ orderDraft.payments.splice(i,1); refreshOrderModal(); }
function refreshOrderModal(){
  // preserve current field values before re-render
  const cur = {
    clientId: document.getElementById('f_clientId')?.value,
    date: document.getElementById('f_date')?.value,
    type: document.getElementById('f_type')?.value,
    description: document.getElementById('f_description')?.value,
    notes: document.getElementById('f_notes')?.value,
  };
  if(cur.clientId!==undefined) orderDraft.clientId = cur.clientId;
  if(cur.date) orderDraft.date = cur.date;
  if(cur.type) orderDraft.type = cur.type;
  if(cur.description!==undefined) orderDraft.description = cur.description;
  if(cur.notes!==undefined) orderDraft.notes = cur.notes;
  document.getElementById('modalRoot').innerHTML = orderModalHtml(!!orderDraft.id);
  renderOrderTotals();
}
function renderOrderTotals(){
  const box = document.getElementById('orderTotalsBox');
  const disp = document.getElementById('costTotalDisplay');
  if(disp) disp.textContent = fmtBRL(orderCostRowsTotal(orderDraft));
  if(!box) return;
  const sale = Number(orderDraft.saleValue)||0;
  const cost = orderTotalCost(orderDraft);
  const profit = sale - cost;
  const margin = sale>0 ? (profit/sale)*100 : 0;
  const paid = orderPaid(orderDraft);
  const balance = sale - paid;
  box.innerHTML = `<div class="subblock" style="margin-bottom:0;">
    <div class="calc-line"><span>Custo total</span><b class="mono">${fmtBRL(cost)}</b></div>
    <div class="calc-line"><span>Lucro bruto</span><b class="mono" style="color:${profit>=0?'var(--pos)':'var(--neg)'}">${fmtBRL(profit)}</b></div>
    <div class="calc-line"><span>Margem</span><b class="mono">${fmtPct(margin)}</b></div>
    <div class="calc-line"><span>Recebido</span><b class="mono">${fmtBRL(paid)}</b></div>
    <div class="calc-line"><span>Saldo a receber</span><b class="mono" style="color:${balance>0.005?'var(--gold)':'var(--text)'}">${fmtBRL(Math.max(0,balance))}</b></div>
    ${balance < -0.005 ? `<div class="warn-box danger" style="margin:10px 0 0;">Os pagamentos somam ${fmtBRL(-balance)} a mais que o valor cobrado. Confira os valores.</div>` : ''}
  </div>`;
}
function saveOrderAndReceipt(){
  const id = saveOrder();
  if(!id) return;
  const o = DB.orders.find(x=> x.id===id);
  if(o) openReceiptPicker(o.clientId, id);
}
function saveOrder(){
  const clientId = document.getElementById('f_clientId').value;
  if(!clientId){ toast('Selecione um cliente. Se ainda não existe, cadastre em Clientes.', 'error'); return; }
  const saleValue = parseFloat(document.getElementById('f_saleValue').value)||0;
  if(saleValue < 0){ toast('O valor cobrado não pode ser negativo.', 'error'); return; }
  if(saleValue === 0 && !confirm('O valor cobrado do cliente está zerado. Salvar mesmo assim?')) return;
  const data = {
    clientId,
    date: document.getElementById('f_date').value || todayISO(),
    type: document.getElementById('f_type').value,
    saleValue,
    description: document.getElementById('f_description').value.trim(),
    notes: document.getElementById('f_notes').value.trim(),
    costs: orderDraft.costs,
    payments: orderDraft.payments,
    overdue: orderDraft.overdue,
    receipts: orderDraft.receipts||[],
    baskets: orderDraft.baskets,
    stockOut: !!orderDraft.stockOut,
  };
  const id = orderDraft.id || uid();
  const moves = orderStockMoves(data);
  if(moves.length){
    const map = stockMap({kind:'order', id});
    const short = moves.filter(m=> (map[m.productId]||0) < m.qty).map(m=> `${productName(m.productId)} (tem ${fmtQty(map[m.productId]||0)}, precisa ${fmtQty(m.qty)})`);
    if(short.length && !confirm('Estoque insuficiente para:\n\n' + short.join('\n') + '\n\nSalvar mesmo assim? O estoque desses produtos ficará negativo.')) return;
  }
  if(orderDraft.id){
    const o = DB.orders.find(x=>x.id===orderDraft.id);
    Object.assign(o, data);
  } else {
    DB.orders.push({ id, ...data });
  }
  setMovesForRef('order', id, moves);
  saveDB(); closeModal(); orderDraft=null; render(); toast(moves.length ? 'Pedido salvo e estoque atualizado.' : 'Pedido salvo.');
  return id;
}

function openPurchaseModal(id){

    <div class="subblock">
      <div class="subblock-head"><div class="subblock-title">Itens da nota (opcional)</div></div>
      <div class="field-hint" style="margin-bottom:8px;">Informe os produtos para atualizar o custo de cada um, usado no cálculo das cestas.</div>
      <div id="purchaseItemsBox">${renderPurchaseItems()}</div>
      ${DB.products.length ? `
      <div class="add-row-form">
        <select class="f-prod" id="pi_prod" aria-label="Produto">${DB.products.slice().sort((x,y)=>x.name.localeCompare(y.name)).map(pr=>`<option value="${pr.id}">${escapeHtml(pr.name)}</option>`).join('')}</select>
        <input class="f-qty" id="pi_qty" type="number" min="0" step="0.001" placeholder="Qtd" aria-label="Quantidade">
        <input class="f-val" id="pi_cost" type="number" min="0" step="0.01" placeholder="Valor un." aria-label="Valor unitário">
        <button class="btn btn-ghost btn-sm" onclick="addPurchaseItem()">${ic('plus')} Add</button>
      </div>` : `<div class="field-hint">Cadastre produtos em "Estoque" para lançar itens.</div>`}
      <label class="checkbox-row" style="font-size:12px; color:var(--text-dim); margin-top:10px;"><input type="checkbox" id="pf_toStock" ${purchaseDraft.toStock?'checked':''} onchange="purchaseDraft.toStock=this.checked;"> Colocar estes itens no estoque</label>
      <div class="field-hint">Desmarque quando a compra foi feita para um pedido e já saiu direto para o cliente.</div>
    </div>

    <div class="field"><label for="pf_products">Produtos (texto livre)</label><textarea id="pf_products">${escapeHtml(p.products||'')}</textarea></div>
    <div class="field-row">
      <div class="field" id="pf_total_field"><label for="pf_total">Valor total (R$) *</label><input type="number" step="0.01" min="0" id="pf_total" value="${p.total}"></div>
      <div class="field"><label for="pf_method">Forma de pagamento</label><input id="pf_method" value="${escapeHtml(p.paymentMethod||'')}"></div>

      <input type="checkbox" id="pf_receipt" ${p.hasReceipt?'checked':''} onchange="document.getElementById('noReceiptNote').style.display=this.checked?'none':'block';">

    </div>
    <div id="noReceiptNote" class="field-hint" style="display:${p.hasReceipt?'none':'block'}; margin-bottom:12px;">Será registrada como "Compra sem comprovante, já lançada". Isso não impede o cálculo do custo.</div>

    <div>${editing ? `<button class="btn btn-danger btn-sm" onclick="if(deletePurchase('${p.id}')) closeModal();">${ic('trash')} Excluir</button>` : '<span></span>'}</div>
    <div style="display:flex; gap:8px;"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="savePurchase('${p.id||''}')">Salvar compra</button></div>

function purchaseItemsTotal(items){ return round2((items||[]).reduce((s,it)=> s + (Number(it.qty)||0)*(Number(it.unitCost)||0), 0)); }
function renderPurchaseItems(){
  const items = purchaseDraft.items;
  if(items.length===0) return `<div class="field-hint">Nenhum item lançado.</div>`;
  return items.map((it,i)=> `<div class="mini-row">
    <div class="mr-qty">${fmtQty(it.qty)} ×</div>
    <div class="mr-desc">${escapeHtml(productName(it.productId))} <span class="client-row-sub">${fmtBRL(it.unitCost)} cada</span></div>
    <div class="mr-val">${fmtBRL((Number(it.qty)||0)*(Number(it.unitCost)||0))}</div>
    <button class="icon-btn mr-del" aria-label="Remover item" onclick="removePurchaseItem(${i})">${ic('trash')}</button>
  </div>`).join('') + `<div class="totals-mini"><span>Soma dos itens</span><b>${fmtBRL(purchaseItemsTotal(items))}</b></div>`;
}
// Se o total estava vazio ou igual à soma anterior, acompanha a soma dos itens
function syncPurchaseTotal(prevSum){
  const input = document.getElementById('pf_total');
  const cur = parseFloat(input.value)||0;
  if(cur===0 || Math.abs(cur - prevSum) < 0.005) input.value = purchaseItemsTotal(purchaseDraft.items).toFixed(2);
}
function addPurchaseItem(){
  const productId = document.getElementById('pi_prod').value;
  const qty = parseFloat(document.getElementById('pi_qty').value)||0;
  const unitCost = parseFloat(document.getElementById('pi_cost').value)||0;
  if(qty<=0){ toast('Informe a quantidade do item.', 'error'); document.getElementById('pi_qty').focus(); return; }
  if(unitCost<=0){ toast('Informe o valor unitário do item.', 'error'); document.getElementById('pi_cost').focus(); return; }
  const prev = purchaseItemsTotal(purchaseDraft.items);
  purchaseDraft.items.push({ productId, qty, unitCost });
  document.getElementById('pi_qty').value=''; document.getElementById('pi_cost').value='';
  document.getElementById('purchaseItemsBox').innerHTML = renderPurchaseItems();
  syncPurchaseTotal(prev);
}
function removePurchaseItem(i){
  const prev = purchaseItemsTotal(purchaseDraft.items);
  purchaseDraft.items.splice(i,1);
  document.getElementById('purchaseItemsBox').innerHTML = renderPurchaseItems();
  syncPurchaseTotal(prev);
}
// Atualiza o "último custo" do produto quando a compra é a mais recente
function applyPurchaseCosts(purchase){
  (purchase.items||[]).forEach(it=>{
    const p = productById(it.productId);
    if(!p) return;
    if(!p.costDate || purchase.date >= p.costDate){ p.cost = Number(it.unitCost)||0; p.costDate = purchase.date; if(purchase.supplierId) p.supplierId = purchase.supplierId; }
  });
}
function savePurchase(id){
  const total = parseFloat(document.getElementById('pf_total').value)||0;
  if(total<=0){ toast('Informe o valor total da compra.', 'error'); document.getElementById('pf_total').focus(); return; }
  const itemsSum = purchaseItemsTotal(purchaseDraft.items);
  if(purchaseDraft.items.length && Math.abs(itemsSum-total) > 0.01 && !confirm(`A soma dos itens (${fmtBRL(itemsSum)}) é diferente do valor total (${fmtBRL(total)}). Salvar mesmo assim?`)) return;
  const supplierText = document.getElementById('pf_supplier').value.trim();
  let sup = supplierByName(supplierText);
  let createdSupplier = false;
  if(supplierText && !sup){ sup = newSupplierRecord(supplierText); DB.suppliers.push(sup); createdSupplier = true; }
  const data = {
    date: document.getElementById('pf_date').value || todayISO(),
    supplier: sup ? sup.name : '',
    supplierId: sup ? sup.id : null,
    clientId: document.getElementById('pf_client').value || null,
    description: document.getElementById('pf_desc').value.trim(),
    products: document.getElementById('pf_products').value.trim(),
    total,
    paymentMethod: document.getElementById('pf_method').value.trim(),
    hasReceipt: document.getElementById('pf_receipt').checked,
    notes: document.getElementById('pf_notes').value.trim(),
    items: purchaseDraft.items,
    toStock: !!purchaseDraft.toStock,
  };
  const pid = id || uid();
  if(id){
    const p = DB.purchases.find(x=>x.id===id);
    Object.assign(p, data);
  } else {
    DB.purchases.push({ id: pid, ...data });
  }
  applyPurchaseCosts(data);
  setMovesForRef('purchase', pid, data.toStock ? data.items.map(it=> ({ productId: it.productId, type:'entrada', qty: Number(it.qty)||0, unitCost: Number(it.unitCost)||0, date: data.date, notes: 'Compra: ' + (data.supplier || 'sem fornecedor') })) : []);
  saveDB(); closeModal(); purchaseDraft = null; render();
  toast(createdSupplier ? `Compra salva. Fornecedor "${sup.name}" cadastrado.` : 'Compra salva.');
}

/* ============================================================
   ESTOQUE (produtos e movimentações)
   ============================================================ */
function renderStock(){
  const map = stockMap();
  const q = state.searchProducts.toLowerCase();
  let list = DB.products.filter(p=> p.name.toLowerCase().includes(q) || (p.category||'').toLowerCase().includes(q));
  if(state.stockOnlyLow) list = list.filter(p=> stockStatus(p, map[p.id]||0) !== 'ok');
  list.sort((a,b)=> a.name.localeCompare(b.name));
  const stockValue = DB.products.reduce((s,p)=> s + Math.max(0, map[p.id]||0) * (Number(p.cost)||0), 0);
  const low = DB.products.filter(p=> stockStatus(p, map[p.id]||0)==='baixo').length;
  const zero = DB.products.filter(p=> (map[p.id]||0) <= 0).length;
  const recentMoves = DB.stockMoves.slice().sort((a,b)=> (b.date||'').localeCompare(a.date||'')).slice(0,15);
  return `
    <div class="topbar">
      <div>
        <div class="page-title">Estoque</div>
        <div class="page-sub">${DB.products.length} produto(s) cadastrado(s)</div>
      </div>
      <div class="toolbar-right">
        <button class="btn btn-ghost" onclick="openMoveModal()" ${DB.products.length?'':'disabled'}>${ic('swap')} Movimentar</button>
        <button class="btn btn-primary" onclick="openProductModal()">${ic('plus')} Novo produto</button>
      </div>
    </div>
    <div class="grid grid-4">
      ${statCard('Valor em estoque', fmtBRL(stockValue), 'revenue', 'Quantidade × último custo')}
      ${statCard('Produtos', DB.products.length, 'orders', 'Itens cadastrados')}
      ${statCard('Abaixo do mínimo', low, 'cost', 'Repor em breve')}
      ${statCard('Zerados', zero, 'pending', 'Sem saldo em estoque')}
    </div>
    <div class="toolbar" style="margin-top:20px;">
      <div class="search-box">${ic('search')}<input id="s_products" aria-label="Buscar produto" placeholder="Buscar produto ou categoria..." value="${escapeHtml(state.searchProducts)}" oninput="state.searchProducts=this.value; render();"></div>
      <div class="toolbar-right">
        <button class="chip ${state.stockOnlyLow?'':'active'}" onclick="state.stockOnlyLow=false; render();">Todos</button>
        <button class="chip ${state.stockOnlyLow?'active':''}" onclick="state.stockOnlyLow=true; render();">Precisam de reposição</button>
      </div>
    </div>
    ${list.length===0 ? `<div class="card">${DB.products.length===0
      ? emptyState('box','Nenhum produto cadastrado','Cadastre os produtos que entram nas cestas. O custo de cada um alimenta o cálculo automático das cestas.', "openProductModal()", "Novo produto")
      : emptyState('box','Nenhum produto encontrado', state.stockOnlyLow ? 'Nenhum produto precisa de reposição agora.' : 'Tente outra busca.')}</div>` : `
    <div class="table-wrap"><table><thead><tr>
      <th>Produto</th><th>Status</th><th class="td-num">Estoque</th><th class="td-num">Mínimo</th><th class="td-num">Último custo</th><th class="td-num">Valor</th><th></th>
    </tr></thead><tbody>
      ${list.map(p=>{
        const qty = map[p.id]||0, st = stockStatus(p, qty);
        const badge = st==='zerado' ? '<span class="badge badge-red">Zerado</span>' : st==='baixo' ? '<span class="badge badge-gold">Baixo</span>' : '<span class="badge badge-green">OK</span>';
        return `<tr onclick="openProductModal('${p.id}')">
          <td><div class="client-row-name">${escapeHtml(p.name)}</div><div class="client-row-sub">${escapeHtml(p.category||'Sem categoria')}${p.supplierId && supplierById(p.supplierId) ? ' · ' + escapeHtml(supplierById(p.supplierId).name) : ''}</div></td>
          <td>${badge}</td>
          <td class="td-num">${fmtQty(qty)} ${escapeHtml(p.unit||'un')}</td>
          <td class="td-num">${Number(p.minStock)>0 ? fmtQty(p.minStock) : '—'}</td>
          <td class="td-num">${Number(p.cost)>0 ? fmtBRL(p.cost) : '<span class="badge badge-red">sem custo</span>'}</td>
          <td class="td-num">${fmtBRL(Math.max(0,qty)*(Number(p.cost)||0))}</td>
          <td class="td-actions"><button class="icon-btn" aria-label="Movimentar estoque" title="Movimentar" onclick="event.stopPropagation(); openMoveModal('${p.id}')">${ic('swap')}</button></td>
        </tr>`;
      }).join('')}
    </tbody></table></div>`}

    <div class="section-title">Últimas movimentações <span class="hint">entradas de compras, saídas de pedidos e ajustes</span></div>
    ${recentMoves.length===0 ? `<div class="card">${emptyState('swap','Nenhuma movimentação','Compras com itens, pedidos com cestas e ajustes manuais aparecem aqui.')}</div>` : `
    <div class="table-wrap"><table><thead><tr><th>Data</th><th>Produto</th><th>Tipo</th><th>Origem</th><th class="td-num">Quantidade</th><th></th></tr></thead><tbody>
      ${recentMoves.map(m=>{
        const tb = m.type==='entrada' ? '<span class="badge badge-green">Entrada</span>' : m.type==='saida' ? '<span class="badge badge-red">Saída</span>' : '<span class="badge badge-gold">Ajuste</span>';
        const origin = m.refKind==='purchase' ? 'Compra' : m.refKind==='order' ? 'Pedido' : 'Manual';
        const signed = moveSigned(m);
        return `<tr style="cursor:default;">
          <td>${fmtDate(m.date)}</td>
          <td>${escapeHtml(productName(m.productId))}</td>
          <td>${tb}</td>
          <td><div>${origin}</div><div class="client-row-sub">${escapeHtml(m.notes||'')}</div></td>
          <td class="td-num" style="color:${signed>=0?'var(--pos)':'var(--neg)'}">${signed>0?'+':''}${fmtQty(signed)}</td>
          <td class="td-actions">${m.refKind ? '' : `<button class="icon-btn" aria-label="Excluir movimentação" onclick="deleteMove('${m.id}')">${ic('trash')}</button>`}</td>
        </tr>`;
      }).join('')}
    </tbody></table></div>`}
  `;
}
function deleteMove(id){
  if(!confirm('Excluir esta movimentação manual? O saldo do produto será recalculado.')) return;
  DB.stockMoves = DB.stockMoves.filter(m=> m.id!==id);
  saveDB(); render(); toast('Movimentação excluída.');
}

function saveProduct(id){
  const nameEl = document.getElementById('pr_name');
  const name = nameEl.value.trim();
  if(!name){ toast('Informe o nome do produto.', 'error'); nameEl.focus(); return; }
  const dup = DB.products.find(x=> x.id!==id && x.name.trim().toLowerCase()===name.toLowerCase());
  if(dup){ toast('Já existe um produto com esse nome.', 'error'); nameEl.focus(); return; }
  const cost = parseFloat(document.getElementById('pr_cost').value)||0;
  const minStock = parseFloat(document.getElementById('pr_min').value)||0;
  if(cost<0 || minStock<0){ toast('Custo e estoque mínimo não podem ser negativos.', 'error'); return; }
  const data = {
    name,
    category: document.getElementById('pr_category').value,
    unit: document.getElementById('pr_unit').value,
    cost, minStock,
    supplierId: document.getElementById('pr_supplier').value || null,
    notes: document.getElementById('pr_notes').value.trim(),
  };
  if(id){
    const p = productById(id);
    if(Math.abs((Number(p.cost)||0) - cost) > 0.0001) data.costDate = todayISO();
    Object.assign(p, data);
  } else {
    const nid = uid();
    DB.products.push({ id: nid, createdAt: todayISO(), costDate: cost>0 ? todayISO() : null, ...data });
    const initial = parseFloat(document.getElementById('pr_initial').value)||0;
    if(initial > 0) DB.stockMoves.push({ id: uid(), productId: nid, type:'ajuste', qty: initial, date: todayISO(), notes:'Saldo inicial' });
  }
  saveDB(); closeModal(); render(); toast('Produto salvo.');
}
function deleteProduct(id){
  const inBaskets = DB.baskets.filter(b=> (b.items||[]).some(it=> it.productId===id));
  if(inBaskets.length){ toast('Este produto está na composição de: ' + inBaskets.map(b=>b.name).join(', ') + '. Remova da cesta antes.', 'error'); return; }
  if(!confirm('Excluir este produto e todas as movimentações de estoque dele?')) return;
  DB.products = DB.products.filter(p=> p.id!==id);
  DB.stockMoves = DB.stockMoves.filter(m=> m.productId!==id);
  DB.purchases.forEach(pu=> { pu.items = (pu.items||[]).filter(it=> it.productId!==id); });
  saveDB(); closeModal(); render(); toast('Produto excluído.');
}

function openMoveModal(productId){
  if(!DB.products.length){ toast('Cadastre um produto primeiro.', 'error'); return; }
  const sorted = DB.products.slice().sort((a,b)=> a.name.localeCompare(b.name));
  const body = `
    <div class="field"><label for="mv_product">Produto *</label><select id="mv_product" onchange="updateMoveHint()">${sorted.map(p=>`<option value="${p.id}" ${p.id===productId?'selected':''}>${escapeHtml(p.name)}</option>`).join('')}</select>
      <div class="field-hint" id="mv_current"></div></div>
    <div class="field-row">
      <div class="field"><label for="mv_type">Tipo *</label><select id="mv_type" onchange="updateMoveHint()">
        <option value="entrada">Entrada (chegou produto)</option>
        <option value="saida">Saída (perda, doação, uso)</option>
        <option value="ajuste">Ajuste por contagem</option>
      </select></div>
      <div class="field"><label for="mv_date">Data *</label><input type="date" id="mv_date" value="${todayISO()}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label for="mv_qty" id="mv_qty_label">Quantidade *</label><input type="number" step="0.001" min="0" id="mv_qty"></div>
      <div class="field" id="mv_cost_field"><label for="mv_cost">Custo unitário (opcional)</label><input type="number" step="0.01" min="0" id="mv_cost"><div class="field-hint">Se informado, atualiza o último custo.</div></div>
    </div>
    <div class="field"><label for="mv_notes">Motivo / observação</label><input id="mv_notes" placeholder="Ex: Avaria, contagem do mês"></div>
    <div class="field-hint">Para compras com nota, prefira lançar em "Compras" com os itens: o estoque e o custo são atualizados juntos.</div>
  `;
  const foot = `<span></span><div style="display:flex; gap:8px;"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveMove()">Registrar</button></div>`;
  document.getElementById('modalRoot').innerHTML = modalShell('Movimentar estoque', body, foot);
  updateMoveHint();
}
function updateMoveHint(){
  const p = productById(document.getElementById('mv_product').value);
  const type = document.getElementById('mv_type').value;
  document.getElementById('mv_current').textContent = p ? `Saldo atual: ${fmtQty(productStock(p.id))} ${p.unit||'un'}` : '';
  document.getElementById('mv_qty_label').textContent = type==='ajuste' ? 'Quantidade contada (novo saldo) *' : 'Quantidade *';
  document.getElementById('mv_cost_field').style.display = type==='entrada' ? '' : 'none';
}
function saveMove(){
  const productId = document.getElementById('mv_product').value;
  const type = document.getElementById('mv_type').value;
  const raw = document.getElementById('mv_qty').value;
  const qty = parseFloat(raw);
  if(raw==='' || !isFinite(qty) || qty<0 || (type!=='ajuste' && qty===0)){ toast(type==='ajuste' ? 'Informe a quantidade contada.' : 'Informe uma quantidade maior que zero.', 'error'); document.getElementById('mv_qty').focus(); return; }
  const date = document.getElementById('mv_date').value || todayISO();
  const notes = document.getElementById('mv_notes').value.trim();
  const current = productStock(productId);
  if(type==='saida' && qty > current && !confirm(`O saldo atual é ${fmtQty(current)}. A saída vai deixar o estoque negativo. Continuar?`)) return;
  const move = { id: uid(), productId, type, date, notes: notes || (type==='ajuste' ? 'Ajuste por contagem' : '') };
  move.qty = type==='ajuste' ? round2(qty - current) : qty;
  if(type==='ajuste' && Math.abs(move.qty) < 0.0001){ toast('O saldo já está igual à contagem. Nada a ajustar.'); closeModal(); return; }
  const cost = parseFloat(document.getElementById('mv_cost').value)||0;
  if(type==='entrada' && cost>0){ move.unitCost = cost; const p = productById(productId); if(p && (!p.costDate || date >= p.costDate)){ p.cost = cost; p.costDate = date; } }
  DB.stockMoves.push(move);
  saveDB(); closeModal(); render(); toast('Estoque atualizado.');
}

let basketDraft = null;
function openBasketModal(id){
  if(!DB.products.length){ toast('Cadastre produtos no Estoque antes de montar uma cesta.', 'error'); return; }
  const editing = id ? DB.baskets.find(b=>b.id===id) : null;
  basketDraft = editing ? JSON.parse(JSON.stringify(editing)) : { id:null, name:'', price:0, items:[], notes:'', active:true, targetMargin:25 };
  if(basketDraft.targetMargin===undefined) basketDraft.targetMargin = 25;
  const b = basketDraft;
  const body = `
    <div class="field-row">
      <div class="field"><label for="bk_name">Nome da cesta *</label><input id="bk_name" value="${escapeHtml(b.name)}" placeholder="Ex: Cesta Básica P"></div>
      <div class="field"><label for="bk_price">Preço de venda (R$)</label><input type="number" step="0.01" min="0" id="bk_price" value="${b.price||0}" oninput="basketDraft.price=parseFloat(this.value)||0; renderBasketTotals();"></div>
    </div>
    <div class="subblock">
      <div class="subblock-head"><div class="subblock-title">Composição</div></div>
      <div id="basketItemsBox">${renderBasketItems()}</div>
      <div class="add-row-form">
        <select class="f-prod" id="bi_prod" aria-label="Produto">${DB.products.slice().sort((x,y)=>x.name.localeCompare(y.name)).map(p=>`<option value="${p.id}">${escapeHtml(p.name)} (${escapeHtml(p.unit||'un')})</option>`).join('')}</select>
        <input class="f-qty" id="bi_qty" type="number" min="0" step="0.001" value="1" aria-label="Quantidade por cesta">
        <button class="btn btn-ghost btn-sm" onclick="addBasketItem()">${ic('plus')} Add</button>
      </div>
    </div>
    <div id="basketTotals"></div>
    <div class="field checkbox-row" style="margin-top:14px;">
      <input type="checkbox" id="bk_active" ${b.active!==false?'checked':''}>
      <label for="bk_active" style="margin:0; text-transform:none; font-size:12.5px;">Cesta ativa (aparece no lançamento de pedidos)</label>
    </div>
    <div class="field"><label for="bk_notes">Observações</label><textarea id="bk_notes">${escapeHtml(b.notes||'')}</textarea></div>
  `;
  const foot = `
    <div>${editing ? `<button class="btn btn-danger btn-sm" onclick="deleteBasket('${b.id}')">${ic('trash')} Excluir</button>` : '<span></span>'}</div>
    <div style="display:flex; gap:8px;"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveBasket()">Salvar cesta</button></div>
  `;
  document.getElementById('modalRoot').innerHTML = modalShell(editing?'Editar cesta':'Nova cesta', body, foot);
  renderBasketTotals();
}
function renderBasketItems(){
  const items = basketDraft.items;
  if(!items.length) return `<div class="field-hint">Adicione os produtos e a quantidade de cada um por cesta.</div>`;
  return items.map((it,i)=>{
    const p = productById(it.productId);
    const unitCost = p ? Number(p.cost)||0 : 0;
    return `<div class="mini-row">
      <div class="mr-qty">${fmtQty(it.qty)} ${escapeHtml(p?.unit||'')}</div>
      <div class="mr-desc">${escapeHtml(productName(it.productId))} ${unitCost>0 ? `<span class="client-row-sub">${fmtBRL(unitCost)} cada</span>` : '<span class="badge badge-red">sem custo</span>'}</div>
      <div class="mr-val">${fmtBRL((Number(it.qty)||0)*unitCost)}</div>
      <button class="icon-btn mr-del" aria-label="Remover item" onclick="removeBasketItem(${i})">${ic('trash')}</button>
    </div>`;
  }).join('');
}
function renderBasketTotals(){
  const box = document.getElementById('basketTotals');
  if(!box) return;
  const cost = basketUnitCost(basketDraft), price = Number(basketDraft.price)||0;
  const profit = price - cost, margin = price>0 ? profit/price*100 : 0;
  const tm = Number(basketDraft.targetMargin)||0;
  const suggested = tm>0 && tm<100 ? cost/(1-tm/100) : 0;
  box.innerHTML = `<div class="subblock" style="margin-bottom:0;">
    <div class="calc-line"><span>Custo por cesta</span><b class="mono">${fmtBRL(cost)}</b></div>
    <div class="calc-line"><span>Lucro por cesta</span><b class="mono" style="color:${profit>=0?'var(--pos)':'var(--neg)'}">${price>0 ? fmtBRL(profit) : '—'}</b></div>
    <div class="calc-line"><span>Margem</span><b class="mono">${price>0 ? fmtPct(margin) : '—'}</b></div>
    <div class="calc-line" style="align-items:center; gap:8px;"><span>Preço para margem de <input type="number" min="0" max="95" step="1" value="${tm}" aria-label="Margem desejada" style="width:56px; background:var(--surface); border:1px solid var(--border); border-radius:6px; color:var(--text); padding:3px 6px;" onchange="basketDraft.targetMargin=parseFloat(this.value)||0; renderBasketTotals();">%</span>
      <span><b class="mono">${suggested>0 ? fmtBRL(suggested) : '—'}</b> ${suggested>0 ? `<button class="inline-link" style="font-size:12px; margin-left:6px;" onclick="applySuggestedPrice(${round2(suggested)})">usar</button>` : ''}</span></div>
  </div>`;
}
function applySuggestedPrice(v){
  basketDraft.price = v;
  document.getElementById('bk_price').value = v.toFixed(2);
  renderBasketTotals();
}
function addBasketItem(){
  const productId = document.getElementById('bi_prod').value;
  const qty = parseFloat(document.getElementById('bi_qty').value)||0;
  if(qty<=0){ toast('Informe a quantidade por cesta.', 'error'); return; }
  const existing = basketDraft.items.find(it=> it.productId===productId);
  if(existing) existing.qty = round2((Number(existing.qty)||0) + qty);
  else basketDraft.items.push({ productId, qty });
  document.getElementById('bi_qty').value = 1;
  document.getElementById('basketItemsBox').innerHTML = renderBasketItems();
  renderBasketTotals();
}
function removeBasketItem(i){
  basketDraft.items.splice(i,1);
  document.getElementById('basketItemsBox').innerHTML = renderBasketItems();
  renderBasketTotals();
}
function saveBasket(){
  const name = document.getElementById('bk_name').value.trim();
  if(!name){ toast('Informe o nome da cesta.', 'error'); document.getElementById('bk_name').focus(); return; }
  if(!basketDraft.items.length){ toast('Adicione pelo menos um produto na composição.', 'error'); return; }
  const price = parseFloat(document.getElementById('bk_price').value)||0;
  if(price<0){ toast('O preço não pode ser negativo.', 'error'); return; }
  const data = { name, price, items: basketDraft.items, notes: document.getElementById('bk_notes').value.trim(), active: document.getElementById('bk_active').checked, targetMargin: basketDraft.targetMargin };
  if(basketDraft.id){ Object.assign(DB.baskets.find(b=>b.id===basketDraft.id), data); }
  else DB.baskets.push({ id: uid(), createdAt: todayISO(), ...data });
  saveDB(); closeModal(); basketDraft = null; render(); toast('Cesta salva.');
}
function deleteBasket(id){
  if(!confirm('Excluir esta cesta? Pedidos antigos que usaram ela continuam com o custo registrado.')) return;
  DB.baskets = DB.baskets.filter(b=> b.id!==id);
  saveDB(); closeModal(); render(); toast('Cesta excluída.');
}

function saveSupplier(id){
  const name = document.getElementById('sp_name').value.trim();
  if(!name){ toast('Informe o nome do fornecedor.', 'error'); document.getElementById('sp_name').focus(); return; }
  const dup = DB.suppliers.find(x=> x.id!==id && x.name.trim().toLowerCase()===name.toLowerCase());
  if(dup){ toast('Já existe um fornecedor com esse nome.', 'error'); return; }
  const data = {
    name,
    doc: document.getElementById('sp_doc').value.trim(),
    city: document.getElementById('sp_city').value.trim(),
    contact: document.getElementById('sp_contact').value.trim(),
    phone: document.getElementById('sp_phone').value.trim(),
    notes: document.getElementById('sp_notes').value.trim(),
  };
  if(id){
    Object.assign(supplierById(id), data);
    // mantém o nome em texto das compras igual ao cadastro
    DB.purchases.forEach(p=>{ if(p.supplierId===id) p.supplier = name; });
  } else DB.suppliers.push({ id: uid(), createdAt: todayISO(), ...data });
  saveDB(); closeModal(); render(); toast('Fornecedor salvo.');
}
function deleteSupplier(id){
  const n = supplierPurchases(id).length;
  if(!confirm(n ? `Este fornecedor tem ${n} compra(s). As compras continuam com o nome registrado, só o cadastro é removido. Excluir?` : 'Excluir este fornecedor?')) return;
  DB.suppliers = DB.suppliers.filter(s=> s.id!==id);
  DB.purchases.forEach(p=>{ if(p.supplierId===id) p.supplierId = null; });
  DB.products.forEach(p=>{ if(p.supplierId===id) p.supplierId = null; });
  saveDB(); closeModal(); render(); toast('Fornecedor excluído.');
}

/* ============================================================
   A RECEBER (saldo em aberto por cliente e baixa em lote)
   ============================================================ */
function openOrdersOf(clientId){
  return DB.orders.filter(o=> o.clientId===clientId && orderBalance(o) > 0.005).sort((a,b)=> a.date.localeCompare(b.date));
}
function daysSince(iso){ return Math.floor((new Date(todayISO()+'T00:00:00') - new Date(iso+'T00:00:00')) / 86400000); }

function renderReceivables(){
  const byClient = {};
  DB.orders.forEach(o=>{
    if(orderBalance(o) <= 0.005) return;
    const g = byClient[o.clientId] || (byClient[o.clientId] = { clientId:o.clientId, orders:[], charged:0, paid:0, due:0, oldest:o.date, overdue:false });
    g.orders.push(o);
    g.charged += Number(o.saleValue)||0; g.paid += orderPaid(o); g.due += orderBalance(o);
    if(o.date < g.oldest) g.oldest = o.date;
    if(o.overdue) g.overdue = true;
  });
  const groups = Object.values(byClient).sort((a,b)=> b.due - a.due);
  const totalDue = groups.reduce((s,g)=> s+g.due, 0);
  const overdueDue = groups.filter(g=> g.overdue).reduce((s,g)=> s+g.due, 0);

  // recebimentos recentes: pagamentos lançados juntos (mesmo lote) aparecem numa linha só
  const rows = {};
  DB.orders.forEach(o=> (o.payments||[]).forEach(p=>{
    const key = p.batchId || p.id;
    const r = rows[key] || (rows[key] = { key, date:p.date, clientId:o.clientId, method:p.method||'', value:0, orderIds:[] });
    r.value += Number(p.value)||0;
    if(!r.orderIds.includes(o.id)) r.orderIds.push(o.id);
  }));
  const recent = Object.values(rows).sort((a,b)=> (b.date||'').localeCompare(a.date||'')).slice(0,12);
  const monthStart = todayISO().slice(0,8)+'01';
  const receivedMonth = Object.values(rows).filter(r=> r.date >= monthStart).reduce((s,r)=> s+r.value, 0);

  return `
    <div class="topbar">
      <div>
        <div class="page-title">A receber</div>
        <div class="page-sub">Quanto cada cliente ainda deve, somando todos os pedidos em aberto</div>
      </div>
    </div>
    <div class="grid grid-3">
      ${statCard('Total a receber', fmtBRL(totalDue), 'pending', `${groups.length} cliente(s) com saldo`)}
      ${statCard('Em atraso', fmtBRL(overdueDue), 'cost', 'Pedidos marcados como atrasados')}
      ${statCard('Recebido no mês', fmtBRL(receivedMonth), 'revenue', 'Pagamentos lançados neste mês')}
    </div>

    <div class="section-title">Clientes com saldo em aberto</div>
    ${groups.length===0 ? `<div class="card">${emptyState('check','Nada a receber','Todos os pedidos estão pagos.')}</div>` : `
    <div class="table-wrap"><table><thead><tr>
      <th>Cliente</th><th>Pedidos em aberto</th><th class="td-num">Cobrado</th><th class="td-num">Já pago</th><th class="td-num">Saldo</th><th></th>
    </tr></thead><tbody>
      ${groups.map(g=>{
        const age = daysSince(g.oldest);
        return `<tr onclick="openSettleModal('${g.clientId}')">
          <td><div class="client-row-name">${escapeHtml(clientName(g.clientId))} ${g.overdue ? '<span class="badge badge-red">Em atraso</span>' : ''}</div>
            <div class="client-row-sub">mais antigo de ${fmtDate(g.oldest)}${age>0 ? ` · há ${age} dia(s)` : ''}</div></td>
          <td>${g.orders.map(o=> `<div class="client-row-sub" style="margin:0;">${fmtDate(o.date)} · ${escapeHtml(o.description||o.type||'Serviço')} · <span class="mono">${fmtBRL(orderBalance(o))}</span></div>`).join('')}</td>
          <td class="td-num">${fmtBRL(g.charged)}</td>
          <td class="td-num">${fmtBRL(g.paid)}</td>
          <td class="td-num" style="color:var(--gold); font-weight:700;">${fmtBRL(g.due)}</td>
          <td class="td-actions"><div style="display:inline-flex; gap:6px;">
            <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation(); showReceipt('${g.clientId}', ${escapeHtml(JSON.stringify(g.orders.map(o=>o.id)))}, {date: todayISO(), due:'', note:''})">${ic('receipt')} Demonstrativo</button>
            <button class="btn btn-primary btn-sm" onclick="event.stopPropagation(); openSettleModal('${g.clientId}')">${ic('check')} Dar baixa</button>
          </div></td>
        </tr>`;
      }).join('')}
    </tbody></table></div>`}

    <div class="section-title">Recebimentos recentes <span class="hint">um pagamento que cobriu vários pedidos aparece numa linha só</span></div>
    ${recent.length===0 ? `<div class="card">${emptyState('clock','Nenhum recebimento lançado','Os pagamentos registrados nos pedidos aparecem aqui.')}</div>` : `
    <div class="table-wrap"><table><thead><tr><th>Data</th><th>Cliente</th><th>Forma</th><th>Pedidos</th><th class="td-num">Valor</th><th></th></tr></thead><tbody>
      ${recent.map(r=> `<tr style="cursor:default;">
        <td>${fmtDate(r.date)}</td>
        <td>${escapeHtml(clientName(r.clientId))}</td>
        <td>${escapeHtml(r.method||'—')}</td>
        <td>${r.orderIds.length} pedido(s)</td>
        <td class="td-num" style="color:var(--pos);">${fmtBRL(r.value)}</td>
        <td class="td-actions"><button class="icon-btn" aria-label="Gerar recibo" title="Gerar recibo destes pedidos" onclick="showReceipt('${r.clientId}', ${escapeHtml(JSON.stringify(r.orderIds))}, {date: todayISO(), due:'', note:''})">${ic('receipt')}</button></td>
      </tr>`).join('')}
    </tbody></table></div>`}
  `;
}

function settleSelected(){
  const ids = [...document.querySelectorAll('.st-order:checked')].map(i=> i.value);
  return DB.orders.filter(o=> ids.includes(o.id)).sort((a,b)=> a.date.localeCompare(b.date));
}
function updateSettleTotal(){
  const sum = round2(settleSelected().reduce((s,o)=> s+orderBalance(o), 0));
  document.getElementById('st_sum').textContent = fmtBRL(sum);
  document.getElementById('st_value').value = sum.toFixed(2);
  updateSettlePreview();
}
// Distribui o valor do mais antigo para o mais novo
function allocatePayment(orders, value){
  let left = round2(value);
  return orders.map(o=>{
    const take = round2(Math.min(left, orderBalance(o)));
    left = round2(left - take);
    return { order:o, value: take };
  }).filter(a=> a.value > 0);
}
function updateSettlePreview(){
  const box = document.getElementById('st_preview');
  const orders = settleSelected();
  const value = parseFloat(document.getElementById('st_value').value)||0;
  const sum = round2(orders.reduce((s,o)=> s+orderBalance(o), 0));
  if(!orders.length){ box.innerHTML = `<div class="warn-box">Marque pelo menos um pedido.</div>`; return; }
  if(value > sum + 0.005){ box.innerHTML = `<div class="warn-box danger">O valor recebido é ${fmtBRL(value-sum)} maior que o saldo dos pedidos marcados. Confira o valor ou marque mais pedidos.</div>`; return; }
  if(value <= 0){ box.innerHTML = ''; return; }
  const alloc = allocatePayment(orders, value);
  const partial = value < sum - 0.005;
  box.innerHTML = `<div class="${partial ? 'warn-box' : 'subblock'}" style="margin-bottom:0;">
    ${partial ? `<div style="margin-bottom:6px;">Pagamento parcial: fica ${fmtBRL(sum-value)} em aberto.</div>` : '<div class="subblock-title" style="margin-bottom:6px;">Como fica</div>'}
    ${alloc.map(a=> `<div class="calc-line" style="padding:5px 0;"><span>${fmtDate(a.order.date)} · ${escapeHtml(a.order.description||a.order.type||'Serviço')}</span><b class="mono">${fmtBRL(a.value)}${Math.abs(a.value - orderBalance(a.order)) < 0.005 ? ' · quitado' : ''}</b></div>`).join('')}
  </div>`;
}
function settlePayment(clientId, withReceipt){
  const orders = settleSelected();
  if(!orders.length){ toast('Marque pelo menos um pedido.', 'error'); return; }
  const value = round2(parseFloat(document.getElementById('st_value').value)||0);
  const sum = round2(orders.reduce((s,o)=> s+orderBalance(o), 0));
  if(value <= 0){ toast('Informe o valor recebido.', 'error'); document.getElementById('st_value').focus(); return; }
  if(value > sum + 0.005){ toast('O valor recebido é maior que o saldo dos pedidos marcados.', 'error'); return; }
  const date = document.getElementById('st_date').value || todayISO();
  const method = document.getElementById('st_method').value.trim();
  const batchId = uid();
  const alloc = allocatePayment(orders, value);
  alloc.forEach(a=>{
    a.order.payments = a.order.payments || [];
    a.order.payments.push({ id: uid(), date, value: a.value, method, batchId });
    if(orderBalance(a.order) <= 0.005) a.order.overdue = false;
  });
  if(!saveDB()) return;
  closeModal(); render();
  const paidAll = alloc.every(a=> orderBalance(a.order) <= 0.005);
  toast(`Baixa de ${fmtBRL(value)} em ${alloc.length} pedido(s)${paidAll ? '' : ', com saldo restante'}.`);
  if(withReceipt) showReceipt(clientId, orders.map(o=>o.id), { date, due:'', note:'' });
}

function defaultBusiness(){
  return { name:'ABA Alimentos e Distribuição', doc:'', phone:'', city:'Gama · Brasília/DF', pix:'', footer:'Obrigado pela confiança.' };
}
function business(){ return Object.assign(defaultBusiness(), DB.settings.business||{}); }

// Linhas que o cliente vê: cestas com preço de venda quando batem com o total, senão o serviço inteiro
function receiptLines(o){
  const sale = round2(o.saleValue);
  const label = o.description || o.type || 'Serviço';
  const bs = o.baskets||[];
  if(bs.length && Math.abs(round2(orderBasketsPrice(o)) - sale) < 0.01){
    return bs.map(b=> ({ date:o.date, desc: b.name, qty: Number(b.qty)||0, unit: Number(b.unitPrice)||0, total: round2((Number(b.qty)||0)*(Number(b.unitPrice)||0)) }));
  }
  return [{ date:o.date, desc: label, qty: 1, unit: sale, total: sale }];
}
function receiptRecordFor(orderIds){
  const key = orderIds.slice().sort().join('|');
  if(!Array.isArray(DB.receipts)) DB.receipts = [];
  let r = DB.receipts.find(x=> x.key===key);
  if(!r){
    const next = DB.receipts.reduce((m,x)=> Math.max(m, x.number||0), 0) + 1;
    r = { id: uid(), key, number: next, orderIds: orderIds.slice(), createdAt: todayISO() };
    DB.receipts.push(r); saveDB();
  }
  return r;
}

let currentReceiptText = '';
let RC = null;   // recibo aberto: { clientId, orderIds, opts, record, lines, editing }

// Pagamentos do mesmo lote (um PIX que quitou vários pedidos) viram uma linha só
function receiptPayments(orders){
  const map = {};
  orders.forEach(o=> (o.payments||[]).forEach(p=>{
    const k = p.batchId || p.id;
    const g = map[k] || (map[k] = { date:p.date, method:p.method||'', value:0 });
    g.value = round2(g.value + (Number(p.value)||0));
  }));
  return Object.values(map).sort((a,b)=> (a.date||'').localeCompare(b.date||''));
}
function originalReceiptLines(orders){
  return orders.flatMap(receiptLines).map(l=> ({ date:l.date, desc:l.desc, qty:l.qty, unit:l.unit }));
}
function lineTotal(l){ return round2((Number(l.qty)||0) * (Number(l.unit)||0)); }

function showReceipt(clientId, orderIds, opts){
  const record = receiptRecordFor(orderIds);
  const orders = DB.orders.filter(o=> orderIds.includes(o.id)).sort((a,b)=> a.date.localeCompare(b.date));
  // se o recibo já foi editado antes, usa a versão editada; os pedidos nunca são alterados
  const lines = record.override && Array.isArray(record.override.lines) ? JSON.parse(JSON.stringify(record.override.lines)) : originalReceiptLines(orders);
  if(record.override && record.override.note && !opts.note) opts.note = record.override.note;
  RC = { clientId, orderIds: orderIds.slice(), opts, record, orders, lines, editing:false };
  const root = document.getElementById('receiptRoot');
  root.classList.add('open');
  document.body.classList.add('rc-printing');
  drawReceipt();
  root.scrollTop = 0;
}

  const c = DB.clients.find(x=> x.id===clientId);

  const total = round2(lines.reduce((s,l)=> s + lineTotal(l), 0));
  const ordersTotal = round2(orders.reduce((s,o)=> s + (Number(o.saleValue)||0), 0));
  const payments = receiptPayments(orders);
  const paid = round2(payments.reduce((s,p)=> s + p.value, 0));
  const due = round2(Math.max(0, total - paid));
  const settled = due < 0.005;
  const number = String(record.number).padStart(4,'0');
  const showQty = editing || lines.some(l=> Number(l.qty) !== 1);
  const addr = [c.address, c.city, c.cep ? 'CEP ' + c.cep : ''].filter(Boolean).join(' · ');
  const edited = !!record.override;
  const inp = 'class="rc-input"';

  const toolbar = editing ? `
  <div class="rc-toolbar no-print">
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="btn btn-ghost btn-sm" onclick="rcMergeLines()">Juntar tudo em uma linha</button>
      <button class="btn btn-ghost btn-sm" onclick="rcAddLine()">${ic('plus')} Linha</button>

    <button class="btn btn-primary btn-sm" onclick="rcFinishEdit()">${ic('check')} Concluir edição</button>
