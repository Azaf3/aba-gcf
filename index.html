  <div class="rc-toolbar no-print">
    <button class="btn btn-ghost btn-sm" onclick="closeReceipt()">${ic('x')} Fechar</button>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="btn btn-ghost btn-sm" onclick="rcStartEdit()">${ic('edit')} Editar</button>
      <button class="btn btn-ghost btn-sm" onclick="copyReceiptText()">Copiar como texto</button>
      <button class="btn btn-primary btn-sm" onclick="window.print()">${ic('receipt')} Imprimir ou salvar PDF</button>
    </div>
  </div>`;

  const notice = editing
    ? `<div class="rc-notice no-print">Editando só este recibo. Os pedidos e os valores do sistema não mudam.${Math.abs(total-ordersTotal) > 0.005 ? ` <b>Atenção:</b> os pedidos somam ${fmtBRL(ordersTotal)} e o recibo está mostrando ${fmtBRL(total)}.` : ''}</div>`
    : (edited ? `<div class="rc-notice no-print">Este recibo foi editado. Os pedidos continuam como foram lançados.${Math.abs(total-ordersTotal) > 0.005 ? ` Os pedidos somam ${fmtBRL(ordersTotal)} e o recibo mostra ${fmtBRL(total)}.` : ''}</div>` : '');

  const rowsHtml = lines.map((l,i)=> editing ? `<tr>
      <td><input type="date" ${inp} value="${escapeHtml(l.date||'')}" onchange="rcSet(${i},'date',this.value)" aria-label="Data"></td>
      <td><input ${inp} value="${escapeHtml(l.desc)}" oninput="rcSet(${i},'desc',this.value)" aria-label="Descrição"></td>
      <td class="rc-num-col"><input type="number" step="0.001" min="0" ${inp} style="width:64px; text-align:right;" value="${l.qty}" onchange="rcSet(${i},'qty',this.value)" aria-label="Quantidade"></td>
      <td class="rc-num-col"><input type="number" step="0.01" min="0" ${inp} style="width:104px; text-align:right;" value="${round2(l.unit).toFixed(2)}" onchange="rcSet(${i},'unit',this.value)" aria-label="Valor unitário"></td>
      <td class="rc-num-col">${fmtBRL(lineTotal(l))} <button class="icon-btn" style="display:inline-flex; vertical-align:middle; margin-left:4px;" aria-label="Remover linha" onclick="rcRemoveLine(${i})">${ic('trash')}</button></td>
    </tr>` : `<tr>
      <td>${fmtDate(l.date)}</td>
      <td>${escapeHtml(l.desc)}</td>
      ${showQty ? `<td class="rc-num-col">${fmtQty(l.qty)}</td><td class="rc-num-col">${fmtBRL(l.unit)}</td>` : ''}
      <td class="rc-num-col">${fmtBRL(lineTotal(l))}</td>
    </tr>`).join('');

  const html = `${toolbar}${notice}
  <article class="rc-paper" aria-label="Recibo">
    <header class="rc-head">
      <div class="rc-brand">
        <div class="rc-mark">A</div>
        <div>
          <div class="rc-biz">${escapeHtml(biz.name)}</div>
          <div class="rc-biz-sub">${[biz.doc ? 'CNPJ ' + biz.doc : '', biz.phone, biz.city].filter(Boolean).map(escapeHtml).join(' · ')}</div>
        </div>
      </div>
      <div class="rc-id">
        <div class="rc-title">${settled ? 'Recibo de pagamento' : 'Demonstrativo de pagamento'}</div>
        <div class="rc-num">Nº ${number} · ${fmtDate(opts.date)}</div>
      </div>
    </header>

    <section class="rc-client">
      <div class="rc-label">Cliente</div>
      <div class="rc-client-name">${escapeHtml(c.name)}</div>
      ${c.doc ? `<div class="rc-muted">CPF/CNPJ ${escapeHtml(c.doc)}</div>` : ''}
      ${addr ? `<div class="rc-muted">${escapeHtml(addr)}</div>` : ''}
    </section>

    <table class="rc-table">
      <thead><tr><th>Data</th><th>Serviço</th>${showQty ? '<th class="rc-num-col">Qtd</th><th class="rc-num-col">Valor un.</th>' : ''}<th class="rc-num-col">Valor</th></tr></thead>
      <tbody>${rowsHtml || `<tr><td colspan="5" class="rc-muted">Nenhuma linha.</td></tr>`}</tbody>
    </table>

    <section class="rc-totals">
      <div class="rc-line"><span>Total dos serviços</span><b>${fmtBRL(total)}</b></div>
      ${payments.map(p=> `<div class="rc-line rc-muted"><span>Pago em ${fmtDate(p.date)}${p.method ? ' · ' + escapeHtml(p.method) : ''}</span><span>− ${fmtBRL(p.value)}</span></div>`).join('')}
      <div class="rc-line rc-grand ${settled?'rc-ok':''}"><span>${settled ? 'Pago' : 'Valor a pagar'}</span><b>${fmtBRL(settled ? total : due)}</b></div>
      ${!settled && opts.due ? `<div class="rc-line rc-muted"><span>Vencimento</span><span>${fmtDate(opts.due)}</span></div>` : ''}
    </section>

    ${settled
      ? `<p class="rc-text">Recebemos de <b>${escapeHtml(c.name)}</b> a importância de <b>${fmtBRL(total)}</b> referente aos serviços listados acima.</p>`
      : (biz.pix ? `<div class="rc-pix"><div class="rc-label">Pagamento via PIX</div><div class="rc-pix-key">${escapeHtml(biz.pix)}</div></div>` : '')}
    ${editing
      ? `<div class="rc-text"><div class="rc-label" style="margin-bottom:4px;">Observação para o cliente</div><textarea ${inp} rows="2" oninput="RC.opts.note=this.value" placeholder="Ex: Referente às entregas de novembro">${escapeHtml(opts.note||'')}</textarea></div>`
      : (opts.note ? `<p class="rc-text">${escapeHtml(opts.note)}</p>` : '')}

    <footer class="rc-foot">
      ${settled ? `<div class="rc-sign"><div class="rc-sign-line"></div><div>${escapeHtml(biz.name)}</div></div>` : ''}
      ${biz.footer ? `<div class="rc-muted">${escapeHtml(biz.footer)}</div>` : ''}
    </footer>
  </article>`;

  // texto simples para colar numa mensagem
  const t = [];
  t.push(`*${biz.name}*`);
  t.push(`${settled ? 'Recibo de pagamento' : 'Demonstrativo de pagamento'} nº ${number} · ${fmtDate(opts.date)}`);
  t.push(`Cliente: ${c.name}`, '');
  lines.forEach(l=> t.push(`${fmtDate(l.date)} · ${l.desc}${Number(l.qty)!==1 ? ` (${fmtQty(l.qty)} × ${fmtBRL(l.unit)})` : ''}: ${fmtBRL(lineTotal(l))}`));
  t.push('', `Total: ${fmtBRL(total)}`);
  payments.forEach(p=> t.push(`Pago em ${fmtDate(p.date)}: ${fmtBRL(p.value)}`));
  t.push(settled ? '*Pago integralmente.*' : `*Valor a pagar: ${fmtBRL(due)}*`);
  if(!settled && opts.due) t.push(`Vencimento: ${fmtDate(opts.due)}`);
  if(!settled && biz.pix) t.push(`PIX: ${biz.pix}`);
  if(opts.note) t.push('', opts.note);
  currentReceiptText = t.join('\n');

  document.getElementById('receiptRoot').innerHTML = html;
}

/* --- edição do recibo (guarda só no registro do recibo, nunca nos pedidos) --- */
function rcStartEdit(){ RC.editing = true; drawReceipt(); }
function rcSet(i, field, val){
  const l = RC.lines[i]; if(!l) return;
  if(field==='qty' || field==='unit'){ const n = parseFloat(val); l[field] = isFinite(n) && n >= 0 ? n : 0; drawReceipt(); }
  else l[field] = val;   // texto: sem redesenhar para não perder o cursor
}
function rcAddLine(){ RC.lines.push({ date: RC.opts.date || todayISO(), desc:'', qty:1, unit:0 }); drawReceipt(); }
function rcRemoveLine(i){ RC.lines.splice(i,1); drawReceipt(); }
function rcMergeLines(){
  if(!RC.lines.length) return;
  const total = round2(RC.lines.reduce((s,l)=> s + lineTotal(l), 0));
  const types = [...new Set(RC.orders.map(o=> o.type).filter(Boolean))];
  const lastDate = RC.lines.map(l=> l.date).filter(Boolean).sort().pop() || RC.opts.date;
  RC.lines = [{ date: lastDate, desc: types.length===1 ? types[0] : 'Serviços prestados', qty:1, unit: total }];
  drawReceipt();
}
function rcRestore(){
  RC.lines = originalReceiptLines(RC.orders);
  delete RC.record.override;
  saveDB();
  drawReceipt();
  toast('Recibo voltou aos valores dos pedidos.');
}
function rcFinishEdit(){
  const bad = RC.lines.find(l=> !String(l.desc||'').trim());
  if(bad){ toast('Preencha a descrição de todas as linhas.', 'error'); return; }
  if(!RC.lines.length){ toast('O recibo precisa de pelo menos uma linha.', 'error'); return; }
  const original = JSON.stringify(originalReceiptLines(RC.orders));
  if(JSON.stringify(RC.lines) === original && !RC.opts.note) delete RC.record.override;
  else RC.record.override = { lines: JSON.parse(JSON.stringify(RC.lines)), note: RC.opts.note || '' };
  saveDB();
  RC.editing = false;
  drawReceipt();
  toast('Edição do recibo salva.');
}
function closeReceipt(){
  if(RC && RC.editing && !confirm('Sair sem concluir a edição? As mudanças deste recibo serão descartadas.')) return;
  RC = null;
  const root = document.getElementById('receiptRoot');
  root.classList.remove('open'); root.innerHTML = '';
  document.body.classList.remove('rc-printing');
}
function copyReceiptText(){
  const done = ()=> toast('Texto do recibo copiado.');
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(currentReceiptText).then(done, fallbackCopy);
  } else fallbackCopy();
  function fallbackCopy(){
    const ta = document.createElement('textarea');
    ta.value = currentReceiptText; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try{ ok = document.execCommand('copy'); }catch(_){}
    ta.remove();
    ok ? done() : toast('Não foi possível copiar. Selecione o texto do recibo manualmente.', 'error');
  }
}
function saveBusiness(){
  DB.settings.business = {
    name: document.getElementById('bz_name').value.trim() || defaultBusiness().name,
    doc: document.getElementById('bz_doc').value.trim(),
    phone: document.getElementById('bz_phone').value.trim(),
    city: document.getElementById('bz_city').value.trim(),
    pix: document.getElementById('bz_pix').value.trim(),
    footer: document.getElementById('bz_footer').value.trim(),
  };
  if(saveDB()) toast('Dados do recibo salvos.');
}

/* ============================================================
   AFTER RENDER / INIT
   ============================================================ */
function reducedMotion(){ return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }

// Copia o texto do cabeçalho para cada célula (data-label): no celular a linha vira card e mostra o rótulo.
function labelTables(){
  document.querySelectorAll('#viewRoot .table-wrap').forEach(wrap=>{
    const table = wrap.querySelector('table');
    if(!table || !table.tHead) return;
    const heads = Array.from(table.tHead.rows[0].cells).map(th=> th.textContent.trim());
    Array.from(table.tBodies[0] ? table.tBodies[0].rows : []).forEach(tr=>{
      Array.from(tr.cells).forEach((td,i)=>{ if(td.colSpan===1) td.setAttribute('data-label', heads[i]||''); });
    });
    wrap.classList.add('cardify');
  });
}

// Os números do topo sobem até o valor ao abrir a tela; no fim o texto original é restaurado.
function countUpStats(root){
  root.querySelectorAll('.stat-value').forEach(el=>{
    const final = el.textContent;
    const m = final.replace(/\s/g,' ').match(/-?[\d.]+(,\d+)?/);
    if(!m) return;
    const target = parseFloat(m[0].replace(/\./g,'').replace(',','.'));
    if(!isFinite(target) || target === 0) return;
    const isMoney = /R\$/.test(final), isPct = /%/.test(final), neg = /-/.test(final) && target > 0;
    const fmt = v=> isMoney ? fmtBRL(neg ? -v : v) : isPct ? fmtPct(v) : String(Math.round(v));
    const t0 = performance.now(), dur = 650;
    const step = now=>{
      if(!el.isConnected) return;
      const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      el.textContent = k < 1 ? fmt(target * e) : final;
      if(k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}
let lastAnimatedView = null;
function afterRender(){
  labelTables();
  // anima só quando troca de tela (render também roda a cada letra digitada na busca)
  if(state.view !== lastAnimatedView){
    lastAnimatedView = state.view;
    const root = document.getElementById('viewRoot');
    if(root && !reducedMotion()){ root.classList.add('anim-in'); countUpStats(root); setTimeout(()=> root.classList.remove('anim-in'), 900); }
  }
  if(state.view==='dashboard'){ buildDashboardCharts(); }
  else destroyCharts();
  if(state.view==='calculator'){ renderCalcResult(); }
}

document.addEventListener('keydown', e=>{
  if(e.key!=='Escape') return;
  if(document.getElementById('modalOverlay')) closeModal();
  else if(document.getElementById('receiptRoot').classList.contains('open')) closeReceipt();
});

boot();
</script>
