<style>
/* ============================================================
   ABA GESTÃO · visual "livro-caixa": papel bege, tinta verde-escura
   Tokens primeiro; nenhuma cor solta fora daqui (exceto o recibo).
   ============================================================ */
:root{
  /* fundo e superfícies (escuro) */
  --bg: #0b0d0c;
  --bg-soft: #131615;
  --surface: #171a19;
  --surface-2: #1e2220;
  --border: #2a302c;
  --border-soft: #212623;
  /* verde-limão (destaque) e verdes da marca */
  --lime: #b5f25a;
  --lime-2: #8fd43a;
  --lime-ink: #0d1806;
  --green-900: #0d1806;
  --green-800: #101311;
  --green-700: #b5f25a;
  --green-600: #a4e64f;
  --green-500: #8fd43a;
  --green-400: #a4e64f;
  --green-tint: rgba(181,242,90,0.11);
  --green-soft: #4d8a2c;
  /* bege da marca: vira a cor do texto */
  --cream: #f1ede2;
  --cream-dim: #a9ada3;
  /* tinta */
  --beige: #f4f1e8;          /* nome histórico: é o texto forte (títulos, valores) */
  --beige-dim: #c8c9c0;
  --text: #dcdfd8;
  --text-dim: #9aa29c;
  --text-faint: #6a726d;
  /* sinais */
  --gold: #f0c25a;
  --gold-dim: #d9a93f;
  --gold-tint: rgba(240,194,90,0.12);
  --red: #e5636a;
  --red-dim: rgba(229,99,106,0.38);
  --red-tint: rgba(229,99,106,0.12);
  --pos: #a4e64f;
  --neg: #ff8a8f;
  --radius: 16px;
  --radius-sm: 10px;
  --font-display: 'Poppins', sans-serif;
  --font-body: 'DM Sans', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --shadow: none;
  --shadow-lg: 0 30px 80px -20px rgba(0,0,0,0.75);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:
    radial-gradient(900px 520px at 100% -8%, rgba(143,212,58,0.10), transparent 60%),
    var(--bg);
  background-attachment: fixed;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 14px;
  min-height:100vh;
  -webkit-font-smoothing: antialiased;
}
.mono{ font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
::selection{ background: var(--green-600); color: var(--cream); }
button{ font-family: inherit; cursor:pointer; }
input, select, textarea{ font-family: inherit; }
a{ color: inherit; }
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background: var(--border); border-radius: 10px; border:2px solid var(--bg); }

/* ---------- Layout ---------- */
.app{ display:flex; min-height:100vh; }

.sidebar{
  width: 240px;
  flex-shrink:0;
  background: var(--green-800);
  border-right: 1px solid var(--border-soft);
  color: var(--cream);
  padding: 22px 14px 16px;
  display:flex;
  flex-direction:column;
  gap: 4px;
  position: sticky;
  top:0;
  height:100vh;
  z-index: 40;
}
.brand{ display:flex; align-items:center; gap:11px; padding: 4px 10px 20px; }
.brand-mark{
  width:40px; height:40px; border-radius:10px;
  display:block; object-fit:contain;
  font-size:15px; letter-spacing:-.3px;
  flex-shrink:0;
}
.brand-text .t1{ font-family:var(--font-display); font-weight:700; font-size:15.5px; color:var(--cream); line-height:1.15; letter-spacing:-.1px; }
.brand-text .t2{ font-size:11.5px; color: var(--cream-dim); margin-top:2px; }

.nav{ display:flex; flex-direction:column; gap:1px; margin-top:4px; flex:1; overflow-y:auto; }
.nav-label{ font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:1.2px; color: rgba(239,231,211,0.45); padding: 16px 12px 6px; }
.nav-item{
  display:flex; align-items:center; gap:11px;
  padding: 10px 14px; border-radius: 999px;
  color: rgba(239,231,211,0.78); font-size:13.5px; font-weight:500;
  background:transparent; border:none; text-align:left; width:100%;
  transition: background .15s ease, color .15s ease;
}
.nav-item svg{ width:17px; height:17px; flex-shrink:0; opacity:.8; }
.nav-item:hover{ background: rgba(239,231,211,0.07); color: var(--cream); }
.nav-item.active{ background: var(--lime); color: var(--lime-ink); font-weight:600; box-shadow: 0 6px 22px -10px rgba(181,242,90,0.7); }
.nav-item.active svg{ opacity:1; }
.sidebar ::-webkit-scrollbar-thumb{ background: rgba(239,231,211,0.15); border-color: var(--green-800); }
.sidebar-foot{ padding: 12px 10px 0; border-top:1px solid rgba(239,231,211,0.12); margin-top:8px; }
.sidebar-foot .biz{ font-size:11.5px; color: rgba(239,231,211,0.5); line-height:1.5; }

.main{ flex:1; min-width:0; padding: 30px 36px 64px; max-width: 1400px; }
.topbar{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:22px; }
.page-title{ font-family: var(--font-display); font-weight:600; font-size: 28px; color: var(--beige); letter-spacing:-.4px; line-height:1.2; }
.page-sub{ color: var(--text-dim); font-size:13.5px; margin-top:4px; }

.btn{
  display:inline-flex; align-items:center; gap:8px;
  padding: 10px 18px; border-radius: 999px; border:1px solid var(--border);
  background: var(--surface); color: var(--text); font-size:13.5px; font-weight:600;
  transition: background .15s ease, border-color .15s ease, color .15s ease;
}
.btn:hover{ border-color: var(--green-600); color: var(--green-700); }
.btn-primary{ background: var(--lime); border-color: var(--lime); color: var(--lime-ink); box-shadow: 0 8px 24px -12px rgba(181,242,90,0.8); }
.btn-primary:hover{ background: #c6f87a; border-color: #c6f87a; color: var(--lime-ink); }
.btn-gold{ background: var(--gold-dim); border-color: var(--gold-dim); color: var(--green-900); }
.btn-gold:hover{ background: var(--gold); color: var(--green-900); }
.btn-ghost{ background:transparent; border-color: var(--border); }
.btn-danger{ background: transparent; border-color: var(--red-dim); color: var(--red); }
.btn-danger:hover{ background: var(--red-tint); border-color: var(--red); color: var(--red); }
.btn-sm{ padding:6px 12px; font-size:12.5px; border-radius:999px; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.btn svg{ width:15px; height:15px; flex-shrink:0; }
.icon-btn svg{ width:13px; height:13px; }

/* ---------- Period filter ---------- */
.period-bar{ display:inline-flex; align-items:center; gap:2px; flex-wrap:wrap; margin-bottom:22px; padding:4px; background: var(--surface); border:1px solid var(--border-soft); border-radius: 999px; }
.chip{
  padding: 7px 14px; border-radius: 999px; font-size:12.5px; font-weight:600;
  background: transparent; border:1px solid transparent; color: var(--text-dim);
  transition: background .15s ease, color .15s ease;
}
.chip:hover{ color: var(--beige); }
.chip.active{ background: var(--surface-2); border-color: var(--border); color: var(--lime); }
.period-custom{ display:flex; align-items:center; gap:6px; padding:0 6px; }
.period-custom input[type=date]{ background: var(--surface); border:1px solid var(--border); color:var(--text); border-radius:7px; padding:5px 8px; font-size:12.5px; }

/* ---------- Cards ---------- */
.grid{ display:grid; gap:14px; }
.grid-4{ grid-template-columns: repeat(4, 1fr); }
.grid-3{ grid-template-columns: repeat(3, 1fr); }
.grid-2{ grid-template-columns: repeat(2, 1fr); }
@media (max-width: 1180px){ .grid-4{ grid-template-columns: repeat(2,1fr);} .grid-3{grid-template-columns: repeat(2,1fr);} }
@media (max-width: 720px){ .grid-3,.grid-2{ grid-template-columns: 1fr;} .grid-4{ grid-template-columns: 1fr 1fr; gap:10px; } .grid-4 .stat-card{ padding:14px; gap:6px; } .grid-4 .stat-icon{ display:none; } .grid-4 .stat-value{ font-size:17px; letter-spacing:-.6px; } .grid-4 .stat-foot{ font-size:11px; } }

.card{
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
  position:relative;
  overflow:hidden;
}
.stat-card{ display:flex; flex-direction:column; gap:8px; }
.stat-top{ display:flex; align-items:center; justify-content:space-between; }
.stat-label{ font-size:13px; color: var(--text-dim); font-weight:500; }
.stat-icon{ width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
.stat-icon svg{ width:15px; height:15px; }
.stat-value{ font-family: var(--font-display); font-size: 27px; font-weight:600; color: var(--beige); letter-spacing:-0.8px; font-variant-numeric: tabular-nums; line-height:1.15; }
.stat-foot{ font-size:12px; color: var(--text-faint); display:flex; align-items:center; gap:6px; line-height:1.4; }
/* cartão de destaque: o lucro em verde cheio */
.stat-card.stat-hero{ background: radial-gradient(120% 140% at 100% 0%, #d4fb8f 0%, var(--lime) 35%, var(--lime-2) 100%); border-color: transparent; box-shadow: 0 18px 50px -24px rgba(181,242,90,0.8); }
.stat-hero .stat-label{ color: rgba(13,24,6,0.7); }
.stat-hero .stat-value{ color: var(--lime-ink); }
.stat-hero .stat-foot{ color: rgba(13,24,6,0.65); }
.stat-hero .stat-icon{ background: rgba(13,24,6,0.12); color: var(--lime-ink); border-color: transparent; }
.stat-card.stat-hero.is-neg{ background: var(--red); }
.stat-hero.is-neg .stat-label, .stat-hero.is-neg .stat-value, .stat-hero.is-neg .stat-foot, .stat-hero.is-neg .stat-icon{ color:#fff; }
.trend-up{ color: var(--pos); }
.trend-down{ color: var(--neg); }

/* ícones dos números: todos no mesmo estilo; cor só em alerta */
.stat-icon{ background: var(--surface-2); color: var(--lime); border:1px solid var(--border-soft); }
.stat-icon.ic-pending{ background: var(--red-tint); color: var(--red); border-color: transparent; }

.section-title{ font-family: var(--font-display); font-weight:500; font-size:18px; color: var(--beige); margin: 32px 0 14px; display:flex; align-items:baseline; justify-content:space-between; gap:12px; letter-spacing:-.2px; }
.section-title .hint{ font-size:12px; color:var(--text-faint); font-weight:400; font-family:var(--font-body); letter-spacing:0; }

/* ---------- Funnel (signature element) ---------- */
.funnel-wrap{ display:flex; gap:22px; align-items:stretch; flex-wrap:wrap; }
.funnel-col{ flex:1; min-width:260px; }
.funnel-row{ display:flex; align-items:center; gap:14px; padding: 11px 0; border-bottom: 1px dashed var(--border); }
.funnel-row:last-child{ border-bottom:none; }
.funnel-label{ width:120px; flex-shrink:0; font-size:13px; color: var(--text-dim); font-weight:600; }
.funnel-bar-track{ flex:1; height:10px; background: var(--surface-2); border-radius:999px; overflow:hidden; position:relative;}
.funnel-bar-fill{ height:100%; border-radius:999px; transition: width .4s ease; }
.funnel-value{ width:122px; text-align:right; font-family: var(--font-mono); font-size:13.5px; font-weight:600; color: var(--beige); flex-shrink:0; font-variant-numeric: tabular-nums; }
.funnel-arrow{ text-align:center; color: var(--text-faint); font-size:11px; padding: 2px 0 2px 134px; }

/* ---------- Tables ---------- */
.table-wrap{ overflow-x:auto; border-radius: var(--radius); border:1px solid var(--border-soft); background: var(--surface); box-shadow: var(--shadow); }
.card .table-wrap{ box-shadow:none; }
.table-flat{ border:none; border-radius:0; margin-top:12px; }
.table-flat table{ min-width:0; }
@media (max-width: 720px){
  /* no celular cada linha da tabela vira um card (rótulos vêm do cabeçalho, ver labelTables) */
  .table-wrap.cardify{ border:none; background:transparent; overflow:visible; box-shadow:none; }
  .card .table-wrap.cardify{ padding:0 14px 14px; }
  .cardify table{ min-width:0; }
  .cardify thead{ display:none; }
  .cardify tbody{ display:flex; flex-direction:column; gap:10px; }
  .cardify tbody tr{ display:grid; grid-template-columns:1fr 1fr; gap:10px 14px; background: var(--surface); border:1px solid var(--border-soft); border-radius:14px; padding:14px; }
  .card .cardify tbody tr{ background: var(--surface-2); }
  .cardify tbody td{ display:flex; flex-direction:column; align-items:flex-start; gap:3px; padding:0; border:none; text-align:left; min-width:0; }
  .cardify tbody td::before{ content:attr(data-label); font-family: var(--font-body); font-size:11px; color: var(--text-faint); }
  .cardify tbody td:first-child{ grid-column:1/-1; }
  .cardify tbody td:first-child::before, .cardify tbody td.td-actions::before, .cardify tbody td[data-label=""]::before{ display:none; }
  .cardify tbody td.td-actions{ grid-column:1/-1; flex-direction:row; justify-content:flex-end; padding-top:10px; border-top:1px solid var(--border-soft); }
  .cardify tbody td.td-actions:empty{ display:none; }
  .cardify .empty-row{ display:block; }
  .cardify .empty-row td{ display:block; }
  .cardify .empty-row td::before{ display:none; }
}
@keyframes riseIn{ from{ opacity:0; transform: translateY(8px); } to{ opacity:1; transform:none; } }
.anim-in .topbar, .anim-in .period-bar, .anim-in .grid > *, .anim-in > .card, .anim-in > .table-wrap, .anim-in .toolbar{ animation: riseIn .38s cubic-bezier(.2,.7,.2,1) both; }
.anim-in .grid > *:nth-child(2){ animation-delay:.04s; } .anim-in .grid > *:nth-child(3){ animation-delay:.08s; } .anim-in .grid > *:nth-child(4){ animation-delay:.12s; }
.anim-in .grid > *:nth-child(n+5){ animation-delay:.16s; }
@media (prefers-reduced-motion: reduce){ .anim-in *{ animation:none !important; } }
table{ width:100%; border-collapse:collapse; font-size:13.5px; min-width:600px; }
thead th{ text-align:left; font-size:11.5px; font-weight:600; color: var(--text-dim); padding:11px 14px; background: var(--surface-2); border-bottom:1px solid var(--border); white-space:nowrap; }
tbody td{ padding:12px 14px; border-bottom:1px solid var(--border-soft); color: var(--text); vertical-align:middle;}
tbody tr{ background: var(--surface); transition: background .12s ease; }

.td-num{ font-family: var(--font-mono); text-align:right; font-variant-numeric: tabular-nums; }
.td-actions{ text-align:right; white-space:nowrap; }
.empty-row td{ text-align:center; color: var(--text-faint); padding: 30px; cursor:default; }

.badge{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:600; white-space:nowrap;}

.badge-dot{ width:6px; height:6px; border-radius:50%; background:currentColor; }

/* ---------- Charts ---------- */
.chart-card{ padding:20px; }
.chart-card canvas{ max-height:260px; }

/* ---------- Client detail / list rows ---------- */
.client-row-name{ font-weight:600; color: var(--beige); }
.client-row-sub{ font-size:12px; color: var(--text-faint); margin-top:2px;}
.rank-list{ display:flex; flex-direction:column; gap:12px; }

.rank-num{ width:26px; height:26px; border-radius:50%; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:700; color:var(--green-700); font-family:var(--font-mono); flex-shrink:0;}
.rank-name{ flex:1; font-size:13.5px; font-weight:600; color:var(--text); }

/* ---------- Alerts ---------- */
.alert-item{ display:flex; gap:10px; align-items:flex-start; padding:11px 0; border-bottom:1px solid var(--border-soft); }
.alert-item:last-child{ border-bottom:none; }

/* ---------- Toolbar / search ---------- */
.toolbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
.search-box{ position:relative; }
.search-box input{ background: var(--surface); border:1px solid var(--border); border-radius:9px; padding:9px 12px 9px 34px; color:var(--text); font-size:13.5px; width:260px; }

.search-box svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--text-faint); }
.toolbar-right{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }

/* ---------- Modal ---------- */
.modal-overlay{ position:fixed; inset:0; background: rgba(0,0,0,0.62); backdrop-filter: blur(2px); display:none; align-items:flex-start; justify-content:center; z-index:100; padding: 40px 16px; overflow-y:auto;}
.modal-overlay.open{ display:flex; }
.modal{ background: var(--surface); border:1px solid var(--border); border-radius: 18px; width:100%; max-width:640px; box-shadow: var(--shadow-lg); animation: modalIn .18s ease; }
@keyframes modalIn{ from{ opacity:0; transform: translateY(8px);} to{ opacity:1; transform:none;} }
.modal-head{ display:flex; align-items:center; justify-content:space-between; padding: 18px 22px; border-bottom:1px solid var(--border-soft); }
.modal-title{ font-family:var(--font-display); font-weight:600; font-size:17px; color:var(--beige); letter-spacing:-.2px; }

.modal-close:hover{ background: var(--bg-soft); color:var(--text); }
.modal-close svg{ width:16px; height:16px; }
.modal-body{ padding: 20px 22px; max-height: 68vh; overflow-y:auto; }
.modal-foot{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding: 14px 22px; border-top:1px solid var(--border-soft); background: var(--bg-soft); border-radius: 0 0 18px 18px; }

.field{ margin-bottom:14px; }

  width:100%; background: var(--bg-soft); border:1px solid var(--border); border-radius:10px;

}

.rc-label{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:1.2px; color: var(--ink-soft); }

.rc-table{ width:100%; min-width:0; border-collapse:collapse; font-size:13px; }
.rc-table thead th{ background:none; color: var(--ink-soft); border-bottom:1.5px solid var(--ink); padding:8px 6px; font-size:10.5px; letter-spacing:1px; text-transform:uppercase; }
.rc-table tbody tr, .rc-table tbody tr:hover{ background:none; cursor:default; }
.rc-table tbody td{ color: var(--ink); border-bottom:1px solid var(--line); padding:10px 6px; }
.rc-num-col{ text-align:right !important; font-family:var(--font-mono); white-space:nowrap; }
.rc-totals{ margin:18px 0 0 auto; max-width:340px; }
.rc-line{ display:flex; justify-content:space-between; gap:16px; padding:5px 0; font-family:var(--font-mono); font-size:13px; }
.rc-line span:first-child{ font-family:var(--font-body); }
.rc-grand{ border-top:1.5px solid var(--ink); margin-top:6px; padding-top:10px; font-size:17px; color: var(--accent); }
.rc-grand span:first-child{ font-family:var(--font-display); font-weight:700; text-transform:uppercase; font-size:13px; letter-spacing:.6px; align-self:center; }
.rc-pix{ margin-top:26px; border:1.5px dashed var(--accent); border-radius:9px; padding:12px 16px; }
.rc-pix-key{ font-family:var(--font-mono); font-size:15px; font-weight:600; margin-top:2px; word-break:break-all; }
.rc-text{ margin-top:22px; }
.rc-foot{ margin-top:40px; display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; }
.rc-sign{ width:280px; font-size:12px; color: var(--ink-soft); }
.rc-sign-line{ border-top:1px solid var(--ink); margin-bottom:6px; }
#receiptRoot .btn-ghost{ background: var(--surface); }
@media (max-width: 600px){
  .rc-paper{ padding:24px 18px; }
  .rc-id{ text-align:left; }
  .rc-table{ font-size:12px; }
  .rc-table thead th, .rc-table tbody td{ padding:8px 4px; }
}
@media print{
  @page{ size:A4; margin:14mm; }
  body.rc-printing{ background:#fff !important; }
  body.rc-printing > *:not(#receiptRoot){ display:none !important; }
  body.rc-printing #receiptRoot{ position:static; display:block; background:none; padding:0; overflow:visible; backdrop-filter:none; }
  .no-print{ display:none !important; }
  .rc-paper{ box-shadow:none; border-radius:0; max-width:none; padding:0; }
  .rc-paper *{ -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

.mobile-topbar{ display:none; }
@media (max-width: 880px){
  .sidebar{ position:fixed; left:-270px; transition:left .2s ease; box-shadow: 0 0 40px rgba(0,0,0,0.6); }
  .sidebar.open{ left:0; }
  .main{ padding: 0 16px 50px; }
  .mobile-topbar{ display:flex; align-items:center; gap:12px; margin:0 -16px 18px; padding:10px 16px; background: rgba(16,19,17,0.92); backdrop-filter: blur(8px); border-bottom:1px solid var(--border-soft); position:sticky; top:0; z-index:30; }
  .mobile-topbar button{ background: rgba(239,231,211,0.08); border:1px solid rgba(239,231,211,0.18); border-radius:8px; width:38px; height:38px; display:flex; align-items:center; justify-content:center; color:var(--cream); }
  .mobile-topbar button svg{ width:18px; height:18px; }
  .mobile-topbar .brand-text .t1{ color: var(--cream); }
  .mobile-topbar .sync{ color: var(--cream-dim); }
  .mobile-topbar .sync-label{ display:none; }
  .sidebar-scrim{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:35;}
  .sidebar-scrim.open{ display:block; }
  .topbar{ margin-bottom:16px; padding-bottom:14px; }
  .page-title{ font-size:22px; }
  .period-bar{ display:flex; flex-wrap:nowrap; overflow-x:auto; max-width:100%; }
  .chip{ white-space:nowrap; }
  .field-row{ grid-template-columns:1fr; }
  .search-box input{ width:100%; }
  .search-box{ flex:1; min-width:200px; }
  .toast{ left:16px; right:16px; bottom:16px; max-width:none; }
  .modal-overlay{ padding: 12px 8px; }
  .modal-body{ max-height: none; }
  .detail-header{ flex-wrap:wrap; }
  .section-title{ flex-wrap:wrap; gap:2px 12px; }
  .funnel-label{ width:92px; font-size:12px; }
  .funnel-value{ width:104px; font-size:12.5px; }
  .funnel-arrow{ padding-left:106px; }
}

/* ---------- Login, carregamento e sincronização ---------- */
.auth-split{ min-height:100vh; min-height:100dvh; display:grid; grid-template-columns: minmax(320px, 46%) 1fr; width:100%; }
.auth-side{ background: #0f1210; border-right:1px solid var(--border-soft); color: var(--cream); padding: 44px 52px; display:flex; flex-direction:column; justify-content:space-between; position:relative; overflow:hidden; }
.auth-side::before{ /* brilho verde, como luz de fundo */
  content:''; position:absolute; width:520px; height:520px; right:-180px; top:-140px; border-radius:50%; pointer-events:none;
  background: radial-gradient(circle, rgba(181,242,90,0.55), rgba(143,212,58,0.18) 45%, transparent 70%);
  filter: blur(10px);
}
.auth-side::after{
  content:''; position:absolute; width:340px; height:340px; left:-120px; bottom:-140px; border-radius:50%; pointer-events:none;
  background: radial-gradient(circle, rgba(143,212,58,0.22), transparent 70%);
}
.auth-side > *{ position:relative; z-index:1; }
.auth-logo{ width:200px; height:auto; display:block; filter: drop-shadow(0 10px 30px rgba(0,0,0,0.35)); }
.auth-hero{ max-width:420px; }
.auth-hero h1{ font-family: var(--font-display); font-weight:700; font-size: 38px; line-height:1.12; letter-spacing:-1px; color: var(--cream); }
.auth-hero h1 em{ font-style:normal; color: var(--lime); white-space:nowrap; }
.auth-hero p{ margin-top:16px; font-size:15px; line-height:1.6; color: var(--cream-dim); }
.auth-ledger{ display:flex; flex-direction:column; gap:0; max-width:340px; font-family: var(--font-mono); font-size:12.5px; color: rgba(239,231,211,0.7); }
.auth-ledger div{ display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid rgba(239,231,211,0.10); }
.auth-ledger div span:last-child{ color: var(--lime); }
.auth-ledger div:last-child{ border-bottom:none; }
.auth-foot{ font-size:12px; color: rgba(239,231,211,0.45); }
.auth-wrap{ display:flex; align-items:center; justify-content:center; padding:40px 24px; width:100%; }
.auth-card{ width:100%; max-width:380px; }
.auth-card .brand{ display:none; }
.auth-title{ font-family:var(--font-display); font-weight:700; font-size:26px; color:var(--beige); margin-bottom:6px; letter-spacing:-.5px; }
.auth-sub{ color:var(--text-dim); font-size:14px; margin-bottom:24px; line-height:1.55; }
.auth-card .field input{ padding:12px 13px; font-size:15px; }
.auth-card .btn{ width:100%; justify-content:center; padding:12px 16px; font-size:14.5px; }
.auth-err{ background: var(--red-tint); border:1px solid var(--red-dim); color: #ffc2c4; border-radius:8px; padding:10px 12px; font-size:13px; margin-bottom:16px; line-height:1.45; }
.auth-ok{ background: var(--green-tint); border:1px solid rgba(181,242,90,0.35); color: var(--beige); border-radius:8px; padding:10px 12px; font-size:13px; margin-bottom:16px; line-height:1.45; }
.auth-link{ background:none; border:none; color:var(--green-600); font-size:13px; font-weight:600; margin-top:16px; padding:4px; text-decoration:underline; text-underline-offset:3px; }
.auth-link:hover{ color: var(--beige); }
.auth-choices{ display:flex; flex-direction:column; gap:10px; }
.auth-choices .hint{ font-size:12px; color:var(--text-faint); margin:-4px 0 4px; text-align:center; }
@media (max-width: 880px){
  .auth-split{ grid-template-columns: 1fr; grid-template-rows:auto 1fr; }
  .auth-side{ padding: 22px 20px 28px; gap:26px; }
  .auth-logo{ width:96px; }
  .auth-hero h1{ font-size:26px; letter-spacing:-.6px; }
  .auth-hero p{ font-size:14px; margin-top:8px; }
  .auth-ledger, .auth-foot{ display:none; }
  .auth-wrap{ align-items:flex-start; padding:28px 20px 40px; }
}
.spinner{ width:26px; height:26px; border-radius:50%; border:3px solid var(--border); border-top-color:var(--green-600); animation: spin .8s linear infinite; margin:0 auto 14px; }
@keyframes spin{ to{ transform:rotate(360deg);} }
.btn:focus-visible, .auth-link:focus-visible, .nav-item:focus-visible{ outline:2px solid var(--green-600); outline-offset:2px; }
.sidebar .nav-item:focus-visible, .sidebar button:focus-visible{ outline-color: var(--lime); }
.btn[disabled]{ opacity:.6; cursor:wait; }
.sync{ display:flex; align-items:center; gap:7px; font-size:12px; color: var(--cream-dim); margin-bottom:8px; }
.sync .dot{ width:8px; height:8px; border-radius:50%; background:var(--lime); box-shadow:0 0 8px var(--lime); flex-shrink:0; }
.sync[data-st="saving"] .dot{ background:var(--gold-dim); animation: pulse 1s ease infinite; }
.sync[data-st="offline"] .dot, .sync[data-st="error"] .dot{ background:#e08a8e; }
@keyframes pulse{ 50%{ opacity:.35; } }
.user-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:12px; color: rgba(239,231,211,0.6); margin-bottom:8px; }
.user-row span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.user-row button{ background:none; border:1px solid rgba(239,231,211,0.22); color: var(--cream-dim); border-radius:6px; padding:3px 9px; font-size:11.5px; flex-shrink:0; }
.user-row button:hover{ color: var(--cream); border-color: var(--cream-dim); }
.mobile-topbar .sync{ margin:0 0 0 auto; }
@media (prefers-reduced-motion: reduce){ .spinner, .sync .dot, .modal, .toast{ animation:none; } .sidebar{ transition:none; } }
</style>

function emptyDB(){

}

// Completa campos que versões anteriores não tinham. Nunca remove nada.
function migrateDB(db){
  if(!db || typeof db !== 'object' || Array.isArray(db)) db = emptyDB();
  ['clients','orders','purchases','expenses','products','stockMoves','baskets'].forEach(k=>{ if(!Array.isArray(db[k])) db[k] = []; });
  if(!db.settings || typeof db.settings !== 'object') db.settings = {};
  if(!Array.isArray(db.settings.costCategories)) db.settings.costCategories = defaultCostCategories();
  if(!Array.isArray(db.settings.expenseCategories)) db.settings.expenseCategories = defaultExpenseCategories();
  if(!Array.isArray(db.settings.productCategories)) db.settings.productCategories = defaultProductCategories();
  if(!Array.isArray(db.receipts)) db.receipts = [];
  db.orders.forEach(o=>{ if(!Array.isArray(o.costs)) o.costs = []; if(!Array.isArray(o.payments)) o.payments = []; if(!Array.isArray(o.baskets)) o.baskets = []; });
  db.purchases.forEach(p=>{ if(!Array.isArray(p.items)) p.items = []; });
  if(!Array.isArray(db.suppliers)){
    // v1 guardava o fornecedor só como texto na compra: cria o cadastro a partir desses nomes
    db.suppliers = [];
    db.purchases.forEach(p=>{
      const name = (p.supplier||'').trim();
      if(!name) return;
      let sup = db.suppliers.find(x=> x.name.toLowerCase() === name.toLowerCase());
      if(!sup){ sup = newSupplierRecord(name, p.date); db.suppliers.push(sup); }
      p.supplierId = sup.id;
    });
  }
  db.schemaVersion = SCHEMA_VERSION;
  return db;
}

/* ---------- Nuvem (Supabase) ----------
   Os dados de cada usuário ficam numa linha da tabela aba_dados (coluna dados, jsonb).
   O navegador guarda uma cópia local (cache) para abrir rápido e para não perder
   nada se a internet cair: o que for salvo sem conexão sobe quando ela voltar.
   A coluna versao evita que um aparelho sobrescreva sem querer o que outro salvou. */
const SUPABASE_URL = 'https://leietuxwxnufawupvzrm.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_r7hSygYetxzXdP_o81Qs1w_lG-GCTBW'; // chave pública (publishable): pode ficar no site
const CLOUD_TABLE = 'aba_dados';
const HISTORY_TABLE = 'aba_historico';

let DB = migrateDB(emptyDB());
let sb = null;
let currentUser = null;
const sync = { version:0, rev:0, dirty:false, saving:false, timer:null, retry:null, status:'saved', conflict:false };

function cloudConfigured(){
  return /^https:\/\/.+\.supabase\.co\/?$/.test(SUPABASE_URL) && (/^sb_publishable_/.test(SUPABASE_ANON_KEY) || SUPABASE_ANON_KEY.length > 40);
}
function cacheKey(){ return 'abaGestaoOnline_cache_' + (currentUser ? currentUser.id : 'anon'); }
function writeCache(){
  try{ localStorage.setItem(cacheKey(), JSON.stringify({ db:DB, version:sync.version, dirty:sync.dirty, at:Date.now() })); }
  catch(e){ console.warn('Cache local indisponível', e); }
}
function readCache(){
  try{
    const c = JSON.parse(localStorage.getItem(cacheKey()) || 'null');
    return c && c.db && typeof c.db === 'object' ? c : null;
  }catch(e){ return null; }
}
function clearCache(){ try{ localStorage.removeItem(cacheKey()); }catch(_){} }

// Chamado por todas as telas depois de alterar DB. Grava a cópia local na hora e envia para a nuvem logo em seguida.
function saveDB(){
  if(!currentUser){ toast('Sua sessão terminou. Entre de novo para salvar.', 'error'); return false; }
  sync.rev++;
  sync.dirty = true;
  writeCache();
  scheduleSync(600);
  return true;
}
function scheduleSync(delay){
  clearTimeout(sync.timer);
  sync.timer = setTimeout(pushToCloud, delay);
}
function setSyncStatus(st){
  sync.status = st;
  document.querySelectorAll('.sync').forEach(el=>{ el.outerHTML = syncBadgeHtml(); });
}
function syncBadgeHtml(){
  const labels = { saved:'Salvo na nuvem', saving:'Salvando…', offline:'Sem internet, salvo neste aparelho', error:'Erro ao salvar, tentando de novo', conflict:'Precisa da sua escolha' };
  const st = sync.status;
  return `<div class="sync" data-st="${st==='conflict'?'error':st}" role="status" title="${labels[st]||''}"><span class="dot"></span><span class="sync-label">${labels[st]||''}</span></div>`;
}
function cloudErrorMessage(err){
  const m = String((err && (err.message || err.error_description)) || err || '');
  if(!navigator.onLine || /fetch|network|Failed to/i.test(m)) return 'Sem conexão com a internet.';
  if(/Invalid login credentials/i.test(m)) return 'E-mail ou senha incorretos.';
  if(/Email not confirmed/i.test(m)) return 'Este e-mail ainda não foi confirmado.';
  if(/rate limit|too many/i.test(m)) return 'Muitas tentativas seguidas. Espere alguns minutos e tente de novo.';
  if(/JWT|token/i.test(m)) return 'Sua sessão expirou. Entre de novo.';
  if(/relation .* does not exist|Could not find the table/i.test(m)) return 'O banco ainda não foi preparado (tabela aba_dados não encontrada). Rode o script supabase.sql no Supabase.';
  if(/row-level security|42501|permission denied/i.test(m)) return 'Esta conta não tem permissão para usar o ABA Gestão.';
  if(/should be different/i.test(m)) return 'A nova senha precisa ser diferente da atual.';
  if(/Password should be/i.test(m)) return 'A senha precisa ter pelo menos 6 caracteres.';
  return m || 'Erro desconhecido.';
}

async function pushToCloud(){
  if(sync.saving || !sync.dirty || sync.conflict || !currentUser) return;
  if(!navigator.onLine){ setSyncStatus('offline'); return; }
  sync.saving = true;
  setSyncStatus('saving');
  const sentRev = sync.rev;
  const snapshot = JSON.parse(JSON.stringify(DB));
  try{
    let res, conflict = false, newVersion;
    if(sync.version === 0){
      res = await sb.from(CLOUD_TABLE).insert({ user_id: currentUser.id, dados: snapshot, versao: 1 }).select('versao');
      if(res.error && res.error.code === '23505') conflict = true;
    }else{
      res = await sb.from(CLOUD_TABLE).update({ dados: snapshot, versao: sync.version + 1 })
        .eq('user_id', currentUser.id).eq('versao', sync.version).select('versao');
      if(!res.error && (!res.data || !res.data.length)) conflict = true;
    }
    if(conflict){ sync.saving = false; return handleConflict(); }
    if(res.error) throw res.error;
    newVersion = res.data[0].versao;
    sync.version = newVersion;
    if(sync.rev === sentRev) sync.dirty = false;
    writeCache();
    clearTimeout(sync.retry);
    setSyncStatus(sync.dirty ? 'saving' : 'saved');
    if(sync.dirty) scheduleSync(300);
  }catch(e){
    console.error('Falha ao salvar na nuvem', e);
    setSyncStatus(navigator.onLine ? 'error' : 'offline');
    if(/JWT|token/i.test(String(e && e.message))){ toast('Sua sessão expirou. Entre de novo; o que você fez está guardado neste aparelho.', 'error'); }
    clearTimeout(sync.retry);
    sync.retry = setTimeout(pushToCloud, 15000);
  }finally{
    sync.saving = false;
  }
}

// Outro aparelho salvou depois da última vez que este aparelho baixou os dados.
function handleConflict(){
  sync.conflict = true;
  setSyncStatus('conflict');
  document.getElementById('syncRoot').innerHTML = `<div class="modal-overlay open" id="conflictOverlay">
    <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="conflictTitle" style="max-width:520px">
      <div class="modal-head"><div class="modal-title" id="conflictTitle">Os dados foram alterados em outro aparelho</div></div>
      <div class="modal-body">
        <p style="font-size:13.5px; line-height:1.55; color:var(--text-dim)">Enquanto este aparelho estava aberto, outro aparelho salvou mudanças. Escolha qual versão fica valendo.</p>
        <p style="font-size:12.5px; line-height:1.55; color:var(--text-faint); margin-top:10px">Antes de trocar, a versão deste aparelho é baixada como arquivo .json, para nada se perder.</p>
      </div>
      <div class="modal-foot" style="flex-wrap:wrap">
        <button class="btn btn-ghost" onclick="resolveConflict('local')">Manter a deste aparelho</button>
        <button class="btn btn-primary" onclick="resolveConflict('cloud')">Usar a da nuvem (recomendado)</button>
      </div>
    </div></div>`;
}
async function resolveConflict(choice){
  document.querySelectorAll('#conflictOverlay .btn').forEach(b=> b.disabled = true);
  exportData('aba-gestao-este-aparelho-');
  try{
    const res = await sb.from(CLOUD_TABLE).select('dados,versao').eq('user_id', currentUser.id).maybeSingle();
    if(res.error) throw res.error;
    if(choice === 'cloud'){
      if(!res.data) throw new Error('Nenhum dado encontrado na nuvem.');
      DB = migrateDB(res.data.dados);
      sync.version = res.data.versao; sync.dirty = false;
      writeCache(); closeModal(); render();
      toast('Dados atualizados com a versão da nuvem.');
      setSyncStatus('saved');
    }else{
      sync.version = res.data ? res.data.versao : 0;
      sync.dirty = true; sync.rev++;
      writeCache();
    }
    sync.conflict = false;
    document.getElementById('syncRoot').innerHTML = '';
    if(choice === 'local') pushToCloud();
  }catch(e){
    document.querySelectorAll('#conflictOverlay .btn').forEach(b=> b.disabled = false);
    toast('Não foi possível concluir: ' + cloudErrorMessage(e), 'error');
  }
}

// Ao voltar para a aba (ou para o app no celular), busca o que outro aparelho tenha salvo.
async function refreshFromCloud(){
  if(!currentUser || sync.dirty || sync.saving || sync.conflict || !navigator.onLine) return;
  if(document.getElementById('modalOverlay')) return; // não troca os dados com um formulário aberto
  try{
    const head = await sb.from(CLOUD_TABLE).select('versao').eq('user_id', currentUser.id).maybeSingle();
    if(head.error || !head.data || head.data.versao <= sync.version) return;
    const res = await sb.from(CLOUD_TABLE).select('dados,versao').eq('user_id', currentUser.id).single();
    if(res.error || sync.dirty || document.getElementById('modalOverlay')) return;
    DB = migrateDB(res.data.dados);
    sync.version = res.data.versao;
    writeCache(); render();
    toast('Dados atualizados com o que foi salvo em outro aparelho.');
  }catch(e){ console.warn('Não foi possível atualizar', e); }
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'visible') refreshFromCloud(); });
window.addEventListener('online', ()=>{ if(sync.dirty) pushToCloud(); else refreshFromCloud(); });
window.addEventListener('offline', ()=>{ if(currentUser) setSyncStatus(sync.dirty ? 'offline' : sync.status); });
window.addEventListener('beforeunload', e=>{
  if(sync.dirty){ e.preventDefault(); e.returnValue = ''; }
});

    const acc = await sb.from(ACCESS_TABLE).select('user_id').eq('user_id', user.id).maybeSingle();
    if(acc.error) throw acc.error;
    if(!acc.data) return denyAccess(user.email);
    const res = await sb.from(CLOUD_TABLE).select('dados,versao').eq('user_id', user.id).maybeSingle();
    if(res.error) throw res.error;
    remote = res.data;
  }catch(e){
    if(cache){
      DB = migrateDB(cache.db); sync.version = cache.version || 0; sync.dirty = !!cache.dirty;
      render(); setSyncStatus('offline');
      toast('Sem conexão com a nuvem: mostrando a última cópia deste aparelho. O que você salvar sobe quando a conexão voltar.', 'error');
      sync.retry = setTimeout(pushToCloud, 15000);
      return;
    }
    return renderBootError(cloudErrorMessage(e));
  }
  // Mudanças feitas sem internet que ainda não subiram têm prioridade (a versão evita sobrescrever outro aparelho)
  if(cache && cache.dirty){
    DB = migrateDB(cache.db); sync.version = cache.version || 0; sync.dirty = true;
    render(); scheduleSync(0);
    return;
  }
  if(!remote) return renderFirstRun();
  DB = migrateDB(remote.dados);
  sync.version = remote.versao;
  writeCache();
  setSyncStatus('saved');
  render();
}

// O login é dividido com outro site do mesmo projeto Supabase: ter conta lá não dá acesso ao ABA.
async function denyAccess(email){

  DB = migrateDB(emptyDB());

async function logout(){
  if(sync.dirty && !confirm('Ainda há alterações que não subiram para a nuvem. Se sair agora, elas ficam só neste aparelho até você entrar de novo. Sair mesmo assim?')) return;

  try{ await sb.auth.signOut(); }catch(_){}

async function boot(){
  if(!cloudConfigured()) return renderBootError('Falta configurar a conexão com o Supabase: preencha SUPABASE_URL e SUPABASE_ANON_KEY no início do código.');
  if(!window.supabase || !window.supabase.createClient) return renderBootError('Não foi possível carregar o sistema. Verifique a internet e tente de novo.');
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, storageKey:'aba-gestao-auth' } });
  let recovering = /type=recovery/.test(location.hash);
  sb.auth.onAuthStateChange((event)=>{
    if(event === 'PASSWORD_RECOVERY'){ recovering = true; renderAuth('recovery'); }
  });
  renderLoading('Abrindo…');
  try{
    const { data, error } = await sb.auth.getSession();
    if(error) throw error;
    if(recovering) return renderAuth('recovery');
    if(data.session) startSession(data.session.user);
    else renderAuth('login');
  }catch(e){
    renderAuth('login', cloudErrorMessage(e));
  }
}

async function downloadVersion(id, btn){
  btn.disabled = true;
  try{
    const res = await sb.from(HISTORY_TABLE).select('dados,salvo_em').eq('id', id).single();
    if(res.error) throw res.error;
    downloadJSON(res.data.dados, 'aba-gestao-versao-' + isoLocal(new Date(res.data.salvo_em)) + '.json');
  }catch(e){ toast('Não foi possível baixar: ' + cloudErrorMessage(e), 'error'); }
  btn.disabled = false;
}
function downloadJSON(obj, name){
  const blob = new Blob([JSON.stringify(obj,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
}

/* ---------- Utilitários ---------- */
function uid(){ return 'id_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function fmtBRL(n){
  n = Number(n)||0;
  return n.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
}
function fmtPct(n){ if(!isFinite(n)) n = 0; return n.toLocaleString('pt-BR',{minimumFractionDigits:1, maximumFractionDigits:1}) + '%'; }
function fmtQty(n){ n = Number(n)||0; return n.toLocaleString('pt-BR',{maximumFractionDigits:3}); }
function fmtDate(d){ if(!d) return '—'; const dt = new Date(d+'T00:00:00'); if(isNaN(dt)) return d; return dt.toLocaleDateString('pt-BR'); }
// Data local (toISOString usa UTC e vira o dia depois das 21h em Brasília)
function isoLocal(dt){ const p = n=> String(n).padStart(2,'0'); return `${dt.getFullYear()}-${p(dt.getMonth()+1)}-${p(dt.getDate())}`; }
function todayISO(){ return isoLocal(new Date()); }
function round2(n){ return Math.round((Number(n)||0)*100)/100; }
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function toast(msg, kind){
  const root = document.getElementById('toastRoot');
  const el = document.createElement('div');
  el.className = 'toast' + (kind==='error' ? ' toast-error' : '');
  el.setAttribute('role', kind==='error' ? 'alert' : 'status');
  el.innerHTML = `${ic(kind==='error'?'alert':'check','')} <span>${escapeHtml(msg)}</span>`;
  root.innerHTML = '';
  root.appendChild(el);
  setTimeout(()=>{ el.remove(); }, kind==='error' ? 6000 : 2600);
}

/* ---------- Cálculos financeiros (fonte única de verdade) ---------- */
function orderCostRowsTotal(order){ return (order.costs||[]).reduce((s,c)=> s + (Number(c.value)||0), 0); }
// Cestas do catálogo guardam o custo do dia em que foram lançadas (unitCost), para o lucro histórico não mudar
function orderBasketsCost(order){ return (order.baskets||[]).reduce((s,b)=> s + (Number(b.qty)||0)*(Number(b.unitCost)||0), 0); }
function orderBasketsPrice(order){ return (order.baskets||[]).reduce((s,b)=> s + (Number(b.qty)||0)*(Number(b.unitPrice)||0), 0); }
function orderTotalCost(order){ return orderCostRowsTotal(order) + orderBasketsCost(order); }
function orderGrossProfit(order){ return (Number(order.saleValue)||0) - orderTotalCost(order); }
function orderMargin(order){ const rev = Number(order.saleValue)||0; if(rev<=0) return 0; return (orderGrossProfit(order)/rev)*100; }
function orderPaid(order){ return (order.payments||[]).reduce((s,p)=> s + (Number(p.value)||0), 0); }
function orderBalance(order){ return (Number(order.saleValue)||0) - orderPaid(order); }
function orderPaymentStatus(order){
  const bal = orderBalance(order), paid = orderPaid(order);
  if(paid <= 0) return order.overdue ? 'Em atraso' : 'Não pago';
  if(bal > 0.005) return order.overdue ? 'Em atraso' : 'Parcial';
  return 'Pago';
}
function costsByCategory(order){
  const map = {};
  (order.costs||[]).forEach(c=>{ map[c.category] = (map[c.category]||0) + (Number(c.value)||0); });
  const bc = orderBasketsCost(order);
  if(bc > 0) map['Compras'] = (map['Compras']||0) + bc;
  return map;
}

function ordersInRange(start, end){
  return DB.orders.filter(o=> o.date >= start && o.date <= end);
}

function expensesInRange(start, end){
  return DB.expenses.filter(e=> e.date >= start && e.date <= end);
}
function expensesTotal(expenses){
  return expenses.reduce((s,e)=> s + (Number(e.value)||0), 0);
}

function periodTotals(orders){
  const revenue = orders.reduce((s,o)=> s + (Number(o.saleValue)||0), 0);
  const cost = orders.reduce((s,o)=> s + orderTotalCost(o), 0);
  const profit = revenue - cost;
  const margin = revenue>0 ? (profit/revenue)*100 : 0;
  const pending = orders.reduce((s,o)=> s + Math.max(0, orderBalance(o)), 0);
  return { revenue, cost, profit, margin, pending, count: orders.length };
}

function clientName(id){ const c = DB.clients.find(x=>x.id===id); return c ? c.name : 'Cliente removido'; }

/* ---------- Estoque, fornecedores e cestas ---------- */
function productById(id){ return DB.products.find(p=>p.id===id); }
function productName(id){ const p = productById(id); return p ? p.name : 'Produto removido'; }
function supplierById(id){ return DB.suppliers.find(s=>s.id===id); }
function supplierByName(name){ const n = (name||'').trim().toLowerCase(); return n ? DB.suppliers.find(s=> s.name.trim().toLowerCase()===n) : null; }
// entrada soma, saída subtrai, ajuste já vem com sinal (diferença da contagem)
function moveSigned(m){ const q = Number(m.qty)||0; return m.type==='saida' ? -q : q; }
function stockMap(excludeRef){
  const map = {};
  DB.stockMoves.forEach(m=>{
    if(excludeRef && m.refKind===excludeRef.kind && m.refId===excludeRef.id) return;
    map[m.productId] = (map[m.productId]||0) + moveSigned(m);
  });
  return map;
}
function productStock(id){ return stockMap()[id] || 0; }
function stockStatus(p, qty){
  if(qty <= 0) return 'zerado';
  if((Number(p.minStock)||0) > 0 && qty < Number(p.minStock)) return 'baixo';
  return 'ok';
}
function lowStockProducts(){
  const map = stockMap();
  return DB.products.filter(p=> (Number(p.minStock)||0) > 0 && (map[p.id]||0) < Number(p.minStock));
}
// Substitui todas as movimentações geradas por um registro (compra ou pedido)
function setMovesForRef(kind, refId, moves){
  DB.stockMoves = DB.stockMoves.filter(m=> !(m.refKind===kind && m.refId===refId));
  moves.forEach(m=> DB.stockMoves.push({ id: uid(), refKind: kind, refId, ...m }));
}
function basketUnitCost(b){ return (b.items||[]).reduce((s,it)=>{ const p = productById(it.productId); return s + (Number(it.qty)||0) * (p ? Number(p.cost)||0 : 0); }, 0); }
function basketMissingCost(b){ return (b.items||[]).filter(it=>{ const p = productById(it.productId); return !p || !(Number(p.cost)>0); }); }
// Quantas cestas dá para montar com o estoque atual
function basketsFromStock(b, map){
  map = map || stockMap();
  if(!(b.items||[]).length) return 0;
  return Math.max(0, Math.min(...b.items.map(it=> (Number(it.qty)||0) > 0 ? Math.floor((map[it.productId]||0) / Number(it.qty)) : Infinity)));
}
function supplierPurchases(id){ return DB.purchases.filter(p=> p.supplierId===id); }

/* ---------- Estado ---------- */
const state = {
  view: 'dashboard',
  periodType: 'month', // today, week, month, lastmonth, last30, year, custom
  customStart: null,
  customEnd: null,
  clientDetailId: null,
  searchClients: '',
  searchOrders: '',
  searchPurchases: '',
  searchExpenses: '',
  searchProducts: '',
  searchSuppliers: '',
  stockOnlyLow: false,
  sidebarOpen: false,
};

function getPeriodRange(){
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
  const iso = isoLocal;
  switch(state.periodType){
    case 'today': { const t = iso(now); return [t,t]; }
    case 'week': {
      const day = now.getDay() === 0 ? 7 : now.getDay();
      const start = new Date(now); start.setDate(d - day + 1);
      return [iso(start), iso(now)];
    }
    case 'month': return [iso(new Date(y,m,1)), iso(new Date(y,m+1,0))];
    case 'lastmonth': return [iso(new Date(y,m-1,1)), iso(new Date(y,m,0))];
    case 'last30': { const start = new Date(now); start.setDate(d-29); return [iso(start), iso(now)]; }
    case 'year': return [iso(new Date(y,0,1)), iso(new Date(y,11,31))];
    case 'custom': return [state.customStart || iso(new Date(y,m,1)), state.customEnd || iso(now)];
    default: return [iso(new Date(y,m,1)), iso(new Date(y,m+1,0))];
  }
}
</script>

function renderFunnel(t, despesas){

  const lucroLiquido = t.profit - despesas;
  const maxVal = Math.max(t.revenue, 1);
  const rows = [
    ['Receita', t.revenue, 'var(--beige)'],
    ['Custos', t.cost, 'var(--gold-dim)'],
    ['Lucro bruto', t.profit, t.profit>=0 ? 'var(--green-soft)':'var(--red)'],
    ['Despesas', despesas, 'var(--border)'],
    ['Lucro líquido', lucroLiquido, lucroLiquido>=0 ? 'var(--green-600)':'var(--red)'],
  ];
  return `<div class="funnel-wrap"><div class="funnel-col" style="flex:1 1 100%;">
    ${rows.map((r,i)=>{
      const pct = Math.min(100, Math.max(2, (Math.abs(r[1])/maxVal)*100));
      return `<div class="funnel-row">
        <div class="funnel-label">${r[0]}</div>
        <div class="funnel-bar-track"><div class="funnel-bar-fill" style="width:${pct}%; background:${r[2]};"></div></div>
        <div class="funnel-value">${fmtBRL(r[1])}</div>
      </div>${i<rows.length-1?'<div class="funnel-arrow">↓</div>':''}`;
    }).join('')}
    <div class="field-hint" style="margin-top:10px;">Despesas gerais da ABA (embalagens, fitas, impressões e outras) cadastradas em "Despesas". Ainda não inclui despesas administrativas como funcionários, sistemas ou impostos.</div>
  </div></div>`;
}

function renderTopClients(periodOrders){
  const byClient = {};
  periodOrders.forEach(o=>{
    if(!byClient[o.clientId]) byClient[o.clientId] = {revenue:0, profit:0};
    byClient[o.clientId].revenue += Number(o.saleValue)||0;
    byClient[o.clientId].profit += orderGrossProfit(o);
  });
  const arr = Object.entries(byClient).map(([id,v])=> ({id, name: clientName(id), ...v})).sort((a,b)=> b.profit-a.profit).slice(0,5);
  if(arr.length===0) return emptyState('users','Sem dados no período', 'Registre pedidos para ver o ranking de clientes.');
  const max = Math.max(...arr.map(a=>a.profit), 1);
  return `<div class="rank-list">${arr.map((a,i)=> `
    <div class="rank-item-wrap" onclick="navigateTo('client-detail','${a.id}')" style="cursor:pointer;">
      <div class="rank-item">
        <div class="rank-num">${i+1}</div>
        <div style="flex:1;">
          <div class="rank-name">${escapeHtml(a.name)}</div>
          <div class="rank-bar-track"><div class="rank-bar-fill" style="width:${Math.max(4,(a.profit/max)*100)}%"></div></div>
        </div>
        <div class="rank-value">${fmtBRL(a.profit)}</div>
      </div>
    </div>`).join('')}</div>`;
}

function renderAlerts(lowMargin, pending, overdue, lowStock){
  const items = [];
  if(lowStock && lowStock.length) items.push(['gold','box', `<b>${lowStock.length} produto(s)</b> abaixo do estoque mínimo: ${lowStock.slice(0,3).map(p=>escapeHtml(p.name)).join(', ')}${lowStock.length>3?'...':''}. <button class="inline-link" onclick="state.stockOnlyLow=true; navigateTo('stock')">Ver estoque</button>`]);
  if(overdue.length) items.push(['red','alert', `<b>${overdue.length} pedido(s) em atraso</b> com saldo pendente de recebimento.`]);
  if(pending.length) items.push(['gold','clock', `<b>${pending.length} pedido(s)</b> com valores ainda não recebidos, totalizando ${fmtBRL(pending.reduce((s,o)=>s+Math.max(0,orderBalance(o)),0))}. <button class="inline-link" onclick="navigateTo('receivables')">Ver a receber</button>`]);
  if(lowMargin.length) items.push(['red','alert', `<b>${lowMargin.length} pedido(s)</b> com margem de lucro abaixo de 15%.`]);
  if(items.length===0) return emptyState('check','Tudo em ordem', 'Nenhum alerta financeiro no período selecionado.');
  return items.map(([tone,icon,text])=> `<div class="alert-item">
    <div class="alert-icon tone-${tone==='red'?'red':'gold'}">${ic(icon)}</div>
    <div class="alert-text">${text}</div>
  </div>`).join('');
}

}
function renderMiniPurchasesTable(purchases){
  if(purchases.length===0) return emptyState('purchases','Nenhuma compra registrada','Registre compras para acompanhar seus custos.', "openPurchaseModal()", "Nova compra");
  return `<div class="table-wrap table-flat"><table><thead><tr><th>Fornecedor</th><th>Data</th><th>Comprovante</th><th class="td-num">Valor</th></tr></thead><tbody>
    ${purchases.map(p=> `<tr onclick="openPurchaseModal('${p.id}')">

      <td class="td-num">${fmtBRL(p.total)}</td>
    </tr>`).join('')}
  </tbody></table></div>`;
}

function marginBadge(margin){
  if(margin >= 25) return `<span class="badge badge-green">${fmtPct(margin)}</span>`;
  if(margin >= 15) return `<span class="badge badge-gold">${fmtPct(margin)}</span>`;
  return `<span class="badge badge-red">${fmtPct(margin)}</span>`;
}
function statusBadge(status){
  const map = { 'Pago':'badge-green', 'Parcial':'badge-gold', 'Não pago':'badge-gray', 'Em atraso':'badge-red' };
  return `<span class="badge ${map[status]||'badge-gray'}">${status}</span>`;
}

function emptyState(icon, title, sub, action, actionLabel){
  return `<div class="empty-state">
    ${ic(icon)}
    <h4>${title}</h4>
    <p>${sub}</p>
    ${action ? `<button class="btn btn-primary btn-sm" onclick="${action}">${ic('plus')} ${actionLabel}</button>` : ''}
  </div>`;
}

/* ---------- Gráficos ---------- */
function destroyCharts(){ Object.values(charts).forEach(c=> c && c.destroy()); charts = {}; }

function buildDashboardCharts(){
  destroyCharts();
  const revCanvas = document.getElementById('chartRevenue');
  const costCanvas = document.getElementById('chartCosts');
  if(!revCanvas) return;
  if(!window.Chart){
    [revCanvas, costCanvas].forEach(c=>{ if(c) c.outerHTML = '<div class="chart-off">Os gráficos precisam de internet para carregar. Os números acima continuam corretos.</div>'; });
    return;
  }

  // últimos 6 meses
  const months = [];
  const now = new Date();
  for(let i=5;i>=0;i--){ const d = new Date(now.getFullYear(), now.getMonth()-i, 1); months.push(d); }
  const labels = months.map(d=> d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','') );
  const revData=[], costData=[], profitData=[];
  months.forEach(d=>{
    const start = isoLocal(new Date(d.getFullYear(), d.getMonth(),1));
    const end = isoLocal(new Date(d.getFullYear(), d.getMonth()+1,0));
    const os = ordersInRange(start,end);
    const t = periodTotals(os);
    revData.push(t.revenue.toFixed(2)); costData.push(t.cost.toFixed(2)); profitData.push(t.profit.toFixed(2));
  });

  const gridColor = 'rgba(255,255,255,0.06)';
  const textColor = '#9aa29c';
  const g = revCanvas.getContext('2d').createLinearGradient(0, 0, 0, 260);
  g.addColorStop(0, 'rgba(181,242,90,0.45)'); g.addColorStop(1, 'rgba(181,242,90,0)');
  charts.revenue = new Chart(revCanvas, {
    type:'line',
    data:{ labels, datasets:[
      {label:'Receita', data:revData, borderColor:'#b5f25a', backgroundColor:g, fill:true, borderWidth:2.5, tension:.38, pointRadius:0, pointHoverRadius:5, pointBackgroundColor:'#b5f25a'},
      {label:'Custos', data:costData, type:'bar', backgroundColor:'#2c322e', hoverBackgroundColor:'#3a413c', borderRadius:6, barPercentage:0.55, order:2},
      {label:'Lucro', data:profitData, borderColor:'#f1ede2', borderDash:[5,4], borderWidth:1.5, tension:.38, pointRadius:2.5, pointBackgroundColor:'#f1ede2', fill:false},
    ]},
    options:{
      responsive:true, maintainAspectRatio:false,
      interaction:{ mode:'index', intersect:false },
      plugins:{ legend:{ labels:{ color: textColor, font:{family:'DM Sans', size:11}, boxWidth:10, usePointStyle:true } },
        tooltip:{ backgroundColor:'#1e2220', borderColor:'#2a302c', borderWidth:1, titleColor:'#f4f1e8', bodyColor:'#dcdfd8', padding:10, callbacks:{ label:(c)=> ' ' + c.dataset.label + ': ' + fmtBRL(Number(c.raw)) } } },
      scales:{
        x:{ grid:{color:'transparent'}, border:{display:false}, ticks:{color:textColor, font:{size:11}} },
        y:{ grid:{color:gridColor}, border:{display:false}, ticks:{color:textColor, font:{size:10}, callback:(v)=> 'R$'+Number(v).toLocaleString('pt-BR')} }
      }
    }
  });

  const [start,end] = getPeriodRange();
  const orders = ordersInRange(start,end);
  const catTotals = {};
  orders.forEach(o=>{ const m = costsByCategory(o); Object.entries(m).forEach(([k,v])=> catTotals[k]=(catTotals[k]||0)+v); });
  const catLabels = Object.keys(catTotals);
  const catVals = Object.values(catTotals);
  const palette = ['#b5f25a','#4d8a2c','#f0c25a','#e6f8c6','#7fcf35','#e5636a','#5b635e'];
  const catTotal = catVals.reduce((a,b)=> a+b, 0);
  const centerText = { id:'centerText', afterDraw(chart){
    if(!catLabels.length) return;
    const { ctx, chartArea:a } = chart, x = (a.left + a.right) / 2, y = (a.top + a.bottom) / 2;
    ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#f4f1e8'; ctx.font = '600 20px Poppins, sans-serif'; ctx.fillText(fmtBRL(catTotal), x, y - 8);
    ctx.fillStyle = '#9aa29c'; ctx.font = '500 11.5px "DM Sans", sans-serif'; ctx.fillText('em custos', x, y + 14);
    ctx.restore();
  } };
  charts.costs = new Chart(costCanvas, {
    type: catLabels.length ? 'doughnut' : 'bar',
    plugins: [centerText],
    data:{ labels: catLabels.length?catLabels:['Sem dados'], datasets:[{ data: catVals.length?catVals:[1], backgroundColor: catLabels.length? palette : ['#222624'], borderWidth:3, borderColor:'#171a19', borderRadius:6 }] },
    options:{
      responsive:true, maintainAspectRatio:false, cutout:'72%',
      plugins:{ legend:{ position:'bottom', labels:{ color:textColor, font:{family:'DM Sans', size:11.5}, boxWidth:10, padding:14, usePointStyle:true,
        generateLabels:(chart)=> catLabels.length
          ? Chart.overrides.doughnut.plugins.legend.labels.generateLabels(chart).map((l,i)=> Object.assign(l, { text: l.text + '  ' + fmtBRL(catVals[i]||0) }))
          : Chart.defaults.plugins.legend.labels.generateLabels(chart) } },
        tooltip:{ backgroundColor:'#1e2220', borderColor:'#2a302c', borderWidth:1, titleColor:'#f4f1e8', bodyColor:'#dcdfd8', padding:10, callbacks:{ label:(c)=> ' ' + c.label + ': ' + fmtBRL(Number(c.raw)) + (catTotal ? ' (' + fmtPct(c.raw / catTotal * 100) + ')' : '') } } }
    }
  });
}
</script>

    <div class="table-wrap"><table><thead><tr>

          <td>${escapeHtml(c.city||'—')}</td>

          <td class="td-num">${fmtBRL(t.revenue)}</td>
          <td class="td-num" style="color:${t.profit>=0?'var(--pos)':'var(--neg)'}">${fmtBRL(t.profit)}</td>
          <td class="td-actions"><button class="icon-btn" onclick="event.stopPropagation(); openClientModal('${c.id}')">${ic('edit')}</button></td>

}

function renderClientDetail(){
  const c = DB.clients.find(x=>x.id===state.clientDetailId);
  if(!c) return `<div class="card">${emptyState('users','Cliente não encontrado','Volte para a lista de clientes.', "navigateTo('clients')", "Voltar")}</div>`;
  const orders = DB.orders.filter(o=>o.clientId===c.id).sort((a,b)=> b.date.localeCompare(a.date));
  const t = periodTotals(orders);
  const totalPaid = orders.reduce((s,o)=>s+orderPaid(o),0);
  const totalPending = orders.reduce((s,o)=>s+Math.max(0,orderBalance(o)),0);
  const initials = c.name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();

  return `
    <a class="back-link" onclick="navigateTo('clients')" style="cursor:pointer;">${ic('chevron')} Voltar para clientes</a>
    <div class="detail-header">
      <div class="avatar-lg">${initials}</div>
      <div style="flex:1;">
        <div class="page-title" style="font-size:20px;">${escapeHtml(c.name)}</div>
        <div class="page-sub">${escapeHtml(c.city||'Cidade não informada')} · <span class="tag-status status-${c.status}">${c.status==='ativo'?'Ativo':'Inativo'}</span></div>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="openClientModal('${c.id}')">${ic('edit')} Editar</button>
      ${orders.length ? `<button class="btn btn-ghost btn-sm" onclick="openReceiptPicker('${c.id}')">${ic('receipt')} Gerar recibo</button>` : ''}
      <button class="btn btn-primary btn-sm" onclick="openOrderModal(null,'${c.id}')">${ic('plus')} Novo pedido</button>
    </div>

    <div class="grid grid-4">
      ${statCard('Receita total', fmtBRL(t.revenue), 'revenue', orders.length+' pedido(s)')}
      ${statCard('Custos totais', fmtBRL(t.cost), 'cost', 'Compras + logística')}
      ${statCard('Lucro gerado', fmtBRL(t.profit), 'profit', 'Margem média '+fmtPct(t.margin))}
      ${statCard('Pendente', fmtBRL(totalPending), 'pending', fmtBRL(totalPaid)+' já recebido')}
    </div>

    ${(c.phone||c.whatsapp||c.doc||c.address||c.notes) ? `
    <div class="card" style="margin-top:20px;">
      <div class="section-title" style="margin:0 0 10px;">Dados do cliente</div>
      <div class="grid grid-2" style="gap:10px;">
        ${c.doc?`<div><div class="stat-label">CPF/CNPJ</div><div style="margin-top:4px;">${escapeHtml(c.doc)}</div></div>`:''}
        ${c.phone?`<div><div class="stat-label">Telefone</div><div style="margin-top:4px;">${escapeHtml(c.phone)}</div></div>`:''}
        ${c.whatsapp?`<div><div class="stat-label">WhatsApp</div><div style="margin-top:4px;">${escapeHtml(c.whatsapp)}</div></div>`:''}
        ${c.cep?`<div><div class="stat-label">CEP</div><div style="margin-top:4px;">${escapeHtml(c.cep)}</div></div>`:''}
        ${c.address?`<div style="grid-column:1/-1;"><div class="stat-label">Endereço</div><div style="margin-top:4px;">${escapeHtml(c.address)}</div></div>`:''}
        ${c.notes?`<div style="grid-column:1/-1;"><div class="stat-label">Observações</div><div style="margin-top:4px; color:var(--text-dim);">${escapeHtml(c.notes)}</div></div>`:''}
      </div>
    </div>` : ''}

    <div class="section-title">Histórico de pedidos e serviços</div>
    ${orders.length===0 ? `<div class="card">${emptyState('orders','Nenhum pedido ainda','Registre o primeiro pedido deste cliente.', `openOrderModal(null,'${c.id}')`, "Novo pedido")}</div>` : `
    <div class="table-wrap"><table><thead><tr>
      <th>Data</th><th>Descrição</th><th>Pagamento</th><th class="td-num">Receita</th><th class="td-num">Custo</th><th class="td-num">Lucro</th><th class="td-num">Margem</th>

      ${orders.map(o=> `<tr onclick="openOrderModal('${o.id}')">

        <td>${escapeHtml(o.description||o.type)}</td>
        <td>${statusBadge(orderPaymentStatus(o))}</td>
        <td class="td-num">${fmtBRL(o.saleValue)}</td>
        <td class="td-num">${fmtBRL(orderTotalCost(o))}</td>
        <td class="td-num" style="color:${orderGrossProfit(o)>=0?'var(--pos)':'var(--neg)'}">${fmtBRL(orderGrossProfit(o))}</td>
        <td class="td-num">${marginBadge(orderMargin(o))}</td>

    <div class="section-title">Comprovantes anexados</div>
    <div class="card">
      ${renderClientReceipts(orders)}

}

function renderClientReceipts(orders){
  const withReceipts = [];
  orders.forEach(o=> (o.costs||[]).forEach(c=>{ if(c.hasReceipt) withReceipts.push({order:o, cost:c}); }));
  if(withReceipts.length===0) return emptyState('receipt','Sem comprovantes','Os comprovantes anexados aos custos de cada pedido aparecerão aqui.');
  return `<div class="rank-list">${withReceipts.map(({order,cost})=> `
    <div class="mini-row" style="border-bottom:1px solid var(--border-soft);">
      <div class="icon-btn" style="color:var(--green-400); cursor:default;">${ic('receipt')}</div>
      <div class="mr-desc"><b style="color:var(--text)">${escapeHtml(cost.category)}</b> · ${escapeHtml(cost.description||'')} <span class="client-row-sub">(${fmtDate(order.date)})</span></div>
      <div class="mr-val">${fmtBRL(cost.value)}</div>
    </div>`).join('')}</div>`;
}

function deleteOrder(id){
  const o = DB.orders.find(x=>x.id===id);
  const hasStock = DB.stockMoves.some(m=> m.refKind==='order' && m.refId===id);
  if(!confirm('Excluir este pedido? Essa ação não pode ser desfeita.' + (hasStock ? '\n\nOs produtos baixados do estoque por este pedido voltam para o estoque.' : ''))) return false;
  DB.orders = DB.orders.filter(o=>o.id!==id);
  setMovesForRef('order', id, []);
  saveDB(); render(); toast('Pedido excluído.');
  return true;
}

function deletePurchase(id){

  DB.purchases = DB.purchases.filter(p=>p.id!==id);
  setMovesForRef('purchase', id, []);
  saveDB(); render(); toast('Compra excluída.');
  return true;
}

function exportData(prefix){
  downloadJSON(DB, (typeof prefix === 'string' ? prefix : 'aba-gestao-backup-') + todayISO() + '.json');
  toast('Backup exportado.');
}

const MERGE_COLLECTIONS = ['clients','suppliers','products','purchases','orders','expenses','baskets','stockMoves'];

function importDataFile(input){
  const file = input.files && input.files[0];
  input.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onerror = ()=> toast('Não foi possível ler o arquivo.', 'error');
  reader.onload = ()=>{
    let data;
    try{ data = JSON.parse(reader.result); }
    catch(e){ toast('Arquivo inválido: não é um JSON legível.', 'error'); return; }
    if(!data || typeof data !== 'object'){ toast('Arquivo inválido.', 'error'); return; }
    if(data.abaImport === 'lancamento') importMerge(data);
    else if(Array.isArray(data.clients) && Array.isArray(data.orders)) importReplace(data);
    else toast('Este arquivo não parece ser um backup do ABA Gestão.', 'error');
  };
  reader.readAsText(file);
}
function importReplace(data){
  if(!confirm('Este é um backup completo. Importar vai SUBSTITUIR todos os dados atuais da sua conta.\n\nSe ainda não exportou um backup do que está aqui, cancele e exporte antes. Continuar?')) return;
  DB = migrateDB(data);
  saveDB(); render(); toast('Backup importado.');
}
// Lançamento: acrescenta só os registros cujo id ainda não existe
function importMerge(data){
  const counts = {};
  // fornecedor ou produto com o mesmo nome de um já cadastrado é reaproveitado, não duplicado
  const remap = {};
  [['suppliers', DB.suppliers], ['products', DB.products]].forEach(([k, existing])=>{
    if(!Array.isArray(data[k])) return;
    data[k] = data[k].filter(x=>{
      if(!x || !x.id || !x.name) return false;
      const same = existing.find(e=> e.id!==x.id && e.name.trim().toLowerCase()===x.name.trim().toLowerCase());
      if(same){ remap[x.id] = same.id; return false; }
      return true;
    });
  });
  const fix = id=> remap[id] || id;
  (data.products||[]).forEach(p=>{ if(p.supplierId) p.supplierId = fix(p.supplierId); });
  (data.purchases||[]).forEach(p=>{ if(p.supplierId) p.supplierId = fix(p.supplierId); (p.items||[]).forEach(it=> it.productId = fix(it.productId)); });
  (data.baskets||[]).forEach(b=> (b.items||[]).forEach(it=> it.productId = fix(it.productId)));
  (data.orders||[]).forEach(o=> (o.baskets||[]).forEach(b=> (b.items||[]).forEach(it=> it.productId = fix(it.productId))));
  (data.stockMoves||[]).forEach(m=> m.productId = fix(m.productId));
  (data.productCosts||[]).forEach(pc=> pc.productId = fix(pc.productId));
  MERGE_COLLECTIONS.forEach(k=>{
    if(!Array.isArray(data[k])) return;
    const ids = new Set(DB[k].map(x=>x.id));
    const fresh = data[k].filter(x=> x && x.id && !ids.has(x.id));
    if(fresh.length){ DB[k].push(...fresh); counts[k] = fresh.length; }
  });
  // produtos com o custo mais recente das compras do arquivo
  (data.productCosts||[]).forEach(pc=>{
    const p = productById(pc.productId);
    if(p && (!p.costDate || pc.date >= p.costDate)){ p.cost = pc.cost; p.costDate = pc.date; }
  });
  const total = Object.values(counts).reduce((a,b)=>a+b,0);
  if(!total){ toast('Nada novo para importar: esses registros já estão no sistema.'); return; }
  DB = migrateDB(DB);
  saveDB(); render();
  const labels = { clients:'cliente(s)', suppliers:'fornecedor(es)', products:'produto(s)', purchases:'compra(s)', orders:'pedido(s)', expenses:'despesa(s)', baskets:'cesta(s)' };
  const parts = Object.entries(counts).filter(([k])=>labels[k]).map(([k,v])=> v+' '+labels[k]);
  toast(parts.length ? 'Importado: ' + parts.join(', ') + '.' : 'Importação concluída.');
}
function resetData(){
  if(!confirm('Isso vai apagar TODOS os dados da sua conta, em todos os aparelhos. Deseja continuar?')) return;
  if(!confirm('Tem certeza? Só será possível voltar por Versões anteriores ou por um backup exportado.')) return;
  DB = migrateDB(emptyDB());
  saveDB(); render(); toast('Todos os dados foram apagados.');
}
</script>

<script>
/* ============================================================
   CALCULADORA DE LUCRO / SIMULADOR
   ============================================================ */
const calcState = { qty:1, unitPrice:0, unitCost:0, freight:0, gas:0, delivery:0, other:0 };

function renderCalculator(){
  return `
    <div class="topbar">
      <div>
        <div class="page-title">Calculadora de lucro</div>
        <div class="page-sub">Simule uma venda antes de fechar e veja o lucro na hora</div>
      </div>
    </div>
    <div class="calc-grid">
      <div class="card">
        <div class="section-title" style="margin:0 0 14px;">Dados da venda</div>
        ${DB.baskets.length ? `<div class="field"><label for="c_basket">Preencher com uma cesta (opcional)</label><select id="c_basket" onchange="fillCalcFromBasket(this.value)"><option value="">Escolha uma cesta...</option>${DB.baskets.map(b=>`<option value="${b.id}">${escapeHtml(b.name)}</option>`).join('')}</select><div class="field-hint">Usa o custo atual do estoque e o preço de venda cadastrado.</div></div>` : ''}
        <div class="field-row">
          <div class="field"><label>Quantidade</label><input type="number" min="1" step="1" id="c_qty" value="${calcState.qty}" oninput="updateCalc('qty',this.value)"></div>
          <div class="field"><label>Preço de venda (unitário)</label><input type="number" min="0" step="0.01" id="c_unitPrice" value="${calcState.unitPrice}" oninput="updateCalc('unitPrice',this.value)"></div>
        </div>
        <div class="field"><label>Custo dos produtos (unitário)</label><input type="number" min="0" step="0.01" id="c_unitCost" value="${calcState.unitCost}" oninput="updateCalc('unitCost',this.value)"></div>
        <div class="field-row">
          <div class="field"><label>Frete (total)</label><input type="number" min="0" step="0.01" id="c_freight" value="${calcState.freight}" oninput="updateCalc('freight',this.value)"></div>
          <div class="field"><label>Gasolina (total)</label><input type="number" min="0" step="0.01" id="c_gas" value="${calcState.gas}" oninput="updateCalc('gas',this.value)"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Entrega (total)</label><input type="number" min="0" step="0.01" id="c_delivery" value="${calcState.delivery}" oninput="updateCalc('delivery',this.value)"></div>
          <div class="field"><label>Outros custos (total)</label><input type="number" min="0" step="0.01" id="c_other" value="${calcState.other}" oninput="updateCalc('other',this.value)"></div>
        </div>
        <div class="field-hint">Dica: para simular uma venda como "10 cestas a R$ 65,90", informe a quantidade e o preço unitário. A receita é calculada automaticamente.</div>
      </div>
      <div class="card calc-result-card" id="calcResult"></div>
    </div>
  `;
}
function fillCalcFromBasket(id){
  const b = DB.baskets.find(x=>x.id===id);
  if(!b) return;
  calcState.unitCost = round2(basketUnitCost(b));
  calcState.unitPrice = Number(b.price)||0;
  render();
}
function updateCalc(key, val){
  calcState[key] = key==='qty' ? Math.max(1, parseInt(val)||1) : (parseFloat(val)||0);
  renderCalcResult();
}
function renderCalcResult(){
  const el = document.getElementById('calcResult');
  if(!el) return;
  const revenue = calcState.qty * calcState.unitPrice;
  const productCost = calcState.qty * calcState.unitCost;
  const totalCost = productCost + calcState.freight + calcState.gas + calcState.delivery + calcState.other;
  const profit = revenue - totalCost;
  const margin = revenue>0 ? (profit/revenue)*100 : 0;
  let tag, tagClass;
  if(revenue<=0){ tag='Informe os valores'; tagClass='tag-low'; }
  else if(margin >= 20){ tag='Venda saudável'; tagClass='tag-healthy'; }
  else if(margin >= 10){ tag='Margem baixa, atenção'; tagClass='tag-low'; }
  else { tag='Margem crítica'; tagClass='tag-bad'; }

  el.innerHTML = `
    <div class="section-title" style="margin:0 0 6px;">Resultado</div>
    <div class="calc-big">${fmtBRL(profit)}</div>
    <div class="field-hint" style="margin:2px 0 14px;">Lucro estimado</div>
    <div class="calc-line"><span>Receita (${calcState.qty} × ${fmtBRL(calcState.unitPrice)})</span><b class="mono">${fmtBRL(revenue)}</b></div>
    <div class="calc-line"><span>Custo dos produtos</span><b class="mono">${fmtBRL(productCost)}</b></div>
    <div class="calc-line"><span>Frete + gasolina + entrega + outros</span><b class="mono">${fmtBRL(calcState.freight+calcState.gas+calcState.delivery+calcState.other)}</b></div>
    <div class="calc-line"><span>Custo total</span><b class="mono">${fmtBRL(totalCost)}</b></div>
    <div class="calc-line"><span>Margem de lucro</span><b class="mono">${fmtPct(margin)}</b></div>
    <div class="calc-tag ${tagClass}">${tag}</div>
  `;
}
</script>

function openClientModal(id){
  const editing = id ? DB.clients.find(c=>c.id===id) : null;
  const c = editing || { id:null, name:'', doc:'', phone:'', whatsapp:'', address:'', cep:'', city:'', notes:'', status:'ativo' };
  const body = `
    <div class="field"><label>Nome do cliente *</label><input id="f_name" value="${escapeHtml(c.name)}" placeholder="Ex: Creche Renascer"></div>
    <div class="field-row">
      <div class="field"><label>CPF / CNPJ</label><input id="f_doc" value="${escapeHtml(c.doc)}"></div>
      <div class="field"><label>Status</label>
        <select id="f_status"><option value="ativo" ${c.status==='ativo'?'selected':''}>Ativo</option><option value="inativo" ${c.status==='inativo'?'selected':''}>Inativo</option></select>
      </div>
    </div>
    <div class="field-row">
      <div class="field"><label>Telefone</label><input id="f_phone" value="${escapeHtml(c.phone)}"></div>
      <div class="field"><label>WhatsApp</label><input id="f_whatsapp" value="${escapeHtml(c.whatsapp)}"></div>
    </div>
    <div class="field"><label>Endereço</label><input id="f_address" value="${escapeHtml(c.address)}"></div>
    <div class="field-row">
      <div class="field"><label>CEP</label><input id="f_cep" value="${escapeHtml(c.cep)}"></div>
      <div class="field"><label>Cidade</label><input id="f_city" value="${escapeHtml(c.city)}"></div>
    </div>
    <div class="field"><label>Observações</label><textarea id="f_notes">${escapeHtml(c.notes)}</textarea></div>
  `;
  const foot = `
    <div>${editing ? `<button class="btn btn-danger btn-sm" onclick="deleteClient('${c.id}')">${ic('trash')} Excluir</button>` : '<span></span>'}</div>
    <div style="display:flex; gap:8px;"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveClient('${c.id||''}')">Salvar cliente</button></div>
  `;
  document.getElementById('modalRoot').innerHTML = modalShell(editing?'Editar cliente':'Novo cliente', body, foot);
}
function saveClient(id){
  const name = document.getElementById('f_name').value.trim();
  if(!name){ toast('Informe o nome do cliente.'); return; }
  const data = {
    name,
    doc: document.getElementById('f_doc').value.trim(),
    status: document.getElementById('f_status').value,
    phone: document.getElementById('f_phone').value.trim(),
    whatsapp: document.getElementById('f_whatsapp').value.trim(),
    address: document.getElementById('f_address').value.trim(),
    cep: document.getElementById('f_cep').value.trim(),
    city: document.getElementById('f_city').value.trim(),
    notes: document.getElementById('f_notes').value.trim(),
  };
  if(id){
    const c = DB.clients.find(x=>x.id===id);
    Object.assign(c, data);
  } else {
    DB.clients.push({ id: uid(), createdAt: todayISO(), ...data });
  }
  saveDB(); closeModal(); render(); toast('Cliente salvo.');
}
function deleteClient(id){
  const hasOrders = DB.orders.some(o=>o.clientId===id);
  if(hasOrders){ toast('Este cliente possui pedidos vinculados e não pode ser excluído.'); return; }
  if(!confirm('Excluir este cliente?')) return;
  DB.clients = DB.clients.filter(c=>c.id!==id);
  saveDB(); closeModal(); navigateTo('clients'); toast('Cliente excluído.');
}

/* ============================================================
   MODAL: PEDIDO / SERVIÇO  (com custos e pagamentos dinâmicos)
   ============================================================ */
let orderDraft = null;

function openOrderModal(id, presetClientId){
  const editing = id ? DB.orders.find(o=>o.id===id) : null;
  orderDraft = editing ? JSON.parse(JSON.stringify(editing)) : {
    id:null, clientId: presetClientId||'', date: todayISO(), description:'', type:'Cesta Básica',
    saleValue:0, costs:[], payments:[], baskets:[], stockOut:true, notes:'', overdue:false, receipts:[]
  };
  if(!Array.isArray(orderDraft.baskets)) orderDraft.baskets = [];
  if(orderDraft.stockOut === undefined) orderDraft.stockOut = true;
  document.getElementById('modalRoot').innerHTML = orderModalHtml(editing);
}

      ${DB.baskets.length===0 ? `<div class="field-hint">Nenhuma cesta cadastrada. Em "Cestas" você monta a composição e o custo sai automático do estoque.</div>` : `
      <div id="basketRows">${renderOrderBasketRows()}</div>
      <div class="add-row-form">
        <select class="f-prod" id="nb_basket" aria-label="Cesta">${DB.baskets.filter(b=>b.active!==false).map(b=>`<option value="${b.id}">${escapeHtml(b.name)} · ${fmtBRL(basketUnitCost(b))} de custo</option>`).join('')}</select>

      <div class="totals-mini"><span>Custo das cestas (preço do dia)</span><b>${fmtBRL(orderBasketsCost(o))}</b></div>
    </div>

    <div class="subblock">
      <div class="subblock-head"><div class="subblock-title">Outros custos do pedido</div></div>
      <div id="costRows">${renderCostRows()}</div>
