    <div style="display:flex; gap:8px;"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveClient('${c.id||''}')">Salvar cliente</button></div>
  `;
  document.getElementById('modalRoot').innerHTML = modalShell(editing?'Editar cliente':'Novo cliente', body, foot);
}
function saveClient(id){
  const name = document.getElementById('f_name').value.trim();
  if(!name){ toast('Informe o nome do cliente.'); return; }
  const data = {
    name,
    doc: document.getElementById('f_doc').value.trim(),
    status: document.getElementById('f_status').value,
    phone: document.getElementById('f_phone').value.trim(),
    whatsapp: document.getElementById('f_whatsapp').value.trim(),
    address: document.getElementById('f_address').value.trim(),
    cep: document.getElementById('f_cep').value.trim(),
    city: document.getElementById('f_city').value.trim(),
    notes: document.getElementById('f_notes').value.trim(),
  };
  if(id){
    const c = DB.clients.find(x=>x.id===id);
    Object.assign(c, data);
  } else {
    DB.clients.push({ id: uid(), createdAt: todayISO(), ...data });
  }
  saveDB(); closeModal(); render(); toast('Cliente salvo.');
}
function deleteClient(id){
  const hasOrders = DB.orders.some(o=>o.clientId===id);
  if(hasOrders){ toast('Este cliente possui pedidos vinculados e não pode ser excluído.'); return; }
  if(!confirm('Excluir este cliente?')) return;
  DB.clients = DB.clients.filter(c=>c.id!==id);
  saveDB(); closeModal(); navigateTo('clients'); toast('Cliente excluído.');
}

/* ============================================================
   MODAL: PEDIDO / SERVIÇO  (com custos e pagamentos dinâmicos)
   ============================================================ */
let orderDraft = null;

function openOrderModal(id, presetClientId, presetCycleId, presetPart){
  const editing = id ? DB.orders.find(o=>o.id===id) : null;
  orderDraft = editing ? JSON.parse(JSON.stringify(editing)) : {
    id:null, clientId: presetClientId||'', date: todayISO(), description:'', type:'Cesta Básica',
    saleValue:0, costs:[], payments:[], baskets:[], stockOut:true, notes:'', overdue:false, receipts:[]
  };
  if(!editing && presetCycleId){
    const cy = DB.cycles.find(c=> c.id===presetCycleId);
    if(cy){
      orderDraft.clientId = cy.clientId;
      orderDraft.cycleId = cy.id;
      orderDraft.cyclePart = presetPart || nextFreePart(cy, null);
      orderDraft.type = 'Compra sob demanda';
      orderDraft.saleValue = round2((Number(cy.monthlyValue)||0) / Math.max(1, parseInt(cy.parts)||2));
      orderDraft.description = `${cy.name} · parte ${orderDraft.cyclePart}`;
    }
  }
  if(!Array.isArray(orderDraft.baskets)) orderDraft.baskets = [];
  if(orderDraft.stockOut === undefined) orderDraft.stockOut = true;
  document.getElementById('modalRoot').innerHTML = orderModalHtml(editing);
}
function orderModalHtml(editing){
  const o = orderDraft;
  const clientOptions = DB.clients.map(c=> `<option value="${c.id}" ${o.clientId===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('');
  const body = `
    <div class="field-row">
      <div class="field"><label>Cliente *</label>
        <select id="f_clientId" onchange="refreshOrderModal()">${clientOptions || '<option value="">Cadastre um cliente primeiro</option>'}</select>
      </div>
      <div class="field"><label>Data *</label><input type="date" id="f_date" value="${o.date}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Tipo</label>
        <select id="f_type">
          ${['Cesta Básica','Compra sob demanda','Outro serviço'].map(t=>`<option ${o.type===t?'selected':''}>${t}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Valor total cobrado do cliente (R$) *</label><input type="number" step="0.01" min="0" id="f_saleValue" value="${o.saleValue}" oninput="orderDraft.saleValue=parseFloat(this.value)||0; renderOrderTotals();"></div>
    </div>
    <div class="field"><label>Descrição</label><input id="f_description" value="${escapeHtml(o.description)}" placeholder="Ex: 10 Cestas Básicas P"></div>
    ${orderCycleFields(o)}

    <div class="subblock">
      <div class="subblock-head"><div class="subblock-title">Cestas do catálogo</div>${o.baskets.length ? `<button class="inline-link" style="font-size:12px;" onclick="useBasketPrice()">Usar preço das cestas no valor cobrado</button>` : ''}</div>
      ${DB.baskets.length===0 ? `<div class="field-hint">Nenhuma cesta cadastrada. Em "Cestas" você monta a composição e o custo sai automático do estoque.</div>` : `
      <div id="basketRows">${renderOrderBasketRows()}</div>
      <div class="add-row-form">
        <select class="f-prod" id="nb_basket" aria-label="Cesta">${DB.baskets.filter(b=>b.active!==false).map(b=>`<option value="${b.id}">${escapeHtml(b.name)} · ${fmtBRL(basketUnitCost(b))} de custo</option>`).join('')}</select>
        <input class="f-qty" id="nb_qty" type="number" min="1" step="1" value="1" aria-label="Quantidade de cestas">
        <button class="btn btn-ghost btn-sm" onclick="addOrderBasket()">${ic('plus')} Add</button>
      </div>
      <label class="checkbox-row" style="font-size:12px; color:var(--text-dim); margin-top:10px;"><input type="checkbox" id="f_stockOut" ${o.stockOut?'checked':''} onchange="orderDraft.stockOut=this.checked;"> Dar baixa dos produtos no estoque ao salvar</label>`}
      <div class="totals-mini"><span>Custo das cestas (preço do dia)</span><b>${fmtBRL(orderBasketsCost(o))}</b></div>
    </div>

    <div class="subblock">
      <div class="subblock-head"><div class="subblock-title">Outros custos do pedido</div></div>
      <div id="costRows">${renderCostRows()}</div>
      <div class="add-row-form">
        <select class="f-cat" id="nc_cat" aria-label="Categoria do custo">${DB.settings.costCategories.map(c=>`<option>${escapeHtml(c)}</option>`).join('')}</select>
        <input class="f-desc" id="nc_desc" placeholder="Descrição (ex: comprovante 1)" aria-label="Descrição do custo">
        <input class="f-val" id="nc_val" type="number" step="0.01" min="0" placeholder="Valor" aria-label="Valor do custo">
        <label class="checkbox-row" style="font-size:11.5px; color:var(--text-dim);"><input type="checkbox" id="nc_receipt"> Tem comprovante</label>
        <button class="btn btn-ghost btn-sm" onclick="addCostRow()">${ic('plus')} Add</button>
      </div>
      <div class="totals-mini"><span>Custos lançados</span><b id="costTotalDisplay">${fmtBRL(orderCostRowsTotal(o))}</b></div>
    </div>

    <div class="subblock">
      <div class="subblock-head"><div class="subblock-title">Pagamentos recebidos</div></div>
      <div id="paymentRows">${renderPaymentRows()}</div>

        <input class="f-val" id="np_date" type="date" value="${todayISO()}" style="width:140px;" aria-label="Data do pagamento">
        <input class="f-val" id="np_val" type="number" step="0.01" min="0" placeholder="Valor" style="width:100px;" aria-label="Valor do pagamento">
        <input class="f-desc" id="np_method" placeholder="Forma (PIX, dinheiro...)" aria-label="Forma de pagamento">
        ${orderBalance(o) > 0.005 && (Number(o.saleValue)||0) > 0 ? `<button class="btn btn-ghost btn-sm" onclick="document.getElementById('np_val').value='${round2(orderBalance(o)).toFixed(2)}'">Saldo</button>` : ''}
        <button class="btn btn-ghost btn-sm" onclick="addPaymentRow()">${ic('plus')} Add</button>
      </div>
    </div>

    <div class="field checkbox-row" style="margin-bottom:14px;">
      <input type="checkbox" id="f_overdue" ${o.overdue?'checked':''} onchange="orderDraft.overdue=this.checked;">
      <label style="margin:0; text-transform:none; font-size:12.5px;">Marcar como pagamento em atraso</label>
    </div>
    <div class="field"><label>Observações</label><textarea id="f_notes">${escapeHtml(o.notes)}</textarea></div>

    <div id="orderTotalsBox"></div>
  `;
  const foot = `
    <div>${editing ? `<button class="btn btn-danger btn-sm" onclick="if(deleteOrder('${o.id}')) closeModal();">${ic('trash')} Excluir</button>` : '<span></span>'}</div>
    <div style="display:flex; gap:8px;"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveOrder()">Salvar pedido</button></div>
  `;
  return modalShell(editing?'Editar pedido':'Novo pedido / serviço', body, foot) ;
}
function renderOrderBasketRows(){
  const o = orderDraft;
  if(o.baskets.length===0) return `<div class="field-hint">Nenhuma cesta adicionada.</div>`;
  return o.baskets.map((b,i)=> `<div class="mini-row">
    <div class="mr-qty">${fmtQty(b.qty)} ×</div>
    <div class="mr-desc">${escapeHtml(b.name)} <span class="client-row-sub">custo ${fmtBRL(b.unitCost)} · venda ${fmtBRL(b.unitPrice)} cada</span></div>
    <div class="mr-val">${fmtBRL(b.qty*b.unitCost)}</div>
    <button class="icon-btn mr-del" aria-label="Remover cesta" onclick="removeOrderBasket(${i})">${ic('trash')}</button>
  </div>`).join('');
}
function addOrderBasket(){
  const b = DB.baskets.find(x=> x.id===document.getElementById('nb_basket').value);
  const qty = parseInt(document.getElementById('nb_qty').value)||0;
  if(!b){ toast('Escolha uma cesta.', 'error'); return; }
  if(qty<=0){ toast('Informe a quantidade de cestas.', 'error'); return; }
  const missing = basketMissingCost(b);
  if(missing.length) toast(`Atenção: ${missing.length} item(ns) da cesta estão sem custo cadastrado, o custo pode estar abaixo do real.`, 'error');
  // guarda nome, preço, custo e composição do dia para o histórico não mudar
  orderDraft.baskets.push({ id: uid(), basketId: b.id, name: b.name, qty, unitPrice: Number(b.price)||0, unitCost: round2(basketUnitCost(b)), items: (b.items||[]).map(it=>({productId: it.productId, qty: Number(it.qty)||0})) });
  const typeSel = document.getElementById('f_type');
  if(typeSel && !orderDraft.id) typeSel.value = 'Cesta Básica';
  refreshOrderModal();
}
function removeOrderBasket(i){ orderDraft.baskets.splice(i,1); refreshOrderModal(); }
function useBasketPrice(){
  orderDraft.saleValue = round2(orderBasketsPrice(orderDraft));
  refreshOrderModal();
}
// Movimentações de saída que o pedido gera (uma por produto)
function orderStockMoves(o){
  if(!o.stockOut) return [];
  const byProduct = {};
  (o.baskets||[]).forEach(b=> (b.items||[]).forEach(it=>{
    if(!productById(it.productId)) return;
    byProduct[it.productId] = (byProduct[it.productId]||0) + (Number(it.qty)||0) * (Number(b.qty)||0);
  }));
  return Object.entries(byProduct).filter(([,q])=> q>0).map(([productId, qty])=> ({ productId, type:'saida', qty, date: o.date, notes: 'Pedido: ' + clientName(o.clientId) }));
}
function renderCostRows(){
  const o = orderDraft;
  if(o.costs.length===0) return `<div class="field-hint">Nenhum custo adicionado ainda.</div>`;
  return o.costs.map((c,i)=> `<div class="mini-row">
    <div class="mr-cat">${escapeHtml(c.category)}</div>
    <div class="mr-desc">${escapeHtml(c.description||'')} ${c.hasReceipt? '<span class="badge badge-green" style="margin-left:4px;">com nota</span>' : '<span class="badge badge-gray" style="margin-left:4px;">sem nota</span>'}</div>
    <div class="mr-val">${fmtBRL(c.value)}</div>
    <button class="icon-btn mr-del" aria-label="Remover custo" onclick="removeCostRow(${i})">${ic('trash')}</button>

}
function renderPaymentRows(){
  const o = orderDraft;

    <button class="icon-btn mr-del" aria-label="Remover pagamento" onclick="removePaymentRow(${i})">${ic('trash')}</button>
  </div>`).join('');
}
function addCostRow(){
  const cat = document.getElementById('nc_cat').value;
  const desc = document.getElementById('nc_desc').value.trim();
  const val = parseFloat(document.getElementById('nc_val').value)||0;
  const hasReceipt = document.getElementById('nc_receipt').checked;
  if(val<=0){ toast('Informe um valor de custo maior que zero.', 'error'); document.getElementById('nc_val').focus(); return; }
  orderDraft.costs.push({id:uid(), category:cat, description:desc, value:val, hasReceipt});
  document.getElementById('nc_desc').value=''; document.getElementById('nc_val').value=''; document.getElementById('nc_receipt').checked=false;

function removeCostRow(i){ orderDraft.costs.splice(i,1); refreshOrderModal(); }
function addPaymentRow(){
  const date = document.getElementById('np_date').value || todayISO();
  const val = parseFloat(document.getElementById('np_val').value)||0;
  const method = document.getElementById('np_method').value.trim();
  if(val<=0){ toast('Informe um valor de pagamento maior que zero.', 'error'); document.getElementById('np_val').focus(); return; }
  orderDraft.payments.push({id:uid(), date, value:val, method});
  document.getElementById('np_val').value=''; document.getElementById('np_method').value='';
  refreshOrderModal();
}
function removePaymentRow(i){ orderDraft.payments.splice(i,1); refreshOrderModal(); }
function refreshOrderModal(){
  // preserve current field values before re-render
  const cur = {
    clientId: document.getElementById('f_clientId')?.value,
    date: document.getElementById('f_date')?.value,
    type: document.getElementById('f_type')?.value,
    description: document.getElementById('f_description')?.value,
    notes: document.getElementById('f_notes')?.value,
  };
  if(cur.clientId!==undefined) orderDraft.clientId = cur.clientId;
  if(cur.date) orderDraft.date = cur.date;
  if(cur.type) orderDraft.type = cur.type;
  if(cur.description!==undefined) orderDraft.description = cur.description;
  if(cur.notes!==undefined) orderDraft.notes = cur.notes;
  // ciclo: a parte escolhida na tela só é lida se o ciclo não acabou de ser trocado
  const cycSel = document.getElementById('f_cycleId');
  if(cycSel && !orderDraft._cyclePicked){
    orderDraft.cycleId = cycSel.value || null;
    const partSel = document.getElementById('f_cyclePart');
    orderDraft.cyclePart = orderDraft.cycleId && partSel ? (parseInt(partSel.value)||null) : null;
  }
  delete orderDraft._cyclePicked;
  if(orderDraft.cycleId && !DB.cycles.some(c=> c.id===orderDraft.cycleId && c.clientId===orderDraft.clientId)){ orderDraft.cycleId = null; orderDraft.cyclePart = null; }
  document.getElementById('modalRoot').innerHTML = orderModalHtml(!!orderDraft.id);
  renderOrderTotals();
}
function renderOrderTotals(){
  const box = document.getElementById('orderTotalsBox');
  const disp = document.getElementById('costTotalDisplay');
  if(disp) disp.textContent = fmtBRL(orderCostRowsTotal(orderDraft));
  if(!box) return;
  const sale = Number(orderDraft.saleValue)||0;
  const cost = orderTotalCost(orderDraft);
  const profit = sale - cost;
  const margin = sale>0 ? (profit/sale)*100 : 0;
  const paid = orderPaid(orderDraft);
  const balance = sale - paid;
  box.innerHTML = `<div class="subblock" style="margin-bottom:0;">
    <div class="calc-line"><span>Custo total</span><b class="mono">${fmtBRL(cost)}</b></div>
    <div class="calc-line"><span>Lucro bruto</span><b class="mono" style="color:${profit>=0?'#7fe0ab':'#f0aeb1'}">${fmtBRL(profit)}</b></div>
    <div class="calc-line"><span>Margem</span><b class="mono">${fmtPct(margin)}</b></div>
    <div class="calc-line"><span>Recebido</span><b class="mono">${fmtBRL(paid)}</b></div>
    <div class="calc-line"><span>Saldo a receber</span><b class="mono" style="color:${balance>0.005?'var(--gold)':'var(--text)'}">${fmtBRL(Math.max(0,balance))}</b></div>
    ${balance < -0.005 ? `<div class="warn-box danger" style="margin:10px 0 0;">Os pagamentos somam ${fmtBRL(-balance)} a mais que o valor cobrado. Confira os valores.</div>` : ''}
  </div>`;
}
function saveOrder(){
  const clientId = document.getElementById('f_clientId').value;
  if(!clientId){ toast('Selecione um cliente. Se ainda não existe, cadastre em Clientes.', 'error'); return; }
  const saleValue = parseFloat(document.getElementById('f_saleValue').value)||0;
  if(saleValue < 0){ toast('O valor cobrado não pode ser negativo.', 'error'); return; }
  if(saleValue === 0 && !confirm('O valor cobrado do cliente está zerado. Salvar mesmo assim?')) return;
  const cycSel = document.getElementById('f_cycleId');
  const cycleId = cycSel && cycSel.value && DB.cycles.some(c=> c.id===cycSel.value && c.clientId===clientId) ? cycSel.value : null;
  const cyclePart = cycleId ? (parseInt(document.getElementById('f_cyclePart').value)||1) : null;
  if(cycleId){
    const clash = DB.orders.find(x=> x.cycleId===cycleId && x.cyclePart===cyclePart && x.id!==orderDraft.id);
    if(clash && !confirm(`O ciclo ${cycleLabel(cycleId)} já tem uma parte ${cyclePart} (lançada em ${fmtDate(clash.date)}). Salvar como parte ${cyclePart} mesmo assim?`)) return;
  }
  const data = {
    clientId, cycleId, cyclePart,
    date: document.getElementById('f_date').value || todayISO(),
    type: document.getElementById('f_type').value,
    saleValue,
    description: document.getElementById('f_description').value.trim(),
    notes: document.getElementById('f_notes').value.trim(),
    costs: orderDraft.costs,
    payments: orderDraft.payments,
    overdue: orderDraft.overdue,
    receipts: orderDraft.receipts||[],
    baskets: orderDraft.baskets,
    stockOut: !!orderDraft.stockOut,
  };
  const id = orderDraft.id || uid();
  const moves = orderStockMoves(data);
  if(moves.length){
    const map = stockMap({kind:'order', id});
    const short = moves.filter(m=> (map[m.productId]||0) < m.qty).map(m=> `${productName(m.productId)} (tem ${fmtQty(map[m.productId]||0)}, precisa ${fmtQty(m.qty)})`);
    if(short.length && !confirm('Estoque insuficiente para:\n\n' + short.join('\n') + '\n\nSalvar mesmo assim? O estoque desses produtos ficará negativo.')) return;
  }
  if(orderDraft.id){
    const o = DB.orders.find(x=>x.id===orderDraft.id);
    Object.assign(o, data);
  } else {
    DB.orders.push({ id, ...data });
  }
  setMovesForRef('order', id, moves);
  saveDB(); closeModal(); orderDraft=null; render(); toast(moves.length ? 'Pedido salvo e estoque atualizado.' : 'Pedido salvo.');
}

function purchaseItemsTotal(items){ return round2((items||[]).reduce((s,it)=> s + (Number(it.qty)||0)*(Number(it.unitCost)||0), 0)); }
function renderPurchaseItems(){
  const items = purchaseDraft.items;
  if(items.length===0) return `<div class="field-hint">Nenhum item lançado.</div>`;
  return items.map((it,i)=> `<div class="mini-row">

  </div>`).join('') + `<div class="totals-mini"><span>Soma dos itens</span><b>${fmtBRL(purchaseItemsTotal(items))}</b></div>`;
}
// Se o total estava vazio ou igual à soma anterior, acompanha a soma dos itens
function syncPurchaseTotal(prevSum){
  const input = document.getElementById('pf_total');
  const cur = parseFloat(input.value)||0;
  if(cur===0 || Math.abs(cur - prevSum) < 0.005) input.value = purchaseItemsTotal(purchaseDraft.items).toFixed(2);
}
function addPurchaseItem(){
  const productId = document.getElementById('pi_prod').value;
  const qty = parseFloat(document.getElementById('pi_qty').value)||0;
  const unitCost = parseFloat(document.getElementById('pi_cost').value)||0;
  if(qty<=0){ toast('Informe a quantidade do item.', 'error'); document.getElementById('pi_qty').focus(); return; }
  if(unitCost<=0){ toast('Informe o valor unitário do item.', 'error'); document.getElementById('pi_cost').focus(); return; }
  const prev = purchaseItemsTotal(purchaseDraft.items);
  purchaseDraft.items.push({ productId, qty, unitCost });
  document.getElementById('pi_qty').value=''; document.getElementById('pi_cost').value='';
  document.getElementById('purchaseItemsBox').innerHTML = renderPurchaseItems();
  syncPurchaseTotal(prev);
}
function removePurchaseItem(i){
  const prev = purchaseItemsTotal(purchaseDraft.items);
  purchaseDraft.items.splice(i,1);
  document.getElementById('purchaseItemsBox').innerHTML = renderPurchaseItems();
  syncPurchaseTotal(prev);
}
// Atualiza o "último custo" do produto quando a compra é a mais recente
function applyPurchaseCosts(purchase){
  (purchase.items||[]).forEach(it=>{
    const p = productById(it.productId);
    if(!p) return;
    if(!p.costDate || purchase.date >= p.costDate){ p.cost = Number(it.unitCost)||0; p.costDate = purchase.date; if(purchase.supplierId) p.supplierId = purchase.supplierId; }
  });
}
function savePurchase(id){
  const total = parseFloat(document.getElementById('pf_total').value)||0;
  if(total<=0){ toast('Informe o valor total da compra.', 'error'); document.getElementById('pf_total').focus(); return; }
  const itemsSum = purchaseItemsTotal(purchaseDraft.items);
  if(purchaseDraft.items.length && Math.abs(itemsSum-total) > 0.01 && !confirm(`A soma dos itens (${fmtBRL(itemsSum)}) é diferente do valor total (${fmtBRL(total)}). Salvar mesmo assim?`)) return;
  const supplierText = document.getElementById('pf_supplier').value.trim();
  let sup = supplierByName(supplierText);
  let createdSupplier = false;
  if(supplierText && !sup){ sup = newSupplierRecord(supplierText); DB.suppliers.push(sup); createdSupplier = true; }
  const data = {
    date: document.getElementById('pf_date').value || todayISO(),
    supplier: sup ? sup.name : '',
    supplierId: sup ? sup.id : null,
    clientId: document.getElementById('pf_client').value || null,
    description: document.getElementById('pf_desc').value.trim(),
    products: document.getElementById('pf_products').value.trim(),
    total,
    paymentMethod: document.getElementById('pf_method').value.trim(),
    hasReceipt: document.getElementById('pf_receipt').checked,
    notes: document.getElementById('pf_notes').value.trim(),
    items: purchaseDraft.items,
    toStock: !!purchaseDraft.toStock,
  };
  const pid = id || uid();
  if(id){
    const p = DB.purchases.find(x=>x.id===id);
    Object.assign(p, data);
  } else {
    DB.purchases.push({ id: pid, ...data });
  }
  applyPurchaseCosts(data);
  setMovesForRef('purchase', pid, data.toStock ? data.items.map(it=> ({ productId: it.productId, type:'entrada', qty: Number(it.qty)||0, unitCost: Number(it.unitCost)||0, date: data.date, notes: 'Compra: ' + (data.supplier || 'sem fornecedor') })) : []);
  saveDB(); closeModal(); purchaseDraft = null; render();
  toast(createdSupplier ? `Compra salva. Fornecedor "${sup.name}" cadastrado.` : 'Compra salva.');
}

function renderStock(){

  const zero = DB.products.filter(p=> (map[p.id]||0) <= 0).length;
  const recentMoves = DB.stockMoves.slice().sort((a,b)=> (b.date||'').localeCompare(a.date||'')).slice(0,15);

function deleteMove(id){
  if(!confirm('Excluir esta movimentação manual? O saldo do produto será recalculado.')) return;
  DB.stockMoves = DB.stockMoves.filter(m=> m.id!==id);
  saveDB(); render(); toast('Movimentação excluída.');
}

               : `<div class="field"><label for="pr_initial">Quantidade em estoque hoje</label><input type="number" step="0.001" min="0" id="pr_initial" value="0"><div class="field-hint">Entra como saldo inicial.</div></div>`}

    <div class="field"><label for="pr_notes">Observações</label><textarea id="pr_notes">${escapeHtml(p.notes||'')}</textarea></div>
    ${inBaskets.length ? `<div class="field-hint" style="margin-bottom:12px;">Usado em: ${inBaskets.map(b=>escapeHtml(b.name)).join(', ')}.</div>` : ''}
    ${moves.length ? `<div class="subblock"><div class="subblock-title" style="margin-bottom:6px;">Movimentações recentes</div>

    </div>` : ''}

  `;

function saveProduct(id){
  const nameEl = document.getElementById('pr_name');
  const name = nameEl.value.trim();
  if(!name){ toast('Informe o nome do produto.', 'error'); nameEl.focus(); return; }
  const dup = DB.products.find(x=> x.id!==id && x.name.trim().toLowerCase()===name.toLowerCase());
  if(dup){ toast('Já existe um produto com esse nome.', 'error'); nameEl.focus(); return; }
  const cost = parseFloat(document.getElementById('pr_cost').value)||0;
  const minStock = parseFloat(document.getElementById('pr_min').value)||0;
  if(cost<0 || minStock<0){ toast('Custo e estoque mínimo não podem ser negativos.', 'error'); return; }
  const data = {
    name,
    category: document.getElementById('pr_category').value,
    unit: document.getElementById('pr_unit').value,
    cost, minStock,
    supplierId: document.getElementById('pr_supplier').value || null,
    notes: document.getElementById('pr_notes').value.trim(),
  };
  if(id){
    const p = productById(id);
    if(Math.abs((Number(p.cost)||0) - cost) > 0.0001) data.costDate = todayISO();
    Object.assign(p, data);
  } else {
    const nid = uid();
    DB.products.push({ id: nid, createdAt: todayISO(), costDate: cost>0 ? todayISO() : null, ...data });
    const initial = parseFloat(document.getElementById('pr_initial').value)||0;
    if(initial > 0) DB.stockMoves.push({ id: uid(), productId: nid, type:'ajuste', qty: initial, date: todayISO(), notes:'Saldo inicial' });
  }
  saveDB(); closeModal(); render(); toast('Produto salvo.');
}
function deleteProduct(id){
  const inBaskets = DB.baskets.filter(b=> (b.items||[]).some(it=> it.productId===id));
  if(inBaskets.length){ toast('Este produto está na composição de: ' + inBaskets.map(b=>b.name).join(', ') + '. Remova da cesta antes.', 'error'); return; }
  if(!confirm('Excluir este produto e todas as movimentações de estoque dele?')) return;
  DB.products = DB.products.filter(p=> p.id!==id);
  DB.stockMoves = DB.stockMoves.filter(m=> m.productId!==id);
  DB.purchases.forEach(pu=> { pu.items = (pu.items||[]).filter(it=> it.productId!==id); });
  saveDB(); closeModal(); render(); toast('Produto excluído.');
}

function openMoveModal(productId){
  if(!DB.products.length){ toast('Cadastre um produto primeiro.', 'error'); return; }
  const sorted = DB.products.slice().sort((a,b)=> a.name.localeCompare(b.name));
  const body = `
    <div class="field"><label for="mv_product">Produto *</label><select id="mv_product" onchange="updateMoveHint()">${sorted.map(p=>`<option value="${p.id}" ${p.id===productId?'selected':''}>${escapeHtml(p.name)}</option>`).join('')}</select>
      <div class="field-hint" id="mv_current"></div></div>
    <div class="field-row">
      <div class="field"><label for="mv_type">Tipo *</label><select id="mv_type" onchange="updateMoveHint()">
        <option value="entrada">Entrada (chegou produto)</option>
        <option value="saida">Saída (perda, doação, uso)</option>
        <option value="ajuste">Ajuste por contagem</option>
      </select></div>
      <div class="field"><label for="mv_date">Data *</label><input type="date" id="mv_date" value="${todayISO()}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label for="mv_qty" id="mv_qty_label">Quantidade *</label><input type="number" step="0.001" min="0" id="mv_qty"></div>
      <div class="field" id="mv_cost_field"><label for="mv_cost">Custo unitário (opcional)</label><input type="number" step="0.01" min="0" id="mv_cost"><div class="field-hint">Se informado, atualiza o último custo.</div></div>
    </div>
    <div class="field"><label for="mv_notes">Motivo / observação</label><input id="mv_notes" placeholder="Ex: Avaria, contagem do mês"></div>
    <div class="field-hint">Para compras com nota, prefira lançar em "Compras" com os itens: o estoque e o custo são atualizados juntos.</div>
  `;
  const foot = `<span></span><div style="display:flex; gap:8px;"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveMove()">Registrar</button></div>`;
  document.getElementById('modalRoot').innerHTML = modalShell('Movimentar estoque', body, foot);
  updateMoveHint();
}
function updateMoveHint(){
  const p = productById(document.getElementById('mv_product').value);
  const type = document.getElementById('mv_type').value;
  document.getElementById('mv_current').textContent = p ? `Saldo atual: ${fmtQty(productStock(p.id))} ${p.unit||'un'}` : '';
  document.getElementById('mv_qty_label').textContent = type==='ajuste' ? 'Quantidade contada (novo saldo) *' : 'Quantidade *';
  document.getElementById('mv_cost_field').style.display = type==='entrada' ? '' : 'none';
}
function saveMove(){
  const productId = document.getElementById('mv_product').value;
  const type = document.getElementById('mv_type').value;
  const raw = document.getElementById('mv_qty').value;
  const qty = parseFloat(raw);
  if(raw==='' || !isFinite(qty) || qty<0 || (type!=='ajuste' && qty===0)){ toast(type==='ajuste' ? 'Informe a quantidade contada.' : 'Informe uma quantidade maior que zero.', 'error'); document.getElementById('mv_qty').focus(); return; }
  const date = document.getElementById('mv_date').value || todayISO();
  const notes = document.getElementById('mv_notes').value.trim();
  const current = productStock(productId);
  if(type==='saida' && qty > current && !confirm(`O saldo atual é ${fmtQty(current)}. A saída vai deixar o estoque negativo. Continuar?`)) return;
  const move = { id: uid(), productId, type, date, notes: notes || (type==='ajuste' ? 'Ajuste por contagem' : '') };
  move.qty = type==='ajuste' ? round2(qty - current) : qty;
  if(type==='ajuste' && Math.abs(move.qty) < 0.0001){ toast('O saldo já está igual à contagem. Nada a ajustar.'); closeModal(); return; }
  const cost = parseFloat(document.getElementById('mv_cost').value)||0;
  if(type==='entrada' && cost>0){ move.unitCost = cost; const p = productById(productId); if(p && (!p.costDate || date >= p.costDate)){ p.cost = cost; p.costDate = date; } }
  DB.stockMoves.push(move);
  saveDB(); closeModal(); render(); toast('Estoque atualizado.');
}

    ${list.length===0 ? `<div class="card">${emptyState('basket','Nenhuma cesta cadastrada','Monte a cesta P, M, G com os produtos e o sistema calcula custo e margem sozinho.', DB.products.length ? "openBasketModal()" : '', 'Nova cesta')}</div>` : `

let basketDraft = null;
function openBasketModal(id){
  if(!DB.products.length){ toast('Cadastre produtos no Estoque antes de montar uma cesta.', 'error'); return; }
  const editing = id ? DB.baskets.find(b=>b.id===id) : null;
  basketDraft = editing ? JSON.parse(JSON.stringify(editing)) : { id:null, name:'', price:0, items:[], notes:'', active:true, targetMargin:25 };
  if(basketDraft.targetMargin===undefined) basketDraft.targetMargin = 25;
  const b = basketDraft;
  const body = `
    <div class="field-row">
      <div class="field"><label for="bk_name">Nome da cesta *</label><input id="bk_name" value="${escapeHtml(b.name)}" placeholder="Ex: Cesta Básica P"></div>
      <div class="field"><label for="bk_price">Preço de venda (R$)</label><input type="number" step="0.01" min="0" id="bk_price" value="${b.price||0}" oninput="basketDraft.price=parseFloat(this.value)||0; renderBasketTotals();"></div>
    </div>
    <div class="subblock">
      <div class="subblock-head"><div class="subblock-title">Composição</div></div>
      <div id="basketItemsBox">${renderBasketItems()}</div>
      <div class="add-row-form">
        <select class="f-prod" id="bi_prod" aria-label="Produto">${DB.products.slice().sort((x,y)=>x.name.localeCompare(y.name)).map(p=>`<option value="${p.id}">${escapeHtml(p.name)} (${escapeHtml(p.unit||'un')})</option>`).join('')}</select>
        <input class="f-qty" id="bi_qty" type="number" min="0" step="0.001" value="1" aria-label="Quantidade por cesta">
        <button class="btn btn-ghost btn-sm" onclick="addBasketItem()">${ic('plus')} Add</button>
      </div>
    </div>
    <div id="basketTotals"></div>
    <div class="field checkbox-row" style="margin-top:14px;">
      <input type="checkbox" id="bk_active" ${b.active!==false?'checked':''}>
      <label for="bk_active" style="margin:0; text-transform:none; font-size:12.5px;">Cesta ativa (aparece no lançamento de pedidos)</label>
    </div>
    <div class="field"><label for="bk_notes">Observações</label><textarea id="bk_notes">${escapeHtml(b.notes||'')}</textarea></div>
  `;
  const foot = `
    <div>${editing ? `<button class="btn btn-danger btn-sm" onclick="deleteBasket('${b.id}')">${ic('trash')} Excluir</button>` : '<span></span>'}</div>
    <div style="display:flex; gap:8px;"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveBasket()">Salvar cesta</button></div>
  `;
  document.getElementById('modalRoot').innerHTML = modalShell(editing?'Editar cesta':'Nova cesta', body, foot);
  renderBasketTotals();
}
function renderBasketItems(){
  const items = basketDraft.items;
  if(!items.length) return `<div class="field-hint">Adicione os produtos e a quantidade de cada um por cesta.</div>`;
  return items.map((it,i)=>{
    const p = productById(it.productId);
    const unitCost = p ? Number(p.cost)||0 : 0;
    return `<div class="mini-row">
      <div class="mr-qty">${fmtQty(it.qty)} ${escapeHtml(p?.unit||'')}</div>
      <div class="mr-desc">${escapeHtml(productName(it.productId))} ${unitCost>0 ? `<span class="client-row-sub">${fmtBRL(unitCost)} cada</span>` : '<span class="badge badge-red">sem custo</span>'}</div>
      <div class="mr-val">${fmtBRL((Number(it.qty)||0)*unitCost)}</div>
      <button class="icon-btn mr-del" aria-label="Remover item" onclick="removeBasketItem(${i})">${ic('trash')}</button>
    </div>`;
  }).join('');
}
function renderBasketTotals(){
  const box = document.getElementById('basketTotals');
  if(!box) return;
  const cost = basketUnitCost(basketDraft), price = Number(basketDraft.price)||0;
  const profit = price - cost, margin = price>0 ? profit/price*100 : 0;
  const tm = Number(basketDraft.targetMargin)||0;
  const suggested = tm>0 && tm<100 ? cost/(1-tm/100) : 0;
  box.innerHTML = `<div class="subblock" style="margin-bottom:0;">
    <div class="calc-line"><span>Custo por cesta</span><b class="mono">${fmtBRL(cost)}</b></div>
    <div class="calc-line"><span>Lucro por cesta</span><b class="mono" style="color:${profit>=0?'#7fe0ab':'#f0aeb1'}">${price>0 ? fmtBRL(profit) : '—'}</b></div>
    <div class="calc-line"><span>Margem</span><b class="mono">${price>0 ? fmtPct(margin) : '—'}</b></div>
    <div class="calc-line" style="align-items:center; gap:8px;"><span>Preço para margem de <input type="number" min="0" max="95" step="1" value="${tm}" aria-label="Margem desejada" style="width:56px; background:var(--surface); border:1px solid var(--border); border-radius:6px; color:var(--text); padding:3px 6px;" onchange="basketDraft.targetMargin=parseFloat(this.value)||0; renderBasketTotals();">%</span>
      <span><b class="mono">${suggested>0 ? fmtBRL(suggested) : '—'}</b> ${suggested>0 ? `<button class="inline-link" style="font-size:12px; margin-left:6px;" onclick="applySuggestedPrice(${round2(suggested)})">usar</button>` : ''}</span></div>
  </div>`;
}
function applySuggestedPrice(v){
  basketDraft.price = v;
  document.getElementById('bk_price').value = v.toFixed(2);
  renderBasketTotals();
}
function addBasketItem(){
  const productId = document.getElementById('bi_prod').value;
  const qty = parseFloat(document.getElementById('bi_qty').value)||0;
  if(qty<=0){ toast('Informe a quantidade por cesta.', 'error'); return; }
  const existing = basketDraft.items.find(it=> it.productId===productId);
  if(existing) existing.qty = round2((Number(existing.qty)||0) + qty);
  else basketDraft.items.push({ productId, qty });
  document.getElementById('bi_qty').value = 1;
  document.getElementById('basketItemsBox').innerHTML = renderBasketItems();
  renderBasketTotals();
}
function removeBasketItem(i){
  basketDraft.items.splice(i,1);
  document.getElementById('basketItemsBox').innerHTML = renderBasketItems();
  renderBasketTotals();
}
function saveBasket(){
  const name = document.getElementById('bk_name').value.trim();
  if(!name){ toast('Informe o nome da cesta.', 'error'); document.getElementById('bk_name').focus(); return; }
  if(!basketDraft.items.length){ toast('Adicione pelo menos um produto na composição.', 'error'); return; }
  const price = parseFloat(document.getElementById('bk_price').value)||0;
  if(price<0){ toast('O preço não pode ser negativo.', 'error'); return; }
  const data = { name, price, items: basketDraft.items, notes: document.getElementById('bk_notes').value.trim(), active: document.getElementById('bk_active').checked, targetMargin: basketDraft.targetMargin };
  if(basketDraft.id){ Object.assign(DB.baskets.find(b=>b.id===basketDraft.id), data); }
  else DB.baskets.push({ id: uid(), createdAt: todayISO(), ...data });
  saveDB(); closeModal(); basketDraft = null; render(); toast('Cesta salva.');
}
function deleteBasket(id){
  if(!confirm('Excluir esta cesta? Pedidos antigos que usaram ela continuam com o custo registrado.')) return;
  DB.baskets = DB.baskets.filter(b=> b.id!==id);
  saveDB(); closeModal(); render(); toast('Cesta excluída.');
}

/* ============================================================
   FORNECEDORES
   ============================================================ */
function renderSuppliers(){
  const q = state.searchSuppliers.toLowerCase();
  const list = DB.suppliers.filter(s=> s.name.toLowerCase().includes(q) || (s.city||'').toLowerCase().includes(q)).sort((a,b)=> a.name.localeCompare(b.name));
  return `
    <div class="topbar">
      <div>
        <div class="page-title">Fornecedores</div>
        <div class="page-sub">${DB.suppliers.length} fornecedor(es) · onde a ABA compra e quanto gasta em cada um</div>
      </div>
      <button class="btn btn-primary" onclick="openSupplierModal()">${ic('plus')} Novo fornecedor</button>
    </div>
    <div class="toolbar">
      <div class="search-box">${ic('search')}<input id="s_suppliers" aria-label="Buscar fornecedor" placeholder="Buscar fornecedor ou cidade..." value="${escapeHtml(state.searchSuppliers)}" oninput="state.searchSuppliers=this.value; render();"></div>
    </div>
    ${list.length===0 ? `<div class="card">${emptyState('truck', DB.suppliers.length ? 'Nenhum fornecedor encontrado' : 'Nenhum fornecedor cadastrado', 'Fornecedores também são criados automaticamente quando você lança uma compra com um nome novo.', "openSupplierModal()", "Novo fornecedor")}</div>` : `
    <div class="table-wrap"><table><thead><tr>
      <th>Fornecedor</th><th>Contato</th><th>Cidade</th><th class="td-num">Compras</th><th class="td-num">Total comprado</th><th>Última compra</th>
    </tr></thead><tbody>
      ${list.map(s=>{
        const ps = supplierPurchases(s.id);
        const total = ps.reduce((a,p)=> a + (Number(p.total)||0), 0);
        const last = ps.map(p=>p.date).sort().pop();
        return `<tr onclick="openSupplierModal('${s.id}')">
          <td><div class="client-row-name">${escapeHtml(s.name)}</div><div class="client-row-sub">${escapeHtml(s.doc||'')}</div></td>
          <td>${escapeHtml(s.contact||'')}${s.phone ? `<div class="client-row-sub">${escapeHtml(s.phone)}</div>` : (s.contact ? '' : '<span class="client-row-sub">—</span>')}</td>
          <td>${escapeHtml(s.city||'—')}</td>
          <td class="td-num">${ps.length}</td>
          <td class="td-num">${fmtBRL(total)}</td>
          <td>${last ? fmtDate(last) : '<span class="client-row-sub">—</span>'}</td>
        </tr>`;
      }).join('')}
    </tbody></table></div>`}
  `;
}
function openSupplierModal(id){
  const editing = id ? supplierById(id) : null;
  const s = editing || { id:null, name:'', doc:'', phone:'', contact:'', city:'', notes:'' };
  const ps = editing ? supplierPurchases(editing.id).sort((a,b)=> b.date.localeCompare(a.date)) : [];
  const products = editing ? DB.products.filter(p=> p.supplierId===editing.id) : [];
  const body = `
    <div class="field"><label for="sp_name">Nome *</label><input id="sp_name" value="${escapeHtml(s.name)}" placeholder="Ex: Atacadão Gama"></div>
    <div class="field-row">
      <div class="field"><label for="sp_doc">CNPJ / CPF</label><input id="sp_doc" value="${escapeHtml(s.doc||'')}"></div>
      <div class="field"><label for="sp_city">Cidade</label><input id="sp_city" value="${escapeHtml(s.city||'')}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label for="sp_contact">Pessoa de contato</label><input id="sp_contact" value="${escapeHtml(s.contact||'')}"></div>
      <div class="field"><label for="sp_phone">Telefone</label><input id="sp_phone" type="tel" value="${escapeHtml(s.phone||'')}"></div>
    </div>
    <div class="field"><label for="sp_notes">Observações</label><textarea id="sp_notes" placeholder="Ex: melhor preço de arroz, entrega às terças">${escapeHtml(s.notes||'')}</textarea></div>
    ${editing ? `<div class="subblock">
      <div class="subblock-title" style="margin-bottom:6px;">Compras (${ps.length}) · ${fmtBRL(ps.reduce((a,p)=>a+(Number(p.total)||0),0))}</div>
      ${ps.length ? ps.slice(0,8).map(p=> `<div class="mini-row"><div class="mr-cat">${fmtDate(p.date)}</div><div class="mr-desc">${escapeHtml(p.description||'')}</div><div class="mr-val">${fmtBRL(p.total)}</div></div>`).join('') : '<div class="field-hint">Nenhuma compra vinculada.</div>'}
      ${products.length ? `<div class="field-hint" style="margin-top:8px;">Fornecedor habitual de: ${products.map(p=>escapeHtml(p.name)).join(', ')}.</div>` : ''}
    </div>` : ''}
  `;
  const foot = `
    <div>${editing ? `<button class="btn btn-danger btn-sm" onclick="deleteSupplier('${s.id}')">${ic('trash')} Excluir</button>` : '<span></span>'}</div>
    <div style="display:flex; gap:8px;"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveSupplier('${s.id||''}')">Salvar fornecedor</button></div>
  `;
  document.getElementById('modalRoot').innerHTML = modalShell(editing?'Editar fornecedor':'Novo fornecedor', body, foot);
}
function saveSupplier(id){
  const name = document.getElementById('sp_name').value.trim();
  if(!name){ toast('Informe o nome do fornecedor.', 'error'); document.getElementById('sp_name').focus(); return; }
  const dup = DB.suppliers.find(x=> x.id!==id && x.name.trim().toLowerCase()===name.toLowerCase());
  if(dup){ toast('Já existe um fornecedor com esse nome.', 'error'); return; }
  const data = {
    name,
    doc: document.getElementById('sp_doc').value.trim(),
    city: document.getElementById('sp_city').value.trim(),
    contact: document.getElementById('sp_contact').value.trim(),
    phone: document.getElementById('sp_phone').value.trim(),
    notes: document.getElementById('sp_notes').value.trim(),
  };
  if(id){
    Object.assign(supplierById(id), data);
    // mantém o nome em texto das compras igual ao cadastro
    DB.purchases.forEach(p=>{ if(p.supplierId===id) p.supplier = name; });
  } else DB.suppliers.push({ id: uid(), createdAt: todayISO(), ...data });
  saveDB(); closeModal(); render(); toast('Fornecedor salvo.');
}
function deleteSupplier(id){
  const n = supplierPurchases(id).length;
  if(!confirm(n ? `Este fornecedor tem ${n} compra(s). As compras continuam com o nome registrado, só o cadastro é removido. Excluir?` : 'Excluir este fornecedor?')) return;
  DB.suppliers = DB.suppliers.filter(s=> s.id!==id);
  DB.purchases.forEach(p=>{ if(p.supplierId===id) p.supplierId = null; });
  DB.products.forEach(p=>{ if(p.supplierId===id) p.supplierId = null; });
  saveDB(); closeModal(); render(); toast('Fornecedor excluído.');
}

/* ============================================================
   AFTER RENDER / INIT
   ============================================================ */
function afterRender(){
  if(state.view==='dashboard'){ buildDashboardCharts(); }
  else destroyCharts();
  if(state.view==='calculator'){ renderCalcResult(); }
}

document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && document.getElementById('modalOverlay')) closeModal();
});

render();
if(loadWarning) toast(loadWarning, 'error');
</script>
