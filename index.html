<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Gestão financeira, estoque, fornecedores e cestas da ABA Alimentos e Distribuição.">
<meta name="theme-color" content="#0d1712">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232d6a4f'/%3E%3Ctext x='32' y='44' font-family='Arial,sans-serif' font-size='34' font-weight='800' fill='%23e9e2cf' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<title>ABA Gestão · Controle Financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg: #0d1712;
  --bg-soft: #122019;
  --surface: #16241c;
  --surface-2: #1c2e23;
  --border: #23392c;
  --border-soft: #1d3226;
  --green-900: #0f2a1c;
  --green-700: #1f5c3d;
  --green-600: #2d6a4f;
  --green-500: #40916c;
  --green-400: #52b788;
  --beige: #e9e2cf;
  --beige-dim: #b9b39e;
  --gold: #d3a84c;
  --gold-dim: #a3823c;
  --red: #c1666b;
  --red-dim: #7a3b3f;
  --text: #eeeae1;
  --text-dim: #9aa89e;
  --text-faint: #6c7a70;
  --radius: 14px;
  --radius-sm: 9px;
  --font-display: 'Poppins', sans-serif;
  --font-body: 'DM Sans', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --shadow: 0 8px 30px -12px rgba(0,0,0,0.55);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:
    radial-gradient(1100px 600px at 85% -10%, rgba(45,106,79,0.20), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(211,168,76,0.08), transparent 55%),
    var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing: antialiased;
}
.mono{ font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
::selection{ background: var(--green-600); color:#fff; }
button{ font-family: inherit; cursor:pointer; }
input, select, textarea{ font-family: inherit; }
a{ color: inherit; }
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background: var(--border); border-radius: 10px; }

/* ---------- Layout ---------- */
.app{ display:flex; min-height:100vh; }

.sidebar{
  width: 236px;
  flex-shrink:0;
  background: linear-gradient(180deg, var(--green-900), var(--bg-soft) 70%);
  border-right: 1px solid var(--border-soft);
  padding: 22px 14px;
  display:flex;
  flex-direction:column;
  gap: 4px;
  position: sticky;
  top:0;
  height:100vh;
  z-index: 40;
}
.brand{
  display:flex; align-items:center; gap:10px;
  padding: 6px 10px 22px 10px;
}
.brand-mark{
  width:38px; height:38px; border-radius:10px;
  background: linear-gradient(145deg, var(--green-500), var(--green-700));
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:800; color:#eafff2;
  font-size:16px;
  box-shadow: 0 4px 14px -4px rgba(64,145,108,0.6);
  flex-shrink:0;
}
.brand-text .t1{ font-family:var(--font-display); font-weight:700; font-size:15px; letter-spacing:0.2px; color:var(--beige); line-height:1.15;}
.brand-text .t2{ font-size:10.5px; color: var(--text-faint); letter-spacing:1.4px; text-transform:uppercase; margin-top:2px;}

.nav{ display:flex; flex-direction:column; gap:2px; margin-top:6px; flex:1; overflow-y:auto;}
.nav-label{ font-size:10px; text-transform:uppercase; letter-spacing:1.4px; color:var(--text-faint); padding: 14px 12px 6px; }
.nav-item{
  display:flex; align-items:center; gap:11px;
  padding: 10px 12px; border-radius: 10px;
  color: var(--text-dim); font-size:13.5px; font-weight:500;
  background:transparent; border:none; text-align:left; width:100%;
  transition: background .15s ease, color .15s ease;
}
.nav-item svg{ width:17px; height:17px; flex-shrink:0; opacity:.85;}
.nav-item:hover{ background: rgba(255,255,255,0.04); color: var(--text); }
.nav-item.active{ background: linear-gradient(90deg, rgba(64,145,108,0.24), rgba(64,145,108,0.05)); color: var(--beige); box-shadow: inset 2px 0 0 var(--green-400); }
.sidebar-foot{ padding: 10px 12px; border-top:1px solid var(--border-soft); margin-top:8px; }
.sidebar-foot .biz{ font-size:11.5px; color:var(--text-faint); line-height:1.5; }

.main{ flex:1; min-width:0; padding: 26px 30px 60px; max-width: 1400px; }
.topbar{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:22px; }
.page-title{ font-family: var(--font-display); font-weight:700; font-size: 24px; color: var(--beige); letter-spacing:.2px;}
.page-sub{ color: var(--text-dim); font-size:13px; margin-top:4px; }

.btn{
  display:inline-flex; align-items:center; gap:8px;
  padding: 10px 16px; border-radius: 10px; border:1px solid var(--border);
  background: var(--surface); color: var(--text); font-size:13.5px; font-weight:600;
  transition: all .15s ease;
}
.btn:hover{ border-color: var(--green-500); background: var(--surface-2); }
.btn-primary{ background: linear-gradient(135deg, var(--green-500), var(--green-700)); border-color: transparent; color:#f2fff7; box-shadow: 0 6px 18px -8px rgba(64,145,108,0.6);}
.btn-primary:hover{ filter: brightness(1.08); }
.btn-gold{ background: linear-gradient(135deg, var(--gold), var(--gold-dim)); border-color:transparent; color:#241b06; }
.btn-ghost{ background:transparent; border-color: var(--border); }
.btn-danger{ background: transparent; border-color: var(--red-dim); color:#e8a9ac; }
.btn-danger:hover{ background: rgba(193,102,107,0.12); }
.btn-sm{ padding:7px 11px; font-size:12.5px; border-radius:8px; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.btn svg{ width:15px; height:15px; flex-shrink:0; }
.icon-btn svg{ width:13px; height:13px; }

/* ---------- Period filter ---------- */
.period-bar{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
.chip{
  padding: 7px 13px; border-radius: 999px; font-size:12.5px; font-weight:600;
  background: var(--surface); border:1px solid var(--border); color: var(--text-dim);
}
.chip.active{ background: rgba(64,145,108,0.18); border-color: var(--green-500); color: var(--beige); }
.period-custom{ display:flex; align-items:center; gap:6px; }
.period-custom input[type=date]{ background: var(--surface); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:6px 8px; font-size:12.5px; }

/* ---------- Cards ---------- */
.grid{ display:grid; gap:16px; }
.grid-4{ grid-template-columns: repeat(4, 1fr); }
.grid-3{ grid-template-columns: repeat(3, 1fr); }
.grid-2{ grid-template-columns: repeat(2, 1fr); }
@media (max-width: 1180px){ .grid-4{ grid-template-columns: repeat(2,1fr);} .grid-3{grid-template-columns: repeat(2,1fr);} }
@media (max-width: 720px){ .grid-4,.grid-3,.grid-2{ grid-template-columns: 1fr;} }

.card{
  background: linear-gradient(160deg, var(--surface), var(--bg-soft));
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  padding: 18px 18px;
  box-shadow: var(--shadow);
  position:relative;
  overflow:hidden;
}
.stat-card{ display:flex; flex-direction:column; gap:10px; }
.stat-top{ display:flex; align-items:center; justify-content:space-between; }
.stat-label{ font-size:11.5px; text-transform:uppercase; letter-spacing:1.2px; color: var(--text-faint); font-weight:600;}
.stat-icon{ width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; }
.stat-icon svg{ width:16px; height:16px; }
.stat-value{ font-family: var(--font-mono); font-size: 25px; font-weight:600; color: var(--beige); letter-spacing:-0.3px;}
.stat-foot{ font-size:11.5px; color: var(--text-faint); display:flex; align-items:center; gap:6px;}
.trend-up{ color: var(--green-400); }
.trend-down{ color: var(--red); }

.ic-revenue{ background: rgba(64,145,108,0.16); color: var(--green-400);}
.ic-cost{ background: rgba(211,168,76,0.14); color: var(--gold);}
.ic-profit{ background: rgba(82,183,136,0.18); color:#7fe0ab;}
.ic-margin{ background: rgba(233,226,207,0.10); color: var(--beige);}
.ic-pending{ background: rgba(193,102,107,0.14); color:#e8a9ac;}
.ic-clients{ background: rgba(64,145,108,0.12); color: var(--green-400);}
.ic-orders{ background: rgba(211,168,76,0.12); color: var(--gold);}

.section-title{ font-family: var(--font-display); font-weight:600; font-size:15.5px; color: var(--beige); margin: 30px 0 14px; display:flex; align-items:center; justify-content:space-between;}
.section-title .hint{ font-size:11.5px; color:var(--text-faint); font-weight:400; font-family:var(--font-body);}

/* ---------- Funnel (signature element) ---------- */
.funnel-wrap{ display:flex; gap:22px; align-items:stretch; flex-wrap:wrap; }
.funnel-col{ flex:1; min-width:260px; }
.funnel-row{ display:flex; align-items:center; gap:14px; padding: 11px 0; border-bottom: 1px dashed var(--border-soft); }
.funnel-row:last-child{ border-bottom:none; }
.funnel-label{ width:120px; flex-shrink:0; font-size:12px; color: var(--text-dim); font-weight:600; text-transform:uppercase; letter-spacing:.6px;}
.funnel-bar-track{ flex:1; height:12px; background: rgba(255,255,255,0.04); border-radius:6px; overflow:hidden; position:relative;}
.funnel-bar-fill{ height:100%; border-radius:6px; transition: width .4s ease; }
.funnel-value{ width:118px; text-align:right; font-family: var(--font-mono); font-size:13.5px; font-weight:600; color: var(--beige); flex-shrink:0;}
.funnel-arrow{ text-align:center; color: var(--text-faint); font-size:11px; padding: 2px 0 2px 134px; }

/* ---------- Tables ---------- */
.table-wrap{ overflow-x:auto; border-radius: var(--radius); border:1px solid var(--border-soft); }
table{ width:100%; border-collapse:collapse; font-size:13px; min-width:600px; }
thead th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:1px; color: var(--text-faint); padding:12px 14px; background: var(--bg-soft); border-bottom:1px solid var(--border-soft); white-space:nowrap;}
tbody td{ padding:12px 14px; border-bottom:1px solid var(--border-soft); color: var(--text); vertical-align:middle;}
tbody tr{ background: var(--surface); transition: background .12s ease; }
tbody tr:hover{ background: var(--surface-2); cursor:pointer; }
tbody tr:last-child td{ border-bottom:none; }
.td-num{ font-family: var(--font-mono); text-align:right; }
.td-actions{ text-align:right; white-space:nowrap; }
.empty-row td{ text-align:center; color: var(--text-faint); padding: 30px; cursor:default; }
.empty-row:hover{ background:var(--surface); }

.badge{ display:inline-flex; align-items:center; gap:5px; padding:4px 9px; border-radius:999px; font-size:11px; font-weight:600; white-space:nowrap;}
.badge-green{ background: rgba(82,183,136,0.16); color:#7fe0ab; }
.badge-gold{ background: rgba(211,168,76,0.16); color: var(--gold); }
.badge-red{ background: rgba(193,102,107,0.18); color:#f0aeb1; }
.badge-gray{ background: rgba(255,255,255,0.06); color: var(--text-dim); }
.badge-dot{ width:6px; height:6px; border-radius:50%; background:currentColor; }

/* ---------- Charts ---------- */
.chart-card{ padding:18px; }
.chart-card canvas{ max-height:260px; }

/* ---------- Client detail / list rows ---------- */
.client-row-name{ font-weight:600; color: var(--beige); }
.client-row-sub{ font-size:11.5px; color: var(--text-faint); margin-top:2px;}
.rank-list{ display:flex; flex-direction:column; gap:10px; }
.rank-item{ display:flex; align-items:center; gap:12px; }
.rank-num{ width:22px; height:22px; border-radius:6px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:var(--gold); font-family:var(--font-mono); flex-shrink:0;}
.rank-name{ flex:1; font-size:13px; font-weight:600; color:var(--text); }
.rank-sub{ font-size:11px; color:var(--text-faint); }
.rank-value{ font-family:var(--font-mono); font-size:13px; color: var(--green-400); font-weight:600; }
.rank-bar-track{ height:5px; background:rgba(255,255,255,0.05); border-radius:4px; margin-top:5px; overflow:hidden;}
.rank-bar-fill{ height:100%; background: linear-gradient(90deg, var(--green-500), var(--gold)); border-radius:4px;}

/* ---------- Alerts ---------- */
.alert-item{ display:flex; gap:10px; align-items:flex-start; padding:11px 0; border-bottom:1px solid var(--border-soft); }
.alert-item:last-child{ border-bottom:none; }
.alert-icon{ width:26px; height:26px; border-radius:8px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
.alert-icon svg{ width:14px; height:14px; }
.alert-text{ font-size:12.5px; color: var(--text); line-height:1.4; }
.alert-text b{ color: var(--beige); }

/* ---------- Toolbar / search ---------- */
.toolbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
.search-box{ position:relative; }
.search-box input{ background: var(--surface); border:1px solid var(--border); border-radius:10px; padding:9px 12px 9px 34px; color:var(--text); font-size:13px; width:240px; }
.search-box svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--text-faint); }
.toolbar-right{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }

/* ---------- Modal ---------- */
.modal-overlay{ position:fixed; inset:0; background: rgba(6,10,8,0.7); backdrop-filter: blur(3px); display:none; align-items:flex-start; justify-content:center; z-index:100; padding: 40px 16px; overflow-y:auto;}
.modal-overlay.open{ display:flex; }
.modal{ background: linear-gradient(165deg, var(--surface), var(--bg-soft)); border:1px solid var(--border-soft); border-radius: var(--radius); width:100%; max-width:640px; box-shadow: 0 30px 70px -20px rgba(0,0,0,0.7); animation: modalIn .18s ease; }
@keyframes modalIn{ from{ opacity:0; transform: translateY(10px) scale(.98);} to{ opacity:1; transform:none;} }
.modal-head{ display:flex; align-items:center; justify-content:space-between; padding: 18px 22px; border-bottom:1px solid var(--border-soft); }
.modal-title{ font-family:var(--font-display); font-weight:600; font-size:16px; color:var(--beige); }
.modal-close{ background:transparent; border:none; color:var(--text-faint); width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center;}
.modal-close:hover{ background: var(--surface-2); color:var(--text); }
.modal-body{ padding: 20px 22px; max-height: 68vh; overflow-y:auto; }
.modal-foot{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding: 16px 22px; border-top:1px solid var(--border-soft); }

.field{ margin-bottom:14px; }
.field label{ display:block; font-size:11.5px; font-weight:600; color: var(--text-dim); margin-bottom:6px; text-transform:uppercase; letter-spacing:.5px;}
.field input, .field select, .field textarea{
  width:100%; background: var(--bg-soft); border:1px solid var(--border); border-radius:9px;
  padding:10px 11px; color: var(--text); font-size:13.5px;
}
.field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color: var(--green-500); }
.field textarea{ resize:vertical; min-height:60px; }
.field-row{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
.field-hint{ font-size:11px; color:var(--text-faint); margin-top:4px; }
.checkbox-row{ display:flex; align-items:center; gap:8px; }
.checkbox-row input{ width:auto; accent-color: var(--green-500); }

/* ---------- Ciclos mensais ---------- */
.cycle-card{ margin-bottom:16px; overflow:visible; }
.cycle-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
.cycle-title{ font-family: var(--font-display); font-weight:600; font-size:16px; color: var(--beige); display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.cycle-actions{ display:flex; gap:8px; flex-wrap:wrap; }
.cycle-stats{ display:grid; grid-template-columns: repeat(4, 1fr); gap:10px; margin-bottom:14px; }
.cycle-stat{ background: var(--bg-soft); border:1px solid var(--border-soft); border-radius:11px; padding:10px 12px; }
.cycle-stat .v{ font-family: var(--font-mono); font-size:16px; font-weight:600; color: var(--beige); margin-top:4px; font-variant-numeric: tabular-nums; }
.cycle-part{ display:grid; grid-template-columns: 64px 92px 1fr 110px 110px; gap:10px; align-items:center; padding:10px 6px; border-bottom:1px solid var(--border-soft); font-size:12.5px; cursor:pointer; border-radius:6px; transition: background .15s; }
.cycle-part:last-child{ border-bottom:none; }
.cycle-part:hover{ background: rgba(255,255,255,0.03); }
.cycle-part.missing{ cursor:default; color: var(--text-faint); }
.cycle-part.missing:hover{ background:none; }
.cycle-part.missing > div:last-child{ grid-column: span 2; text-align:right; }
.cycle-part .num{ font-family: var(--font-mono); text-align:right; font-variant-numeric: tabular-nums; }
.cycle-compare{ margin-top:12px; padding:10px 12px; border-radius:10px; background: rgba(233,226,207,0.05); border:1px dashed var(--border); font-size:12.5px; color: var(--text-dim); display:flex; gap:8px 18px; flex-wrap:wrap; align-items:baseline; }
.cycle-compare b{ font-family: var(--font-mono); font-weight:600; }
.cycle-warn{ margin-top:10px; font-size:12px; color: var(--gold); display:flex; gap:6px; align-items:center; }
.cycle-warn svg{ width:14px; height:14px; flex-shrink:0; }
.attach-list{ max-height:220px; overflow:auto; border:1px solid var(--border-soft); border-radius:10px; padding:2px 12px; background: var(--bg-soft); }
.attach-list label{ display:flex; gap:10px; align-items:center; padding:9px 0; border-bottom:1px solid var(--border-soft); font-size:12.5px; text-transform:none; letter-spacing:0; color: var(--text); cursor:pointer; margin:0; font-weight:400; }
.attach-list label:last-child{ border-bottom:none; }
.attach-list input{ width:auto; accent-color: var(--green-500); }
@media (max-width: 720px){
  .cycle-stats{ grid-template-columns: repeat(2, 1fr); }
  .cycle-part{ grid-template-columns: 52px 1fr 92px 92px; }
  .cycle-part .hide-sm{ display:none; }
  .cycle-part.missing{ grid-template-columns: 52px 1fr auto; }
  .cycle-part.missing > div:last-child{ grid-column:auto; }
}
.subblock{ background: var(--bg-soft); border:1px solid var(--border-soft); border-radius:11px; padding:14px; margin-bottom:14px; }
.subblock-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.subblock-title{ font-size:12.5px; font-weight:700; color:var(--beige); }
.mini-row{ display:flex; gap:8px; align-items:center; padding:8px 0; border-bottom:1px solid var(--border-soft); font-size:12.5px; }
.mini-row:last-child{ border-bottom:none; }
.mini-row .mr-cat{ font-weight:600; color:var(--text); width:110px; flex-shrink:0;}
.mini-row .mr-desc{ flex:1; color:var(--text-dim); }
.mini-row .mr-val{ font-family:var(--font-mono); color:var(--gold); width:90px; text-align:right; flex-shrink:0;}
.mini-row .mr-del{ flex-shrink:0; }
.icon-btn{ width:24px; height:24px; border-radius:7px; border:1px solid var(--border); background:var(--surface); display:flex; align-items:center; justify-content:center; color:var(--text-faint); flex-shrink:0;}
.icon-btn:hover{ color:var(--red); border-color:var(--red-dim); }
.add-row-form{ display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
.add-row-form select, .add-row-form input{ background:var(--surface); border:1px solid var(--border); border-radius:7px; padding:7px 8px; color:var(--text); font-size:12px; }
.add-row-form .f-cat{ width:112px; } .add-row-form .f-desc{ flex:1; min-width:110px;} .add-row-form .f-val{ width:90px; }
.totals-mini{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--text-dim); padding-top:8px; margin-top:4px; border-top:1px solid var(--border); }
.totals-mini b{ color:var(--beige); font-family:var(--font-mono); }

.file-drop{ border:1.5px dashed var(--border); border-radius:9px; padding:12px; text-align:center; font-size:12px; color:var(--text-faint); cursor:pointer; }
.file-drop:hover{ border-color: var(--green-500); color:var(--text-dim); }
.receipt-thumb{ width:38px; height:38px; border-radius:6px; object-fit:cover; border:1px solid var(--border); flex-shrink:0;}

/* ---------- Calculator ---------- */
.calc-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:22px; align-items:start; }
@media (max-width: 900px){ .calc-grid{ grid-template-columns:1fr; } }
.calc-result-card{ position:sticky; top:26px; }

function emptyDB(){
  return { clients:[], orders:[], purchases:[], expenses:[], products:[], stockMoves:[], suppliers:[], baskets:[], cycles:[], settings:{}, schemaVersion: SCHEMA_VERSION };
}

// Completa campos que versões anteriores não tinham. Nunca remove nada.
function migrateDB(db){
  if(!db || typeof db !== 'object' || Array.isArray(db)) db = emptyDB();
  ['clients','orders','purchases','expenses','products','stockMoves','baskets','cycles'].forEach(k=>{ if(!Array.isArray(db[k])) db[k] = []; });
  if(!db.settings || typeof db.settings !== 'object') db.settings = {};
  if(!Array.isArray(db.settings.costCategories)) db.settings.costCategories = defaultCostCategories();
  if(!Array.isArray(db.settings.expenseCategories)) db.settings.expenseCategories = defaultExpenseCategories();
  if(!Array.isArray(db.settings.productCategories)) db.settings.productCategories = defaultProductCategories();
  db.orders.forEach(o=>{ if(!Array.isArray(o.costs)) o.costs = []; if(!Array.isArray(o.payments)) o.payments = []; if(!Array.isArray(o.baskets)) o.baskets = []; });
  db.purchases.forEach(p=>{ if(!Array.isArray(p.items)) p.items = []; });
  if(!Array.isArray(db.suppliers)){
    // v1 guardava o fornecedor só como texto na compra: cria o cadastro a partir desses nomes
    db.suppliers = [];
    db.purchases.forEach(p=>{
      const name = (p.supplier||'').trim();
      if(!name) return;
      let sup = db.suppliers.find(x=> x.name.toLowerCase() === name.toLowerCase());
      if(!sup){ sup = newSupplierRecord(name, p.date); db.suppliers.push(sup); }
      p.supplierId = sup.id;
    });
  }
  db.schemaVersion = SCHEMA_VERSION;
  return db;
}

function newSupplierRecord(name, date){
  return { id: uid(), name, doc:'', phone:'', contact:'', city:'', notes:'', createdAt: date || todayISO() };
}

function writeStorage(db){
  localStorage.setItem(DB_KEY, JSON.stringify(db));
}

function loadDB(){
  let raw = null;
  try{ raw = localStorage.getItem(DB_KEY); }
  catch(e){
    loadWarning = 'Este navegador está bloqueando o armazenamento local (modo anônimo ou dados de site bloqueados). O que você cadastrar agora não ficará salvo.';
    return migrateDB(seedData());
  }
  if(!raw){
    const seed = migrateDB(seedData());
    try{ writeStorage(seed); }catch(e){ loadWarning = 'Não foi possível salvar no navegador.'; }
    return seed;
  }
  try{
    const parsed = JSON.parse(raw);
    if(!parsed || typeof parsed !== 'object') throw new Error('formato inválido');
    return migrateDB(parsed);
  }catch(e){
    // Não sobrescreve o que estava salvo sem guardar uma cópia antes.
    console.error('Erro ao carregar dados.', e);
    const backupKey = DB_KEY + '_ilegivel_' + Date.now();
    try{ localStorage.setItem(backupKey, raw); }catch(_){}
    loadWarning = 'Os dados salvos estavam ilegíveis. Uma cópia foi guardada no navegador ("' + backupKey + '") e o sistema começou vazio. Se tiver um backup .json, importe em Configurações.';
    const fresh = migrateDB(emptyDB());
    try{ writeStorage(fresh); }catch(_){}
    return fresh;
  }
}
function saveDB(){
  try{ writeStorage(DB); return true; }
  catch(e){
    console.error(e);
    toast('Não foi possível salvar: o armazenamento do navegador está cheio ou bloqueado. Exporte um backup agora.', 'error');
    return false;
  }
}

  return n.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
}
function fmtPct(n){ if(!isFinite(n)) n = 0; return n.toLocaleString('pt-BR',{minimumFractionDigits:1, maximumFractionDigits:1}) + '%'; }
function fmtQty(n){ n = Number(n)||0; return n.toLocaleString('pt-BR',{maximumFractionDigits:3}); }
function fmtDate(d){ if(!d) return '—'; const dt = new Date(d+'T00:00:00'); if(isNaN(dt)) return d; return dt.toLocaleDateString('pt-BR'); }
// Data local (toISOString usa UTC e vira o dia depois das 21h em Brasília)
function isoLocal(dt){ const p = n=> String(n).padStart(2,'0'); return `${dt.getFullYear()}-${p(dt.getMonth()+1)}-${p(dt.getDate())}`; }
function todayISO(){ return isoLocal(new Date()); }
function round2(n){ return Math.round((Number(n)||0)*100)/100; }
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function toast(msg, kind){
  const root = document.getElementById('toastRoot');
  const el = document.createElement('div');
  el.className = 'toast' + (kind==='error' ? ' toast-error' : '');
  el.setAttribute('role', kind==='error' ? 'alert' : 'status');
  el.innerHTML = `${ic(kind==='error'?'alert':'check','')} <span>${escapeHtml(msg)}</span>`;
  root.innerHTML = '';
  root.appendChild(el);
  setTimeout(()=>{ el.remove(); }, kind==='error' ? 6000 : 2600);
}

/* ---------- Cálculos financeiros (fonte única de verdade) ---------- */
function orderCostRowsTotal(order){ return (order.costs||[]).reduce((s,c)=> s + (Number(c.value)||0), 0); }
// Cestas do catálogo guardam o custo do dia em que foram lançadas (unitCost), para o lucro histórico não mudar
function orderBasketsCost(order){ return (order.baskets||[]).reduce((s,b)=> s + (Number(b.qty)||0)*(Number(b.unitCost)||0), 0); }
function orderBasketsPrice(order){ return (order.baskets||[]).reduce((s,b)=> s + (Number(b.qty)||0)*(Number(b.unitPrice)||0), 0); }
function orderTotalCost(order){ return orderCostRowsTotal(order) + orderBasketsCost(order); }
function orderGrossProfit(order){ return (Number(order.saleValue)||0) - orderTotalCost(order); }
function orderMargin(order){ const rev = Number(order.saleValue)||0; if(rev<=0) return 0; return (orderGrossProfit(order)/rev)*100; }
function orderPaid(order){ return (order.payments||[]).reduce((s,p)=> s + (Number(p.value)||0), 0); }
function orderBalance(order){ return (Number(order.saleValue)||0) - orderPaid(order); }
function orderPaymentStatus(order){
  const bal = orderBalance(order), paid = orderPaid(order);
  if(paid <= 0) return order.overdue ? 'Em atraso' : 'Não pago';
  if(bal > 0.005) return order.overdue ? 'Em atraso' : 'Parcial';
  return 'Pago';
}
function costsByCategory(order){
  const map = {};
  (order.costs||[]).forEach(c=>{ map[c.category] = (map[c.category]||0) + (Number(c.value)||0); });
  const bc = orderBasketsCost(order);
  if(bc > 0) map['Compras'] = (map['Compras']||0) + bc;
  return map;
}

function ordersInRange(start, end){
  return DB.orders.filter(o=> o.date >= start && o.date <= end);
}

function expensesInRange(start, end){
  return DB.expenses.filter(e=> e.date >= start && e.date <= end);
}
function expensesTotal(expenses){
  return expenses.reduce((s,e)=> s + (Number(e.value)||0), 0);
}

function periodTotals(orders){
  const revenue = orders.reduce((s,o)=> s + (Number(o.saleValue)||0), 0);
  const cost = orders.reduce((s,o)=> s + orderTotalCost(o), 0);
  const profit = revenue - cost;
  const margin = revenue>0 ? (profit/revenue)*100 : 0;
  const pending = orders.reduce((s,o)=> s + Math.max(0, orderBalance(o)), 0);
  return { revenue, cost, profit, margin, pending, count: orders.length };
}

function clientName(id){ const c = DB.clients.find(x=>x.id===id); return c ? c.name : 'Cliente removido'; }

/* ---------- Ciclos mensais (valor fechado por mês, compras lançadas em partes) ---------- */
function cycleOrders(cycle){
  return DB.orders.filter(o=> o.cycleId===cycle.id)
    .sort((a,b)=> (a.cyclePart||99)-(b.cyclePart||99) || a.date.localeCompare(b.date));
}
function cycleRefDate(cycle){
  const ds = cycleOrders(cycle).map(o=>o.date).sort();
  return ds[0] || cycle.createdAt || '';
}
function cycleTotals(cycle){
  const orders = cycleOrders(cycle);
  const t = periodTotals(orders);
  const paid = orders.reduce((s,o)=> s + orderPaid(o), 0);
  return { ...t, orders, paid, monthly: Number(cycle.monthlyValue)||0, balance: Math.max(0, round2(t.revenue - paid)) };
}
function cyclesOfClient(clientId){
  return DB.cycles.filter(c=> c.clientId===clientId).sort((a,b)=> cycleRefDate(a).localeCompare(cycleRefDate(b)));
}
function previousCycle(cycle){
  const list = cyclesOfClient(cycle.clientId);
  const i = list.findIndex(c=> c.id===cycle.id);
  return i>0 ? list[i-1] : null;
}
function cycleStatus(t){
  if(t.orders.length===0 || t.revenue<=0) return 'Sem partes';
  if(t.paid<=0.005) return 'Não pago';
  if(t.balance>0.005) return 'Parcial';
  return 'Pago';
}
function cycleLabel(id){ const c = DB.cycles.find(x=>x.id===id); return c ? c.name : ''; }
const MONTHS_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function defaultCycleName(){ const d = new Date(); return MONTHS_PT[d.getMonth()] + '/' + d.getFullYear(); }

/* ---------- Estoque, fornecedores e cestas ---------- */
function productById(id){ return DB.products.find(p=>p.id===id); }
function productName(id){ const p = productById(id); return p ? p.name : 'Produto removido'; }
function supplierById(id){ return DB.suppliers.find(s=>s.id===id); }
function supplierByName(name){ const n = (name||'').trim().toLowerCase(); return n ? DB.suppliers.find(s=> s.name.trim().toLowerCase()===n) : null; }
// entrada soma, saída subtrai, ajuste já vem com sinal (diferença da contagem)
function moveSigned(m){ const q = Number(m.qty)||0; return m.type==='saida' ? -q : q; }
function stockMap(excludeRef){
  const map = {};
  DB.stockMoves.forEach(m=>{
    if(excludeRef && m.refKind===excludeRef.kind && m.refId===excludeRef.id) return;
    map[m.productId] = (map[m.productId]||0) + moveSigned(m);
  });
  return map;
}
function productStock(id){ return stockMap()[id] || 0; }
function stockStatus(p, qty){
  if(qty <= 0) return 'zerado';
  if((Number(p.minStock)||0) > 0 && qty < Number(p.minStock)) return 'baixo';
  return 'ok';
}
function lowStockProducts(){
  const map = stockMap();
  return DB.products.filter(p=> (Number(p.minStock)||0) > 0 && (map[p.id]||0) < Number(p.minStock));
}
// Substitui todas as movimentações geradas por um registro (compra ou pedido)
function setMovesForRef(kind, refId, moves){
  DB.stockMoves = DB.stockMoves.filter(m=> !(m.refKind===kind && m.refId===refId));
  moves.forEach(m=> DB.stockMoves.push({ id: uid(), refKind: kind, refId, ...m }));
}
function basketUnitCost(b){ return (b.items||[]).reduce((s,it)=>{ const p = productById(it.productId); return s + (Number(it.qty)||0) * (p ? Number(p.cost)||0 : 0); }, 0); }
function basketMissingCost(b){ return (b.items||[]).filter(it=>{ const p = productById(it.productId); return !p || !(Number(p.cost)>0); }); }
// Quantas cestas dá para montar com o estoque atual
function basketsFromStock(b, map){
  map = map || stockMap();
  if(!(b.items||[]).length) return 0;
  return Math.max(0, Math.min(...b.items.map(it=> (Number(it.qty)||0) > 0 ? Math.floor((map[it.productId]||0) / Number(it.qty)) : Infinity)));
}
function supplierPurchases(id){ return DB.purchases.filter(p=> p.supplierId===id); }

/* ---------- Estado ---------- */
const state = {
  view: 'dashboard',
  periodType: 'month', // today, week, month, lastmonth, last30, year, custom
  customStart: null,
  customEnd: null,
  clientDetailId: null,
  searchClients: '',
  searchOrders: '',
  searchPurchases: '',
  searchExpenses: '',
  searchProducts: '',
  searchSuppliers: '',
  stockOnlyLow: false,
  cycleClientFilter: '',
  sidebarOpen: false,
};

function getPeriodRange(){
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
  const iso = isoLocal;
  switch(state.periodType){
    case 'today': { const t = iso(now); return [t,t]; }
    case 'week': {
      const day = now.getDay() === 0 ? 7 : now.getDay();
      const start = new Date(now); start.setDate(d - day + 1);
      return [iso(start), iso(now)];
    }
    case 'month': return [iso(new Date(y,m,1)), iso(new Date(y,m+1,0))];
    case 'lastmonth': return [iso(new Date(y,m-1,1)), iso(new Date(y,m,0))];
    case 'last30': { const start = new Date(now); start.setDate(d-29); return [iso(start), iso(now)]; }
    case 'year': return [iso(new Date(y,0,1)), iso(new Date(y,11,31))];
    case 'custom': return [state.customStart || iso(new Date(y,m,1)), state.customEnd || iso(now)];
    default: return [iso(new Date(y,m,1)), iso(new Date(y,m+1,0))];
  }
}
</script>

<script>
/* ---------- Navegação / Shell ---------- */
const NAV_ITEMS = [
  {id:'dashboard', label:'Dashboard', icon:'dashboard'},
  {id:'clients', label:'Clientes', icon:'clients'},
  {id:'orders', label:'Pedidos / Serviços', icon:'orders'},
  {id:'cycles', label:'Ciclos mensais', icon:'calendar'},
  {id:'purchases', label:'Compras', icon:'purchases'},
  {id:'expenses', label:'Despesas', icon:'expenses'},
  {id:'stock', label:'Estoque', icon:'box'},
  {id:'baskets', label:'Cestas', icon:'basket'},
  {id:'suppliers', label:'Fornecedores', icon:'truck'},
  {id:'calculator', label:'Calculadora', icon:'calc'},
  {id:'settings', label:'Configurações', icon:'settings'},
];

function navigateTo(view, extra){

}

function appShell(){
  return `
  <div class="sidebar-scrim ${state.sidebarOpen?'open':''}" onclick="state.sidebarOpen=false; render();"></div>
  <aside class="sidebar ${state.sidebarOpen?'open':''}">
    <div class="brand">
      <div class="brand-mark">A</div>
      <div class="brand-text">
        <div class="t1">ABA Gestão</div>
        <div class="t2">Controle Financeiro</div>
      </div>
    </div>
    <nav class="nav">
      <div class="nav-label">Visão geral</div>
      ${navBtn('dashboard')}
      <div class="nav-label">Operação</div>
      ${navBtn('clients')}
      ${navBtn('orders')}
      ${navBtn('cycles')}
      ${navBtn('purchases')}
      ${navBtn('expenses')}
      <div class="nav-label">Produtos</div>
      ${navBtn('stock')}
      ${navBtn('baskets')}
      ${navBtn('suppliers')}
      <div class="nav-label">Ferramentas</div>
      ${navBtn('calculator')}
      ${navBtn('settings')}
    </nav>
    <div class="sidebar-foot">
      <div class="biz">ABA Alimentos e Distribuição<br>Gama · Brasília/DF</div>
    </div>
  </aside>
  <main class="main">
    <div class="mobile-topbar">
      <button aria-label="Abrir menu" onclick="state.sidebarOpen=true; render();">${ic('menu')}</button>
      <div class="brand-text"><div class="t1" style="font-size:14px">ABA Gestão</div></div>
    </div>
    <div id="viewRoot"></div>
  </main>`;
}
function navBtn(id){
  const item = NAV_ITEMS.find(n=>n.id===id);
  const active = state.view===id || (id==='clients' && state.view==='client-detail');
  return `<button class="nav-item ${active?'active':''}" onclick="navigateTo('${id}')">${ic(item.icon)}<span>${item.label}</span></button>`;
}

function render(){
  // Guarda o foco para a busca não perder o cursor a cada letra digitada
  const ae = document.activeElement;
  const focusId = ae && ae.id && ae.tagName==='INPUT' && ae.closest('#app') ? ae.id : null;
  const caret = focusId ? ae.selectionStart : null;
  const app = document.getElementById('app');
  app.innerHTML = appShell();
  const root = document.getElementById('viewRoot');
  if(state.view==='dashboard') root.innerHTML = renderDashboard();
  else if(state.view==='clients') root.innerHTML = renderClients();
  else if(state.view==='client-detail') root.innerHTML = renderClientDetail();
  else if(state.view==='orders') root.innerHTML = renderOrders();
  else if(state.view==='cycles') root.innerHTML = renderCycles();
  else if(state.view==='purchases') root.innerHTML = renderPurchases();
  else if(state.view==='expenses') root.innerHTML = renderExpenses();
  else if(state.view==='calculator') root.innerHTML = renderCalculator();
  else if(state.view==='settings') root.innerHTML = renderSettings();
  else if(state.view==='stock') root.innerHTML = renderStock();
  else if(state.view==='baskets') root.innerHTML = renderBaskets();
  else if(state.view==='suppliers') root.innerHTML = renderSuppliers();
  afterRender();
  if(focusId){
    const el = document.getElementById(focusId);
    if(el){ el.focus(); try{ el.setSelectionRange(caret, caret); }catch(_){} }
  }
}

/* ---------- Filtro de período (componente reutilizável) ---------- */
function periodBar(){
  const options = [
    ['today','Hoje'],['week','Esta semana'],['month','Este mês'],['lastmonth','Mês anterior'],
    ['last30','Últimos 30 dias'],['year','Este ano'],['custom','Personalizado']
  ];
  const chips = options.map(([k,label])=> `<button class="chip ${state.periodType===k?'active':''}" onclick="state.periodType='${k}'; render();">${label}</button>`).join('');
  const [start,end] = getPeriodRange();
  const custom = state.periodType==='custom' ? `
    <div class="period-custom">
      <input type="date" value="${state.customStart||start}" onchange="state.customStart=this.value; render();">
      <span style="color:var(--text-faint); font-size:12px;">até</span>
      <input type="date" value="${state.customEnd||end}" onchange="state.customEnd=this.value; render();">
    </div>` : '';
  return `<div class="period-bar">${chips}${custom}</div>`;
}

/* ============================================================
   DASHBOARD
   ============================================================ */
let charts = {}; // instâncias Chart.js ativas

function renderDashboard(){
  const [start,end] = getPeriodRange();
  const orders = ordersInRange(start,end);
  const t = periodTotals(orders);
  const despesas = expensesTotal(expensesInRange(start,end));
  const activeClients = DB.clients.filter(c=>c.status==='ativo').length;

  const lowMarginOrders = orders.filter(o=> orderMargin(o) < 15 && (Number(o.saleValue)||0) > 0);
  const pendingOrders = orders.filter(o=> orderBalance(o) > 0.005);
  const overdueOrders = orders.filter(o=> o.overdue && orderBalance(o) > 0.005);
  const lowStock = lowStockProducts();

  return `
    <div class="topbar">
      <div>
        <div class="page-title">Dashboard</div>
        <div class="page-sub">Visão financeira da ABA no período selecionado</div>
      </div>
      <button class="btn btn-primary" onclick="openOrderModal()">${ic('plus')} Novo pedido</button>
    </div>
    ${periodBar()}

    <div class="grid grid-4">
      ${statCard('Receita', fmtBRL(t.revenue), 'revenue', `${t.count} pedido(s) no período`)}
      ${statCard('Custos', fmtBRL(t.cost), 'cost', 'Compras + frete + gasolina + entrega + outros')}
      ${statCard('Lucro bruto', fmtBRL(t.profit), 'profit', t.profit>=0 ? 'Resultado positivo' : 'Resultado negativo')}
      ${statCard('Margem', fmtPct(t.margin), 'margin', 'Lucro bruto / receita')}
    </div>
    <div class="grid grid-4" style="margin-top:16px;">
      ${statCard('A receber', fmtBRL(t.pending), 'pending', pendingOrders.length + ' pedido(s) com saldo em aberto')}
      ${statCard('Clientes ativos', activeClients, 'clients', DB.clients.length + ' cadastrado(s) no total')}
      ${statCard('Pedidos / serviços', t.count, 'orders', 'No período selecionado')}
      ${statCard('Despesas', fmtBRL(despesas), 'expenses', 'Embalagens, fitas, impressões e outras')}
    </div>

    <div class="section-title">Da receita ao lucro <span class="hint">quanto realmente sobrou para a ABA</span></div>
    <div class="card">
      ${renderFunnel(t, despesas)}
    </div>

    <div class="grid grid-2" style="margin-top:26px; align-items:start;">
      <div class="card chart-card">
        <div class="section-title" style="margin:0 0 10px;">Receita × Custos × Lucro <span class="hint">últimos 6 meses</span></div>
        <canvas id="chartRevenue"></canvas>
      </div>
      <div class="card chart-card">
        <div class="section-title" style="margin:0 0 10px;">Custos por categoria <span class="hint">no período</span></div>
        <canvas id="chartCosts"></canvas>
      </div>
    </div>

    <div class="grid grid-2" style="margin-top:20px; align-items:start;">
      <div class="card">
        <div class="section-title" style="margin:0 0 12px;">Clientes mais lucrativos</div>
        ${renderTopClients(orders)}
      </div>
      <div class="card">
        <div class="section-title" style="margin:0 0 6px;">Alertas financeiros</div>
        ${renderAlerts(lowMarginOrders, pendingOrders, overdueOrders, lowStock)}
      </div>
    </div>

    <div class="grid grid-2" style="margin-top:20px; align-items:start;">
      <div class="card" style="padding:0;">
        <div class="section-title" style="margin:0; padding:18px 18px 0;">Últimos pedidos</div>
        ${renderMiniOrdersTable(orders.slice().sort((a,b)=> b.date.localeCompare(a.date)).slice(0,6))}
      </div>
      <div class="card" style="padding:0;">
        <div class="section-title" style="margin:0; padding:18px 18px 0;">Últimas compras</div>
        ${renderMiniPurchasesTable(DB.purchases.slice().sort((a,b)=> b.date.localeCompare(a.date)).slice(0,6))}
      </div>
    </div>
  `;
}

function statCard(label, value, kind, foot){
  const iconMap = { revenue:'orders', cost:'purchases', profit:'dashboard', margin:'calc', pending:'clock', clients:'users', orders:'box', expenses:'expenses' };
  return `<div class="card stat-card">
    <div class="stat-top">
      <div class="stat-label">${label}</div>
      <div class="stat-icon ic-${kind}">${ic(iconMap[kind]||'dashboard')}</div>
    </div>
    <div class="stat-value">${value}</div>
    <div class="stat-foot">${foot}</div>
  </div>`;
}

function renderFunnel(t, despesas){
  despesas = despesas || 0;
  const lucroLiquido = t.profit - despesas;
  const maxVal = Math.max(t.revenue, 1);
  const rows = [
    ['Receita', t.revenue, 'var(--green-500)'],
    ['Custos', t.cost, 'var(--gold)'],
    ['Lucro bruto', t.profit, t.profit>=0 ? 'var(--green-400)':'var(--red)'],
    ['Despesas', despesas, 'var(--text-faint)'],
    ['Lucro líquido', lucroLiquido, lucroLiquido>=0 ? 'var(--green-400)':'var(--red)'],
  ];
  return `<div class="funnel-wrap"><div class="funnel-col" style="flex:1 1 100%;">
    ${rows.map((r,i)=>{
      const pct = Math.min(100, Math.max(2, (Math.abs(r[1])/maxVal)*100));
      return `<div class="funnel-row">
        <div class="funnel-label">${r[0]}</div>
        <div class="funnel-bar-track"><div class="funnel-bar-fill" style="width:${pct}%; background:${r[2]};"></div></div>
        <div class="funnel-value">${fmtBRL(r[1])}</div>
      </div>${i<rows.length-1?'<div class="funnel-arrow">↓</div>':''}`;
    }).join('')}
    <div class="field-hint" style="margin-top:10px;">Despesas gerais da ABA (embalagens, fitas, impressões e outras) cadastradas em "Despesas". Ainda não inclui despesas administrativas como funcionários, sistemas ou impostos.</div>
  </div></div>`;
}

function renderTopClients(periodOrders){
  const byClient = {};
  periodOrders.forEach(o=>{
    if(!byClient[o.clientId]) byClient[o.clientId] = {revenue:0, profit:0};
    byClient[o.clientId].revenue += Number(o.saleValue)||0;
    byClient[o.clientId].profit += orderGrossProfit(o);
  });
  const arr = Object.entries(byClient).map(([id,v])=> ({id, name: clientName(id), ...v})).sort((a,b)=> b.profit-a.profit).slice(0,5);
  if(arr.length===0) return emptyState('users','Sem dados no período', 'Registre pedidos para ver o ranking de clientes.');
  const max = Math.max(...arr.map(a=>a.profit), 1);
  return `<div class="rank-list">${arr.map((a,i)=> `
    <div class="rank-item-wrap" onclick="navigateTo('client-detail','${a.id}')" style="cursor:pointer;">
      <div class="rank-item">
        <div class="rank-num">${i+1}</div>
        <div style="flex:1;">
          <div class="rank-name">${escapeHtml(a.name)}</div>
          <div class="rank-bar-track"><div class="rank-bar-fill" style="width:${Math.max(4,(a.profit/max)*100)}%"></div></div>
        </div>
        <div class="rank-value">${fmtBRL(a.profit)}</div>
      </div>
    </div>`).join('')}</div>`;
}

function renderAlerts(lowMargin, pending, overdue, lowStock){
  const items = [];
  if(lowStock && lowStock.length) items.push(['gold','box', `<b>${lowStock.length} produto(s)</b> abaixo do estoque mínimo: ${lowStock.slice(0,3).map(p=>escapeHtml(p.name)).join(', ')}${lowStock.length>3?'...':''}. <button class="inline-link" onclick="state.stockOnlyLow=true; navigateTo('stock')">Ver estoque</button>`]);
  if(overdue.length) items.push(['red','alert', `<b>${overdue.length} pedido(s) em atraso</b> com saldo pendente de recebimento.`]);
  if(pending.length) items.push(['gold','clock', `<b>${pending.length} pedido(s)</b> com valores ainda não recebidos, totalizando ${fmtBRL(pending.reduce((s,o)=>s+Math.max(0,orderBalance(o)),0))}.`]);
  if(lowMargin.length) items.push(['red','alert', `<b>${lowMargin.length} pedido(s)</b> com margem de lucro abaixo de 15%.`]);
  if(items.length===0) return emptyState('check','Tudo em ordem', 'Nenhum alerta financeiro no período selecionado.');
  return items.map(([tone,icon,text])=> `<div class="alert-item">
    <div class="alert-icon" style="background:rgba(${tone==='red'?'193,102,107':'211,168,76'},0.16); color:${tone==='red'?'#f0aeb1':'var(--gold)'};">${ic(icon)}</div>
    <div class="alert-text">${text}</div>
  </div>`).join('');
}

function renderMiniOrdersTable(orders){
  if(orders.length===0) return emptyState('orders','Nenhum pedido ainda','Cadastre o primeiro pedido para começar.', "openOrderModal()", "Novo pedido");

    ${orders.map(o=> `<tr onclick="openOrderModal('${o.id}')">

}
function renderMiniPurchasesTable(purchases){
  if(purchases.length===0) return emptyState('purchases','Nenhuma compra registrada','Registre compras para acompanhar seus custos.', "openPurchaseModal()", "Nova compra");
  return `<div class="table-wrap" style="border:none; border-radius:0;"><table><thead><tr><th>Fornecedor</th><th>Data</th><th>Comprovante</th><th class="td-num">Valor</th></tr></thead><tbody>
    ${purchases.map(p=> `<tr onclick="openPurchaseModal('${p.id}')">

      <td class="td-num">${fmtBRL(p.total)}</td>
    </tr>`).join('')}
  </tbody></table></div>`;
}

function marginBadge(margin){
  if(margin >= 25) return `<span class="badge badge-green">${fmtPct(margin)}</span>`;
  if(margin >= 15) return `<span class="badge badge-gold">${fmtPct(margin)}</span>`;
  return `<span class="badge badge-red">${fmtPct(margin)}</span>`;
}
function statusBadge(status){
  const map = { 'Pago':'badge-green', 'Parcial':'badge-gold', 'Não pago':'badge-gray', 'Em atraso':'badge-red' };
  return `<span class="badge ${map[status]||'badge-gray'}">${status}</span>`;
}

function emptyState(icon, title, sub, action, actionLabel){
  return `<div class="empty-state">
    ${ic(icon)}
    <h4>${title}</h4>
    <p>${sub}</p>
    ${action ? `<button class="btn btn-primary btn-sm" onclick="${action}">${ic('plus')} ${actionLabel}</button>` : ''}
  </div>`;
}

/* ---------- Gráficos ---------- */
function destroyCharts(){ Object.values(charts).forEach(c=> c && c.destroy()); charts = {}; }

function buildDashboardCharts(){
  destroyCharts();
  const revCanvas = document.getElementById('chartRevenue');
  const costCanvas = document.getElementById('chartCosts');
  if(!revCanvas) return;
  if(!window.Chart){
    [revCanvas, costCanvas].forEach(c=>{ if(c) c.outerHTML = '<div class="chart-off">Os gráficos precisam de internet para carregar. Os números acima continuam corretos.</div>'; });
    return;
  }

  // últimos 6 meses
  const months = [];
  const now = new Date();
  for(let i=5;i>=0;i--){ const d = new Date(now.getFullYear(), now.getMonth()-i, 1); months.push(d); }
  const labels = months.map(d=> d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','') );
  const revData=[], costData=[], profitData=[];
  months.forEach(d=>{
    const start = isoLocal(new Date(d.getFullYear(), d.getMonth(),1));
    const end = isoLocal(new Date(d.getFullYear(), d.getMonth()+1,0));
    const os = ordersInRange(start,end);
    const t = periodTotals(os);
    revData.push(t.revenue.toFixed(2)); costData.push(t.cost.toFixed(2)); profitData.push(t.profit.toFixed(2));
  });

  const gridColor = 'rgba(255,255,255,0.05)';
  const textColor = '#9aa89e';
  charts.revenue = new Chart(revCanvas, {
    type:'bar',
    data:{ labels, datasets:[
      {label:'Receita', data:revData, backgroundColor:'#40916c', borderRadius:5, barPercentage:0.62},
      {label:'Custos', data:costData, backgroundColor:'#d3a84c', borderRadius:5, barPercentage:0.62},
      {label:'Lucro', data:profitData, backgroundColor:'#52b788', borderRadius:5, barPercentage:0.62, type:'line', borderColor:'#eee2cf', tension:.35, pointRadius:3, pointBackgroundColor:'#eee2cf'},
    ]},
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ labels:{ color: textColor, font:{family:'DM Sans', size:11}, boxWidth:10 } } },
      scales:{
        x:{ grid:{color:'transparent'}, ticks:{color:textColor, font:{size:11}} },
        y:{ grid:{color:gridColor}, ticks:{color:textColor, font:{size:10}, callback:(v)=> 'R$'+Number(v).toLocaleString('pt-BR')} }
      }
    }
  });

  const [start,end] = getPeriodRange();
  const orders = ordersInRange(start,end);
  const catTotals = {};
  orders.forEach(o=>{ const m = costsByCategory(o); Object.entries(m).forEach(([k,v])=> catTotals[k]=(catTotals[k]||0)+v); });
  const catLabels = Object.keys(catTotals);
  const catVals = Object.values(catTotals);
  const palette = ['#40916c','#d3a84c','#c1666b','#52b788','#e9e2cf','#2d6a4f','#a3823c'];
  charts.costs = new Chart(costCanvas, {
    type: catLabels.length ? 'doughnut' : 'bar',
    data:{ labels: catLabels.length?catLabels:['Sem dados'], datasets:[{ data: catVals.length?catVals:[1], backgroundColor: catLabels.length? palette : ['#233928'], borderWidth:0 }] },
    options:{
      responsive:true, maintainAspectRatio:false, cutout:'62%',
      plugins:{ legend:{ position:'bottom', labels:{ color:textColor, font:{family:'DM Sans', size:11}, boxWidth:10, padding:12 } } }
    }
  });
}
</script>

function deleteOrder(id){
  const o = DB.orders.find(x=>x.id===id);
  const hasStock = DB.stockMoves.some(m=> m.refKind==='order' && m.refId===id);
  if(!confirm('Excluir este pedido? Essa ação não pode ser desfeita.' + (hasStock ? '\n\nOs produtos baixados do estoque por este pedido voltam para o estoque.' : ''))) return false;
  DB.orders = DB.orders.filter(o=>o.id!==id);
  setMovesForRef('order', id, []);
  saveDB(); render(); toast('Pedido excluído.');
  return true;
}

/* ============================================================
   CICLOS MENSAIS
   Cliente paga um valor fechado por mês; as compras do mês são
   lançadas como pedidos separados (parte 1, parte 2...) na data
   em que foram feitas. O ciclo junta as partes e compara meses.
   ============================================================ */
function renderCycles(){
  const clientsWithCycles = DB.clients.filter(c=> DB.cycles.some(cy=> cy.clientId===c.id));
  if(state.cycleClientFilter && !clientsWithCycles.some(c=> c.id===state.cycleClientFilter)) state.cycleClientFilter = '';
  const list = DB.cycles
    .filter(cy=> !state.cycleClientFilter || cy.clientId===state.cycleClientFilter)
    .sort((a,b)=> cycleRefDate(b).localeCompare(cycleRefDate(a)));
  const chips = clientsWithCycles.length > 1 ? `<div class="period-bar" style="margin-bottom:16px;">
      <button class="chip ${!state.cycleClientFilter?'active':''}" onclick="state.cycleClientFilter=''; render();">Todos</button>
      ${clientsWithCycles.map(c=> `<button class="chip ${state.cycleClientFilter===c.id?'active':''}" onclick="state.cycleClientFilter='${c.id}'; render();">${escapeHtml(c.name)}</button>`).join('')}
    </div>` : '';
  return `
    <div class="topbar">
      <div>
        <div class="page-title">Ciclos mensais</div>
        <div class="page-sub">Clientes com valor fechado por mês e compras lançadas em partes</div>
      </div>
      <button class="btn btn-primary" onclick="openCycleModal()">${ic('plus')} Novo ciclo</button>
    </div>
    ${chips}
    ${list.length===0 ? `<div class="card">${emptyState('calendar','Nenhum ciclo cadastrado','Crie um ciclo para o cliente que paga um valor por mês. Cada compra continua sendo lançada como um pedido, na data em que foi feita, e o ciclo soma tudo.', "openCycleModal()", "Novo ciclo")}</div>`
      : list.map(renderCycleCard).join('')}
  `;
}

function renderCycleCard(cy){
  const t = cycleTotals(cy);
  const parts = Math.max(1, parseInt(cy.parts)||2);
  const status = cycleStatus(t);
  const dates = t.orders.map(o=>o.date).sort();
  const span = dates.length ? (dates.length>1 && dates[0]!==dates[dates.length-1] ? `${fmtDate(dates[0])} a ${fmtDate(dates[dates.length-1])}` : fmtDate(dates[0])) : 'Nenhuma parte lançada ainda';

  const rows = [];
  for(let n=1; n<=parts; n++){
    const ords = t.orders.filter(o=> o.cyclePart===n);
    if(ords.length===0){
      rows.push(`<div class="cycle-part missing">
        <div><b>Parte ${n}</b></div>
        <div class="hide-sm">—</div>
        <div>Ainda não lançada</div>
        <div><button class="btn btn-ghost btn-sm" onclick="openOrderModal(null,'${cy.clientId}','${cy.id}',${n})">${ic('plus')} Lançar</button></div>
      </div>`);
    } else ords.forEach(o=> rows.push(cyclePartRow(o, `Parte ${n}`)));
  }
  // partes fora da numeração (ex: parte 3 num ciclo de 2) não podem sumir da conta
  t.orders.filter(o=> !(o.cyclePart>=1 && o.cyclePart<=parts)).forEach(o=> rows.push(cyclePartRow(o, 'Extra')));

  const prev = previousCycle(cy);
  let compare = `<div class="cycle-compare">Primeiro ciclo registrado deste cliente. A comparação aparece a partir do próximo.</div>`;
  if(prev){
    let pt = cycleTotals(prev);
    // ciclo atual incompleto: compara só as mesmas partes do ciclo anterior, senão o lucro parece cair
    const launched = [...new Set(t.orders.map(o=> o.cyclePart))];
    const partial = t.orders.length > 0 && launched.length < parts;
    if(partial) pt = periodTotals(cycleOrders(prev).filter(o=> launched.includes(o.cyclePart)));
    const dCost = t.cost - pt.cost, dProfit = t.profit - pt.profit;
    const costTxt = Math.abs(dCost) < 0.005 ? 'igual' : (dCost < 0 ? `<b style="color:#7fe0ab">${fmtBRL(-dCost)} a menos</b>` : `<b style="color:#f0aeb1">${fmtBRL(dCost)} a mais</b>`);
    const profitTxt = Math.abs(dProfit) < 0.005 ? 'igual' : (dProfit > 0 ? `<b style="color:#7fe0ab">+ ${fmtBRL(dProfit)}</b>` : `<b style="color:#f0aeb1">− ${fmtBRL(-dProfit)}</b>`);
    const who = partial ? `${launched.length===1 ? 'a parte '+launched[0] : 'as partes '+launched.sort().join(' e ')} de` : '';
    compare = t.orders.length===0 ? `<div class="cycle-compare">Lance a primeira parte para comparar com ${escapeHtml(prev.name)}.</div>` : `<div class="cycle-compare">
      <span>Comparado ${partial?'com '+who:'a'} <b style="color:var(--beige)">${escapeHtml(prev.name)}</b>:</span>
      <span>Custo ${costTxt} <span class="client-row-sub">(${fmtBRL(pt.cost)} → ${fmtBRL(t.cost)})</span></span>
      <span>Lucro ${profitTxt}</span>
      <span>Margem ${fmtPct(pt.margin)} → ${fmtPct(t.margin)}</span>
    </div>`;
  }

  const diff = round2(t.revenue - t.monthly);
  const warn = (t.monthly > 0 && t.orders.length >= parts && Math.abs(diff) > 0.005)
    ? `<div class="cycle-warn">${ic('alert')} As partes somam ${fmtBRL(t.revenue)}, ${diff>0?'acima':'abaixo'} do valor do mês (${fmtBRL(t.monthly)}). Confira o valor cobrado em cada parte.</div>` : '';

  return `<div class="card cycle-card">
    <div class="cycle-head">
      <div>
        <div class="cycle-title">${escapeHtml(cy.name)} ${statusBadge(status==='Sem partes'?'Não pago':status)}</div>
        <div class="client-row-sub" style="font-size:12.5px;">${escapeHtml(clientName(cy.clientId))} · ${span}</div>
      </div>
      <div class="cycle-actions">
        ${t.balance > 0.005 ? `<button class="btn btn-ghost btn-sm" onclick="openCyclePaymentModal('${cy.id}')">${ic('check')} Registrar pagamento</button>` : ''}
        <button class="btn btn-ghost btn-sm" onclick="openCycleModal('${cy.id}')">${ic('edit')} Editar</button>
      </div>
    </div>
    <div class="cycle-stats">
      <div class="cycle-stat"><div class="stat-label">Valor do mês</div><div class="v">${fmtBRL(t.monthly)}</div></div>

/* ---------- Modal: ciclo ---------- */
let cycleDraft = null;

function openCycleModal(id){
  const editing = id ? DB.cycles.find(c=> c.id===id) : null;
  if(editing){
    cycleDraft = { ...editing, attach: cycleOrders(editing).map(o=>o.id) };
  } else {
    const clientId = state.cycleClientFilter || (DB.clients.find(c=> c.name.toLowerCase().includes('creche'))||DB.clients[0]||{}).id || '';
    cycleDraft = { id:null, clientId, name: defaultCycleName(), monthlyValue: lastMonthlyValue(clientId), parts:2, notes:'', attach:[] };
  }
  document.getElementById('modalRoot').innerHTML = cycleModalHtml();
}
function lastMonthlyValue(clientId){
  const list = cyclesOfClient(clientId);
  return list.length ? Number(list[list.length-1].monthlyValue)||0 : 0;
}
function cycleModalHtml(){
  const d = cycleDraft;
  const clientOptions = DB.clients.map(c=> `<option value="${c.id}" ${d.clientId===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('');
  const candidates = DB.orders
    .filter(o=> o.clientId===d.clientId && (!o.cycleId || o.cycleId===d.id || !DB.cycles.some(c=> c.id===o.cycleId)))
    .sort((a,b)=> b.date.localeCompare(a.date));
  const body = `
    <div class="field-row">
      <div class="field"><label for="cy_client">Cliente *</label>
        <select id="cy_client" onchange="refreshCycleModal(true)" ${d.id?'disabled':''}>${clientOptions || '<option value="">Cadastre um cliente primeiro</option>'}</select>
      </div>
      <div class="field"><label for="cy_name">Nome do ciclo *</label><input id="cy_name" value="${escapeHtml(d.name)}" placeholder="Ex: Outubro/2026"></div>
    </div>
    <div class="field-row">
      <div class="field"><label for="cy_value">Valor cobrado no mês (R$) *</label><input id="cy_value" type="number" step="0.01" min="0" value="${d.monthlyValue||''}" placeholder="Ex: 4380"></div>
      <div class="field"><label for="cy_parts">Compras no mês</label>
        <select id="cy_parts">${[1,2,3,4].map(n=> `<option value="${n}" ${Number(d.parts)===n?'selected':''}>${n} ${n===1?'parte':'partes'}</option>`).join('')}</select>
      </div>
    </div>
    <div class="field-hint" style="margin:-4px 0 14px;">Cada parte é lançada como um pedido normal, na data em que a compra foi feita, mesmo que não caia certinho de 15 em 15 dias.</div>

    <div class="field"><label>Pedidos já lançados que fazem parte deste ciclo</label>
      ${candidates.length===0 ? `<div class="field-hint">Nenhum pedido deste cliente disponível. Depois de salvar, use "Lançar" em cada parte.</div>` : `
      <div class="attach-list">
        ${candidates.map(o=> `<label><input type="checkbox" class="cy_attach" value="${o.id}" ${d.attach.includes(o.id)?'checked':''}>
          <span style="flex:1;">${fmtDate(o.date)} · ${escapeHtml(o.description||o.type||'Pedido')}</span>
          <span class="mono" style="color:var(--text-dim);">${fmtBRL(orderTotalCost(o))} custo</span></label>`).join('')}
      </div>
      <div class="field-hint">As partes são numeradas pela data: a compra mais antiga vira a parte 1.</div>`}
    </div>
    <div class="field"><label for="cy_notes">Observações</label><textarea id="cy_notes">${escapeHtml(d.notes||'')}</textarea></div>
  `;
  const foot = `
    <div>${d.id ? `<button class="btn btn-danger btn-sm" onclick="deleteCycle('${d.id}')">${ic('trash')} Excluir ciclo</button>` : '<span></span>'}</div>
    <div style="display:flex; gap:8px;"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveCycle()">Salvar ciclo</button></div>
  `;
  return modalShell(d.id ? 'Editar ciclo mensal' : 'Novo ciclo mensal', body, foot);
}
function readCycleForm(){
  const d = cycleDraft;
  const cl = document.getElementById('cy_client');
  if(cl && !cl.disabled) d.clientId = cl.value;
  d.name = document.getElementById('cy_name').value;
  d.monthlyValue = parseFloat(document.getElementById('cy_value').value)||0;
  d.parts = parseInt(document.getElementById('cy_parts').value)||2;
  d.notes = document.getElementById('cy_notes').value;
  d.attach = [...document.querySelectorAll('.cy_attach')].filter(x=> x.checked).map(x=> x.value);
}
function refreshCycleModal(clientChanged){
  const before = cycleDraft.clientId;
  readCycleForm();
  if(clientChanged && cycleDraft.clientId !== before){
    cycleDraft.attach = [];
    if(!cycleDraft.monthlyValue) cycleDraft.monthlyValue = lastMonthlyValue(cycleDraft.clientId);
  }
  document.getElementById('modalRoot').innerHTML = cycleModalHtml();
}
function saveCycle(){
  readCycleForm();
  const d = cycleDraft;
  if(!d.clientId){ toast('Selecione o cliente do ciclo.', 'error'); return; }
  const name = d.name.trim();
  if(!name){ toast('Dê um nome ao ciclo, por exemplo "Outubro/2026".', 'error'); document.getElementById('cy_name').focus(); return; }
  if(d.monthlyValue <= 0){ toast('Informe o valor que o cliente paga no mês.', 'error'); document.getElementById('cy_value').focus(); return; }
  if(DB.cycles.some(c=> c.id!==d.id && c.clientId===d.clientId && c.name.trim().toLowerCase()===name.toLowerCase())){
    toast('Já existe um ciclo com esse nome para este cliente.', 'error'); return;
  }
  const id = d.id || uid();
  const rec = { clientId: d.clientId, name, monthlyValue: round2(d.monthlyValue), parts: d.parts, notes: d.notes.trim() };
  if(d.id) Object.assign(DB.cycles.find(c=> c.id===d.id), rec);
  else DB.cycles.push({ id, createdAt: todayISO(), ...rec });

  // desvincula o que foi desmarcado e numera as partes pela data
  DB.orders.forEach(o=>{ if(o.cycleId===id && !d.attach.includes(o.id)){ o.cycleId = null; o.cyclePart = null; } });
  const attached = DB.orders.filter(o=> d.attach.includes(o.id)).sort((a,b)=> a.date.localeCompare(b.date));
  attached.forEach((o,i)=>{ o.cycleId = id; o.cyclePart = i+1; });

  if(!saveDB()) return;
  closeModal(); cycleDraft = null;
  state.view = 'cycles'; render();
  toast(attached.length > rec.parts ? `Ciclo salvo. Atenção: ${attached.length} pedidos vinculados para ${rec.parts} parte(s).` : 'Ciclo salvo.', attached.length > rec.parts ? 'error' : undefined);
}
function deleteCycle(id){
  const cy = DB.cycles.find(c=> c.id===id);
  if(!cy) return;
  const n = DB.orders.filter(o=> o.cycleId===id).length;
  if(!confirm(`Excluir o ciclo "${cy.name}"?` + (n ? `\n\nOs ${n} pedido(s) vinculados NÃO são apagados, só deixam de fazer parte do ciclo.` : ''))) return;
  DB.cycles = DB.cycles.filter(c=> c.id!==id);
  DB.orders.forEach(o=>{ if(o.cycleId===id){ o.cycleId = null; o.cyclePart = null; } });
  if(!saveDB()) return;
  closeModal(); render(); toast('Ciclo excluído.');
}

/* ---------- Modal: pagamento do mês (distribui entre as partes) ---------- */
function openCyclePaymentModal(id){
  const cy = DB.cycles.find(c=> c.id===id);
  if(!cy) return;
  const t = cycleTotals(cy);
  const body = `
    <div class="warn-box">O cliente paga o mês inteiro de uma vez. O valor é distribuído entre as partes em aberto, começando pela parte 1.</div>
    <div class="field-row">
      <div class="field"><label for="cp_date">Data do pagamento *</label><input type="date" id="cp_date" value="${todayISO()}"></div>
      <div class="field"><label for="cp_value">Valor recebido (R$) *</label><input type="number" step="0.01" min="0" id="cp_value" value="${round2(t.balance).toFixed(2)}"></div>
    </div>
    <div class="field"><label for="cp_method">Forma de pagamento</label><input id="cp_method" placeholder="PIX, transferência, dinheiro..."></div>
    <div class="calc-line"><span>Saldo do ciclo</span><b class="mono">${fmtBRL(t.balance)}</b></div>
  `;
  const foot = `<span></span><div style="display:flex; gap:8px;"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveCyclePayment('${id}')">Registrar</button></div>`;
  document.getElementById('modalRoot').innerHTML = modalShell(`Pagamento · ${escapeHtml(cy.name)}`, body, foot);
}
function saveCyclePayment(id){
  const cy = DB.cycles.find(c=> c.id===id);
  if(!cy) return;
  const t = cycleTotals(cy);
  const date = document.getElementById('cp_date').value || todayISO();
  let value = round2(parseFloat(document.getElementById('cp_value').value)||0);
  const method = document.getElementById('cp_method').value.trim();
  if(value <= 0){ toast('Informe o valor recebido.', 'error'); document.getElementById('cp_value').focus(); return; }
  if(value > round2(t.balance) + 0.005){ toast(`O valor passa do saldo do ciclo (${fmtBRL(t.balance)}). Confira antes de registrar.`, 'error'); return; }
  const label = (method ? method + ' · ' : '') + 'pagamento do ciclo ' + cy.name;
  t.orders.forEach(o=>{
    if(value <= 0.005) return;
    const bal = round2(orderBalance(o));
    if(bal <= 0.005) return;
    const v = Math.min(bal, value);
    o.payments.push({ id: uid(), date, value: round2(v), method: label });
    if(orderBalance(o) <= 0.005) o.overdue = false;
    value = round2(value - v);
  });
  if(!saveDB()) return;
  closeModal(); render(); toast('Pagamento registrado nas partes do ciclo.');
}

function orderCycleFields(o){
  const cycles = cyclesOfClient(o.clientId).slice().reverse();
  if(cycles.length===0) return '';
  const cy = cycles.find(c=> c.id===o.cycleId);
  const parts = cy ? Math.max(1, parseInt(cy.parts)||2) : 2;
  return `<div class="field-row">
    <div class="field"><label for="f_cycleId">Ciclo mensal</label>
      <select id="f_cycleId" onchange="onOrderCycleChange()">
        <option value="">Não faz parte de um ciclo</option>
        ${cycles.map(c=> `<option value="${c.id}" ${o.cycleId===c.id?'selected':''}>${escapeHtml(c.name)} · ${fmtBRL(c.monthlyValue)}/mês</option>`).join('')}
      </select>
    </div>
    <div class="field"><label for="f_cyclePart">Parte</label>
      <select id="f_cyclePart" ${cy?'':'disabled'}>${Array.from({length:parts},(_,i)=>i+1).map(n=> `<option value="${n}" ${o.cyclePart===n?'selected':''}>Parte ${n}</option>`).join('')}</select>
    </div>
  </div>`;
}
function nextFreePart(cy, exceptOrderId){
  const parts = Math.max(1, parseInt(cy.parts)||2);
  const used = DB.orders.filter(o=> o.cycleId===cy.id && o.id!==exceptOrderId).map(o=> o.cyclePart);
  for(let n=1; n<=parts; n++) if(!used.includes(n)) return n;
  return parts;
}
function onOrderCycleChange(){
  const id = document.getElementById('f_cycleId').value || null;
  const cy = DB.cycles.find(c=> c.id===id);
  orderDraft.cycleId = id;
  orderDraft.cyclePart = cy ? nextFreePart(cy, orderDraft.id) : null;
  orderDraft._cyclePicked = true;
  if(cy && !(Number(orderDraft.saleValue) > 0)) orderDraft.saleValue = round2((Number(cy.monthlyValue)||0) / Math.max(1, parseInt(cy.parts)||2));
  if(cy){ const ty = document.getElementById('f_type'); if(ty && !orderDraft.id) ty.value = 'Compra sob demanda'; }
  refreshOrderModal();
}

      </div>
      <div class="field-hint" style="margin-top:10px;">A importação aceita um backup completo (substitui tudo) ou um arquivo de lançamento (só acrescenta registros novos).</div>
    </div>
  `;
}
function addCategory(){
  const input = document.getElementById('newCatInput');
  const val = input.value.trim();
  if(!val) return;
  if(DB.settings.costCategories.includes(val)){ toast('Categoria já existe.'); return; }

function removeCategory(i){

}
function addExpenseCategory(){

function removeExpenseCategory(i){

}
function addProductCategory(){

  saveDB(); render(); toast('Categoria adicionada.');
}
function removeProductCategory(i){

}
function exportData(){
  const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'aba-gestao-backup-'+todayISO()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
  toast('Backup exportado.');
}

const MERGE_COLLECTIONS = ['clients','suppliers','products','purchases','orders','expenses','baskets','stockMoves','cycles'];

function importDataFile(input){
  const file = input.files && input.files[0];
  input.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onerror = ()=> toast('Não foi possível ler o arquivo.', 'error');
  reader.onload = ()=>{
    let data;
    try{ data = JSON.parse(reader.result); }
    catch(e){ toast('Arquivo inválido: não é um JSON legível.', 'error'); return; }
    if(!data || typeof data !== 'object'){ toast('Arquivo inválido.', 'error'); return; }
    if(data.abaImport === 'lancamento') importMerge(data);
    else if(Array.isArray(data.clients) && Array.isArray(data.orders)) importReplace(data);
    else toast('Este arquivo não parece ser um backup do ABA Gestão.', 'error');
  };
  reader.readAsText(file);
}
function importReplace(data){
  if(!confirm('Este é um backup completo. Importar vai SUBSTITUIR todos os dados atuais deste navegador.\n\nSe ainda não exportou um backup do que está aqui, cancele e exporte antes. Continuar?')) return;
  DB = migrateDB(data);
  saveDB(); render(); toast('Backup importado.');
}
// Lançamento: acrescenta só os registros cujo id ainda não existe
function importMerge(data){
  const counts = {};
  // fornecedor ou produto com o mesmo nome de um já cadastrado é reaproveitado, não duplicado
  const remap = {};
  [['suppliers', DB.suppliers], ['products', DB.products]].forEach(([k, existing])=>{
    if(!Array.isArray(data[k])) return;
    data[k] = data[k].filter(x=>{
      if(!x || !x.id || !x.name) return false;
      const same = existing.find(e=> e.id!==x.id && e.name.trim().toLowerCase()===x.name.trim().toLowerCase());
      if(same){ remap[x.id] = same.id; return false; }
      return true;
    });
  });
  const fix = id=> remap[id] || id;
  (data.products||[]).forEach(p=>{ if(p.supplierId) p.supplierId = fix(p.supplierId); });
  (data.purchases||[]).forEach(p=>{ if(p.supplierId) p.supplierId = fix(p.supplierId); (p.items||[]).forEach(it=> it.productId = fix(it.productId)); });
  (data.baskets||[]).forEach(b=> (b.items||[]).forEach(it=> it.productId = fix(it.productId)));
  (data.orders||[]).forEach(o=> (o.baskets||[]).forEach(b=> (b.items||[]).forEach(it=> it.productId = fix(it.productId))));
  (data.stockMoves||[]).forEach(m=> m.productId = fix(m.productId));
  (data.productCosts||[]).forEach(pc=> pc.productId = fix(pc.productId));
  MERGE_COLLECTIONS.forEach(k=>{
    if(!Array.isArray(data[k])) return;
    const ids = new Set(DB[k].map(x=>x.id));
    const fresh = data[k].filter(x=> x && x.id && !ids.has(x.id));
    if(fresh.length){ DB[k].push(...fresh); counts[k] = fresh.length; }
  });
  // produtos com o custo mais recente das compras do arquivo
  (data.productCosts||[]).forEach(pc=>{
    const p = productById(pc.productId);
    if(p && (!p.costDate || pc.date >= p.costDate)){ p.cost = pc.cost; p.costDate = pc.date; }
  });
  const total = Object.values(counts).reduce((a,b)=>a+b,0);
  if(!total){ toast('Nada novo para importar: esses registros já estão no sistema.'); return; }
  DB = migrateDB(DB);
  saveDB(); render();
  const labels = { clients:'cliente(s)', suppliers:'fornecedor(es)', products:'produto(s)', purchases:'compra(s)', orders:'pedido(s)', expenses:'despesa(s)', baskets:'cesta(s)', cycles:'ciclo(s) mensal(is)' };
  const parts = Object.entries(counts).filter(([k])=>labels[k]).map(([k,v])=> v+' '+labels[k]);
  toast(parts.length ? 'Importado: ' + parts.join(', ') + '.' : 'Importação concluída.');
}
function resetData(){
  if(!confirm('Isso vai apagar TODOS os dados salvos neste navegador. Deseja continuar?')) return;
  if(!confirm('Tem certeza? Sem um backup exportado, não há como recuperar.')) return;
  DB = migrateDB(emptyDB());
  saveDB(); render(); toast('Todos os dados foram apagados.');
}
</script>

<script>
/* ============================================================
   CALCULADORA DE LUCRO / SIMULADOR
   ============================================================ */
const calcState = { qty:1, unitPrice:0, unitCost:0, freight:0, gas:0, delivery:0, other:0 };

function renderCalculator(){
  return `
    <div class="topbar">
      <div>
        <div class="page-title">Calculadora de lucro</div>
        <div class="page-sub">Simule uma venda antes de fechar e veja o lucro na hora</div>
      </div>
    </div>
    <div class="calc-grid">
      <div class="card">
        <div class="section-title" style="margin:0 0 14px;">Dados da venda</div>
        ${DB.baskets.length ? `<div class="field"><label for="c_basket">Preencher com uma cesta (opcional)</label><select id="c_basket" onchange="fillCalcFromBasket(this.value)"><option value="">Escolha uma cesta...</option>${DB.baskets.map(b=>`<option value="${b.id}">${escapeHtml(b.name)}</option>`).join('')}</select><div class="field-hint">Usa o custo atual do estoque e o preço de venda cadastrado.</div></div>` : ''}
        <div class="field-row">
          <div class="field"><label>Quantidade</label><input type="number" min="1" step="1" id="c_qty" value="${calcState.qty}" oninput="updateCalc('qty',this.value)"></div>
          <div class="field"><label>Preço de venda (unitário)</label><input type="number" min="0" step="0.01" id="c_unitPrice" value="${calcState.unitPrice}" oninput="updateCalc('unitPrice',this.value)"></div>
        </div>
        <div class="field"><label>Custo dos produtos (unitário)</label><input type="number" min="0" step="0.01" id="c_unitCost" value="${calcState.unitCost}" oninput="updateCalc('unitCost',this.value)"></div>
        <div class="field-row">
          <div class="field"><label>Frete (total)</label><input type="number" min="0" step="0.01" id="c_freight" value="${calcState.freight}" oninput="updateCalc('freight',this.value)"></div>
          <div class="field"><label>Gasolina (total)</label><input type="number" min="0" step="0.01" id="c_gas" value="${calcState.gas}" oninput="updateCalc('gas',this.value)"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Entrega (total)</label><input type="number" min="0" step="0.01" id="c_delivery" value="${calcState.delivery}" oninput="updateCalc('delivery',this.value)"></div>
          <div class="field"><label>Outros custos (total)</label><input type="number" min="0" step="0.01" id="c_other" value="${calcState.other}" oninput="updateCalc('other',this.value)"></div>
        </div>
        <div class="field-hint">Dica: para simular uma venda como "10 cestas a R$ 65,90", informe a quantidade e o preço unitário. A receita é calculada automaticamente.</div>
      </div>
      <div class="card calc-result-card" id="calcResult"></div>
    </div>
  `;
}
function fillCalcFromBasket(id){
  const b = DB.baskets.find(x=>x.id===id);
  if(!b) return;
  calcState.unitCost = round2(basketUnitCost(b));
  calcState.unitPrice = Number(b.price)||0;
  render();
}
function updateCalc(key, val){
  calcState[key] = key==='qty' ? Math.max(1, parseInt(val)||1) : (parseFloat(val)||0);
  renderCalcResult();
}
function renderCalcResult(){
  const el = document.getElementById('calcResult');
  if(!el) return;
  const revenue = calcState.qty * calcState.unitPrice;
  const productCost = calcState.qty * calcState.unitCost;
  const totalCost = productCost + calcState.freight + calcState.gas + calcState.delivery + calcState.other;
  const profit = revenue - totalCost;
  const margin = revenue>0 ? (profit/revenue)*100 : 0;
  let tag, tagClass;
  if(revenue<=0){ tag='Informe os valores'; tagClass='tag-low'; }
  else if(margin >= 20){ tag='Venda saudável'; tagClass='tag-healthy'; }
  else if(margin >= 10){ tag='Margem baixa, atenção'; tagClass='tag-low'; }
  else { tag='Margem crítica'; tagClass='tag-bad'; }

  el.innerHTML = `
    <div class="section-title" style="margin:0 0 6px;">Resultado</div>
    <div class="calc-big">${fmtBRL(profit)}</div>
    <div class="field-hint" style="margin:2px 0 14px;">Lucro estimado</div>
    <div class="calc-line"><span>Receita (${calcState.qty} × ${fmtBRL(calcState.unitPrice)})</span><b class="mono">${fmtBRL(revenue)}</b></div>
    <div class="calc-line"><span>Custo dos produtos</span><b class="mono">${fmtBRL(productCost)}</b></div>
    <div class="calc-line"><span>Frete + gasolina + entrega + outros</span><b class="mono">${fmtBRL(calcState.freight+calcState.gas+calcState.delivery+calcState.other)}</b></div>
    <div class="calc-line"><span>Custo total</span><b class="mono">${fmtBRL(totalCost)}</b></div>
    <div class="calc-line"><span>Margem de lucro</span><b class="mono">${fmtPct(margin)}</b></div>
    <div class="calc-tag ${tagClass}">${tag}</div>
  `;
}
</script>

<script>

}

function openClientModal(id){

        <select id="f_status"><option value="ativo" ${c.status==='ativo'?'selected':''}>Ativo</option><option value="inativo" ${c.status==='inativo'?'selected':''}>Inativo</option></select>
      </div>

      <div class="field"><label>Telefone</label><input id="f_phone" value="${escapeHtml(c.phone)}"></div>
