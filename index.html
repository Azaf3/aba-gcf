<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<meta name="description" content="Sistema de gestão financeira e operacional da ABA Alimentos e Distribuição: dashboard, clientes, pedidos, custos e pagamentos.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232d6a4f'/%3E%3Ctext x='12' y='17' font-family='Arial,sans-serif' font-weight='700' font-size='14' fill='%23eafff2' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<title>ABA Gestão · Controle Financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg: #0d1712;
  --bg-soft: #122019;
  --surface: #16241c;
  --surface-2: #1c2e23;
  --border: #23392c;
  --border-soft: #1d3226;
  --green-900: #0f2a1c;
  --green-700: #1f5c3d;
  --green-600: #2d6a4f;
  --green-500: #40916c;
  --green-400: #52b788;
  --beige: #e9e2cf;
  --beige-dim: #b9b39e;
  --gold: #d3a84c;
  --gold-dim: #a3823c;
  --red: #c1666b;
  --red-dim: #7a3b3f;
  --text: #eeeae1;
  --text-dim: #9aa89e;
  --text-faint: #6c7a70;
  --radius: 14px;
  --radius-sm: 9px;
  --font-display: 'Poppins', sans-serif;
  --font-body: 'DM Sans', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --shadow: 0 8px 30px -12px rgba(0,0,0,0.55);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:
    radial-gradient(1100px 600px at 85% -10%, rgba(45,106,79,0.20), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(211,168,76,0.08), transparent 55%),
    var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing: antialiased;
}
.mono{ font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
::selection{ background: var(--green-600); color:#fff; }
button{ font-family: inherit; cursor:pointer; }
input, select, textarea{ font-family: inherit; }
a{ color: inherit; }
button:focus-visible, a:focus-visible, .nav-item:focus-visible{ outline: 2px solid var(--green-400); outline-offset: 2px; }
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background: var(--border); border-radius: 10px; }

/* ---------- Layout ---------- */
.app{ display:flex; min-height:100vh; }

.sidebar{
  width: 236px;
  flex-shrink:0;
  background: linear-gradient(180deg, var(--green-900), var(--bg-soft) 70%);
  border-right: 1px solid var(--border-soft);
  padding: 22px 14px;
  display:flex;
  flex-direction:column;
  gap: 4px;
  position: sticky;
  top:0;
  height:100vh;
  z-index: 40;
}
.brand{
  display:flex; align-items:center; gap:10px;
  padding: 6px 10px 22px 10px;
}
.brand-mark{
  width:38px; height:38px; border-radius:10px;
  background: linear-gradient(145deg, var(--green-500), var(--green-700));
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:800; color:#eafff2;
  font-size:16px;
  box-shadow: 0 4px 14px -4px rgba(64,145,108,0.6);
  flex-shrink:0;
}
.brand-text .t1{ font-family:var(--font-display); font-weight:700; font-size:15px; letter-spacing:0.2px; color:var(--beige); line-height:1.15;}
.brand-text .t2{ font-size:10.5px; color: var(--text-faint); letter-spacing:1.4px; text-transform:uppercase; margin-top:2px;}

.nav{ display:flex; flex-direction:column; gap:2px; margin-top:6px; flex:1; overflow-y:auto;}
.nav-label{ font-size:10px; text-transform:uppercase; letter-spacing:1.4px; color:var(--text-faint); padding: 14px 12px 6px; }
.nav-item{
  display:flex; align-items:center; gap:11px;
  padding: 10px 12px; border-radius: 10px;
  color: var(--text-dim); font-size:13.5px; font-weight:500;
  background:transparent; border:none; text-align:left; width:100%;
  transition: background .15s ease, color .15s ease;
}
.nav-item svg{ width:17px; height:17px; flex-shrink:0; opacity:.85;}
.nav-item:hover{ background: rgba(255,255,255,0.04); color: var(--text); }
.nav-item.active{ background: linear-gradient(90deg, rgba(64,145,108,0.24), rgba(64,145,108,0.05)); color: var(--beige); box-shadow: inset 2px 0 0 var(--green-400); }
.sidebar-foot{ padding: 10px 12px; border-top:1px solid var(--border-soft); margin-top:8px; }
.sidebar-foot .biz{ font-size:11.5px; color:var(--text-faint); line-height:1.5; }

.main{ flex:1; min-width:0; padding: 26px 30px 60px; max-width: 1400px; }
.topbar{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:22px; }
.page-title{ font-family: var(--font-display); font-weight:700; font-size: 24px; color: var(--beige); letter-spacing:.2px;}
.page-sub{ color: var(--text-dim); font-size:13px; margin-top:4px; }

.btn{
  display:inline-flex; align-items:center; gap:8px;
  padding: 10px 16px; border-radius: 10px; border:1px solid var(--border);
  background: var(--surface); color: var(--text); font-size:13.5px; font-weight:600;
  transition: all .15s ease;
}
.btn:hover{ border-color: var(--green-500); background: var(--surface-2); }
.btn-primary{ background: linear-gradient(135deg, var(--green-500), var(--green-700)); border-color: transparent; color:#f2fff7; box-shadow: 0 6px 18px -8px rgba(64,145,108,0.6);}
.btn-primary:hover{ filter: brightness(1.08); }
.btn-gold{ background: linear-gradient(135deg, var(--gold), var(--gold-dim)); border-color:transparent; color:#241b06; }
.btn-ghost{ background:transparent; border-color: var(--border); }
.btn-danger{ background: transparent; border-color: var(--red-dim); color:#e8a9ac; }
.btn-danger:hover{ background: rgba(193,102,107,0.12); }
.btn-sm{ padding:7px 11px; font-size:12.5px; border-radius:8px; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }

/* ---------- Period filter ---------- */
.period-bar{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
.chip{
  padding: 7px 13px; border-radius: 999px; font-size:12.5px; font-weight:600;
  background: var(--surface); border:1px solid var(--border); color: var(--text-dim);
}
.chip.active{ background: rgba(64,145,108,0.18); border-color: var(--green-500); color: var(--beige); }
.period-custom{ display:flex; align-items:center; gap:6px; }
.period-custom input[type=date]{ background: var(--surface); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:6px 8px; font-size:12.5px; }

/* ---------- Cards ---------- */
.grid{ display:grid; gap:16px; }
.grid-4{ grid-template-columns: repeat(4, 1fr); }
.grid-3{ grid-template-columns: repeat(3, 1fr); }
.grid-2{ grid-template-columns: repeat(2, 1fr); }
@media (max-width: 1180px){ .grid-4{ grid-template-columns: repeat(2,1fr);} .grid-3{grid-template-columns: repeat(2,1fr);} }
@media (max-width: 720px){ .grid-4,.grid-3,.grid-2{ grid-template-columns: 1fr;} }

.card{
  background: linear-gradient(160deg, var(--surface), var(--bg-soft));
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  padding: 18px 18px;
  box-shadow: var(--shadow);
  position:relative;
  overflow:hidden;
}
.stat-card{ display:flex; flex-direction:column; gap:10px; }
.stat-top{ display:flex; align-items:center; justify-content:space-between; }
.stat-label{ font-size:11.5px; text-transform:uppercase; letter-spacing:1.2px; color: var(--text-faint); font-weight:600;}
.stat-icon{ width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; }
.stat-icon svg{ width:16px; height:16px; }
.stat-value{ font-family: var(--font-mono); font-size: 25px; font-weight:600; color: var(--beige); letter-spacing:-0.3px;}
.stat-foot{ font-size:11.5px; color: var(--text-faint); display:flex; align-items:center; gap:6px;}
.trend-up{ color: var(--green-400); }
.trend-down{ color: var(--red); }

.ic-revenue{ background: rgba(64,145,108,0.16); color: var(--green-400);}
.ic-cost{ background: rgba(211,168,76,0.14); color: var(--gold);}
.ic-profit{ background: rgba(82,183,136,0.18); color:#7fe0ab;}
.ic-margin{ background: rgba(233,226,207,0.10); color: var(--beige);}
.ic-pending{ background: rgba(193,102,107,0.14); color:#e8a9ac;}
.ic-clients{ background: rgba(64,145,108,0.12); color: var(--green-400);}
.ic-orders{ background: rgba(211,168,76,0.12); color: var(--gold);}

.section-title{ font-family: var(--font-display); font-weight:600; font-size:15.5px; color: var(--beige); margin: 30px 0 14px; display:flex; align-items:center; justify-content:space-between;}
.section-title .hint{ font-size:11.5px; color:var(--text-faint); font-weight:400; font-family:var(--font-body);}

/* ---------- Funnel (signature element) ---------- */
.funnel-wrap{ display:flex; gap:22px; align-items:stretch; flex-wrap:wrap; }
.funnel-col{ flex:1; min-width:260px; }
.funnel-row{ display:flex; align-items:center; gap:14px; padding: 11px 0; border-bottom: 1px dashed var(--border-soft); }
.funnel-row:last-child{ border-bottom:none; }
.funnel-label{ width:120px; flex-shrink:0; font-size:12px; color: var(--text-dim); font-weight:600; text-transform:uppercase; letter-spacing:.6px;}
.funnel-bar-track{ flex:1; height:12px; background: rgba(255,255,255,0.04); border-radius:6px; overflow:hidden; position:relative;}
.funnel-bar-fill{ height:100%; border-radius:6px; transition: width .4s ease; }
.funnel-value{ width:118px; text-align:right; font-family: var(--font-mono); font-size:13.5px; font-weight:600; color: var(--beige); flex-shrink:0;}
.funnel-arrow{ text-align:center; color: var(--text-faint); font-size:11px; padding: 2px 0 2px 134px; }

/* ---------- Tables ---------- */
.table-wrap{ overflow-x:auto; border-radius: var(--radius); border:1px solid var(--border-soft); }
table{ width:100%; border-collapse:collapse; font-size:13px; min-width:600px; }
thead th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:1px; color: var(--text-faint); padding:12px 14px; background: var(--bg-soft); border-bottom:1px solid var(--border-soft); white-space:nowrap;}
tbody td{ padding:12px 14px; border-bottom:1px solid var(--border-soft); color: var(--text); vertical-align:middle;}
tbody tr{ background: var(--surface); transition: background .12s ease; }
tbody tr:hover{ background: var(--surface-2); cursor:pointer; }
tbody tr:last-child td{ border-bottom:none; }
.td-num{ font-family: var(--font-mono); text-align:right; }
.td-actions{ text-align:right; white-space:nowrap; }
.empty-row td{ text-align:center; color: var(--text-faint); padding: 30px; cursor:default; }
.empty-row:hover{ background:var(--surface); }

.badge{ display:inline-flex; align-items:center; gap:5px; padding:4px 9px; border-radius:999px; font-size:11px; font-weight:600; white-space:nowrap;}
.badge-green{ background: rgba(82,183,136,0.16); color:#7fe0ab; }
.badge-gold{ background: rgba(211,168,76,0.16); color: var(--gold); }
.badge-red{ background: rgba(193,102,107,0.18); color:#f0aeb1; }
.badge-gray{ background: rgba(255,255,255,0.06); color: var(--text-dim); }
.badge-dot{ width:6px; height:6px; border-radius:50%; background:currentColor; }

/* ---------- Charts ---------- */
.chart-card{ padding:18px; }
.chart-card canvas{ max-height:260px; }

/* ---------- Client detail / list rows ---------- */
.client-row-name{ font-weight:600; color: var(--beige); }
.client-row-sub{ font-size:11.5px; color: var(--text-faint); margin-top:2px;}
.rank-list{ display:flex; flex-direction:column; gap:10px; }
.rank-item{ display:flex; align-items:center; gap:12px; }
.rank-num{ width:22px; height:22px; border-radius:6px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:var(--gold); font-family:var(--font-mono); flex-shrink:0;}
.rank-name{ flex:1; font-size:13px; font-weight:600; color:var(--text); }
.rank-sub{ font-size:11px; color:var(--text-faint); }
.rank-value{ font-family:var(--font-mono); font-size:13px; color: var(--green-400); font-weight:600; }
.rank-bar-track{ height:5px; background:rgba(255,255,255,0.05); border-radius:4px; margin-top:5px; overflow:hidden;}
.rank-bar-fill{ height:100%; background: linear-gradient(90deg, var(--green-500), var(--gold)); border-radius:4px;}

/* ---------- Alerts ---------- */
.alert-item{ display:flex; gap:10px; align-items:flex-start; padding:11px 0; border-bottom:1px solid var(--border-soft); }
.alert-item:last-child{ border-bottom:none; }
.alert-icon{ width:26px; height:26px; border-radius:8px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
.alert-icon svg{ width:14px; height:14px; }
.alert-text{ font-size:12.5px; color: var(--text); line-height:1.4; }
.alert-text b{ color: var(--beige); }

/* ---------- Toolbar / search ---------- */
.toolbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
.search-box{ position:relative; }
.search-box input{ background: var(--surface); border:1px solid var(--border); border-radius:10px; padding:9px 12px 9px 34px; color:var(--text); font-size:13px; width:240px; }
.search-box svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--text-faint); }
.toolbar-right{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }

/* ---------- Modal ---------- */
.modal-overlay{ position:fixed; inset:0; background: rgba(6,10,8,0.7); backdrop-filter: blur(3px); display:none; align-items:flex-start; justify-content:center; z-index:100; padding: 40px 16px; overflow-y:auto;}
.modal-overlay.open{ display:flex; }
.modal{ background: linear-gradient(165deg, var(--surface), var(--bg-soft)); border:1px solid var(--border-soft); border-radius: var(--radius); width:100%; max-width:640px; box-shadow: 0 30px 70px -20px rgba(0,0,0,0.7); animation: modalIn .18s ease; }
@keyframes modalIn{ from{ opacity:0; transform: translateY(10px) scale(.98);} to{ opacity:1; transform:none;} }
.modal-head{ display:flex; align-items:center; justify-content:space-between; padding: 18px 22px; border-bottom:1px solid var(--border-soft); }
.modal-title{ font-family:var(--font-display); font-weight:600; font-size:16px; color:var(--beige); }
.modal-close{ background:transparent; border:none; color:var(--text-faint); width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center;}
.modal-close:hover{ background: var(--surface-2); color:var(--text); }
.modal-body{ padding: 20px 22px; max-height: 68vh; overflow-y:auto; }
.modal-foot{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding: 16px 22px; border-top:1px solid var(--border-soft); }

.field{ margin-bottom:14px; }
.field label{ display:block; font-size:11.5px; font-weight:600; color: var(--text-dim); margin-bottom:6px; text-transform:uppercase; letter-spacing:.5px;}
.field input, .field select, .field textarea{
  width:100%; background: var(--bg-soft); border:1px solid var(--border); border-radius:9px;
  padding:10px 11px; color: var(--text); font-size:13.5px;
}
.field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color: var(--green-500); }
.field textarea{ resize:vertical; min-height:60px; }
.field-row{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
.field-hint{ font-size:11px; color:var(--text-faint); margin-top:4px; }
.checkbox-row{ display:flex; align-items:center; gap:8px; }
.checkbox-row input{ width:auto; accent-color: var(--green-500); }

.subblock{ background: var(--bg-soft); border:1px solid var(--border-soft); border-radius:11px; padding:14px; margin-bottom:14px; }
.subblock-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.subblock-title{ font-size:12.5px; font-weight:700; color:var(--beige); }
.mini-row{ display:flex; gap:8px; align-items:center; padding:8px 0; border-bottom:1px solid var(--border-soft); font-size:12.5px; }
.mini-row:last-child{ border-bottom:none; }
.mini-row .mr-cat{ font-weight:600; color:var(--text); width:110px; flex-shrink:0;}
.mini-row .mr-desc{ flex:1; color:var(--text-dim); }
.mini-row .mr-val{ font-family:var(--font-mono); color:var(--gold); width:90px; text-align:right; flex-shrink:0;}
.mini-row .mr-del{ flex-shrink:0; }
.icon-btn{ width:24px; height:24px; border-radius:7px; border:1px solid var(--border); background:var(--surface); display:flex; align-items:center; justify-content:center; color:var(--text-faint); flex-shrink:0;}
.icon-btn:hover{ color:var(--red); border-color:var(--red-dim); }
.add-row-form{ display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
.add-row-form select, .add-row-form input{ background:var(--surface); border:1px solid var(--border); border-radius:7px; padding:7px 8px; color:var(--text); font-size:12px; }
.add-row-form .f-cat{ width:112px; } .add-row-form .f-desc{ flex:1; min-width:110px;} .add-row-form .f-val{ width:90px; }
.totals-mini{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--text-dim); padding-top:8px; margin-top:4px; border-top:1px solid var(--border); }
.totals-mini b{ color:var(--beige); font-family:var(--font-mono); }

/* ---------- Calculator ---------- */
.calc-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:22px; align-items:start; }
@media (max-width: 900px){ .calc-grid{ grid-template-columns:1fr; } }
.calc-result-card{ position:sticky; top:26px; }
.calc-big{ font-family:var(--font-mono); font-size:34px; font-weight:700; color: var(--green-400); }
.calc-line{ display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--border-soft); font-size:13px; }
.calc-line:last-child{ border-bottom:none; }
.calc-tag{ display:inline-block; margin-top:14px; padding:8px 14px; border-radius:9px; font-size:12.5px; font-weight:700; text-align:center; width:100%; }
.tag-healthy{ background: rgba(82,183,136,0.16); color:#7fe0ab; }
.tag-low{ background: rgba(211,168,76,0.16); color: var(--gold); }
.tag-bad{ background: rgba(193,102,107,0.18); color:#f0aeb1; }

.detail-header{ display:flex; align-items:center; gap:14px; margin-bottom:22px; }
.avatar-lg{ width:52px; height:52px; border-radius:14px; background:linear-gradient(145deg,var(--green-500),var(--green-700)); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:19px; color:#eafff2; flex-shrink:0;}
.back-link{ display:inline-flex; align-items:center; gap:6px; color:var(--text-dim); font-size:12.5px; margin-bottom:14px; }
.back-link:hover{ color:var(--beige); }

.tag-status{ padding:3px 9px; border-radius:999px; font-size:11px; font-weight:700;}
.status-ativo{ background:rgba(82,183,136,0.16); color:#7fe0ab; }
.status-inativo{ background:rgba(255,255,255,0.06); color:var(--text-faint); }

.empty-state{ text-align:center; padding: 50px 20px; color: var(--text-faint); }
.empty-state svg{ width:40px; height:40px; margin-bottom:12px; opacity:.5;}
.empty-state h4{ color:var(--text-dim); font-size:14px; margin-bottom:6px; font-family:var(--font-display); }
.empty-state p{ font-size:12.5px; margin-bottom:16px; }

.toast{ position:fixed; bottom:24px; right:24px; background: var(--surface-2); border:1px solid var(--green-500); color:var(--text); padding:12px 18px; border-radius:10px; font-size:13px; box-shadow: var(--shadow); z-index:200; display:flex; align-items:center; gap:8px; animation: toastIn .2s ease; }
@keyframes toastIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }

.mobile-topbar{ display:none; }
@media (max-width: 880px){
  .sidebar{ position:fixed; left:-260px; transition:left .2s ease; box-shadow: 0 0 40px rgba(0,0,0,0.5); }
  .sidebar.open{ left:0; }
  .main{ padding: 18px 16px 50px; }
  .mobile-topbar{ display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .mobile-topbar button{ background:var(--surface); border:1px solid var(--border); border-radius:9px; width:38px; height:38px; display:flex; align-items:center; justify-content:center; color:var(--beige); }
  .sidebar-scrim{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:35;}
  .sidebar-scrim.open{ display:block; }
  .field-row{ grid-template-columns:1fr; }
}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<script id="app-data-marker" type="application/json"></script>

function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(!raw) { const seed = seedData(); localStorage.setItem(DB_KEY, JSON.stringify(seed)); return seed; }
    const parsed = JSON.parse(raw);
    if(!parsed.settings) parsed.settings = { costCategories: defaultCostCategories() };
    if(!parsed.purchases) parsed.purchases = [];
    return parsed;
  }catch(e){
    console.error('Erro ao carregar dados, recriando base.', e);
    const seed = seedData(); localStorage.setItem(DB_KEY, JSON.stringify(seed)); return seed;
  }
}
function saveDB(){

  }
}

/* ---------- Utilitários ---------- */
function uid(){ return 'id_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function fmtBRL(n){
  n = Number(n)||0;
  return n.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
}
function fmtPct(n){ if(!isFinite(n)) n = 0; return n.toLocaleString('pt-BR',{minimumFractionDigits:1, maximumFractionDigits:1}) + '%'; }
function fmtDate(d){ if(!d) return '—'; const dt = new Date(d+'T00:00:00'); if(isNaN(dt)) return d; return dt.toLocaleDateString('pt-BR'); }
function toISODate(dt){ return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }
function todayISO(){ return toISODate(new Date()); }
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function toast(msg, type){
  const root = document.getElementById('toastRoot');
  const el = document.createElement('div');
  el.className = 'toast';
  el.setAttribute('role','status');
  if(type==='error') el.style.borderColor = 'var(--red-dim)';
  el.innerHTML = `${ic(type==='error'?'alert':'check','')} <span>${escapeHtml(msg)}</span>`;
  root.innerHTML = '';
  root.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 2600);
}

/* ---------- Cálculos financeiros (fonte única de verdade) ---------- */
function orderTotalCost(order){ return (order.costs||[]).reduce((s,c)=> s + (Number(c.value)||0), 0); }
function orderGrossProfit(order){ return (Number(order.saleValue)||0) - orderTotalCost(order); }
function orderMargin(order){ const rev = Number(order.saleValue)||0; if(rev<=0) return 0; return (orderGrossProfit(order)/rev)*100; }
function orderPaid(order){ return (order.payments||[]).reduce((s,p)=> s + (Number(p.value)||0), 0); }
function orderBalance(order){ return (Number(order.saleValue)||0) - orderPaid(order); }
function orderPaymentStatus(order){
  const bal = orderBalance(order), paid = orderPaid(order);
  if(paid <= 0) return order.overdue ? 'Em atraso' : 'Não pago';
  if(bal > 0.005) return order.overdue ? 'Em atraso' : 'Parcial';
  return 'Pago';
}
function costsByCategory(order){
  const map = {};
  (order.costs||[]).forEach(c=>{ map[c.category] = (map[c.category]||0) + (Number(c.value)||0); });
  return map;
}

function ordersInRange(start, end){
  return DB.orders.filter(o=> o.date >= start && o.date <= end);
}

function periodTotals(orders){
  const revenue = orders.reduce((s,o)=> s + (Number(o.saleValue)||0), 0);
  const cost = orders.reduce((s,o)=> s + orderTotalCost(o), 0);
  const profit = revenue - cost;
  const margin = revenue>0 ? (profit/revenue)*100 : 0;
  const pending = orders.reduce((s,o)=> s + Math.max(0, orderBalance(o)), 0);
  return { revenue, cost, profit, margin, pending, count: orders.length };
}

function clientName(id){ const c = DB.clients.find(x=>x.id===id); return c ? c.name : 'Cliente removido'; }

/* ---------- Estado ---------- */
const state = {
  view: 'dashboard',
  periodType: 'month', // today, week, month, lastmonth, last30, year, custom
  customStart: null,
  customEnd: null,
  clientDetailId: null,
  searchClients: '',
  searchOrders: '',
  searchPurchases: '',
  sidebarOpen: false,
};

function getPeriodRange(){
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
  const iso = toISODate;
  switch(state.periodType){
    case 'today': { const t = iso(now); return [t,t]; }
    case 'week': {
      const day = now.getDay() === 0 ? 7 : now.getDay();
      const start = new Date(now); start.setDate(d - day + 1);
      return [iso(start), iso(now)];
    }
    case 'month': return [iso(new Date(y,m,1)), iso(new Date(y,m+1,0))];
    case 'lastmonth': return [iso(new Date(y,m-1,1)), iso(new Date(y,m,0))];
    case 'last30': { const start = new Date(now); start.setDate(d-29); return [iso(start), iso(now)]; }
    case 'year': return [iso(new Date(y,0,1)), iso(new Date(y,11,31))];
    case 'custom': return [state.customStart || iso(new Date(y,m,1)), state.customEnd || iso(now)];
    default: return [iso(new Date(y,m,1)), iso(new Date(y,m+1,0))];
  }
}

      ${statCard('Lucro bruto', fmtBRL(t.profit), 'profit', t.profit>=0 ? 'Resultado positivo' : 'Resultado negativo')}
      ${statCard('Margem', fmtPct(t.margin), 'margin', 'Lucro bruto / receita')}
    </div>
    <div class="grid grid-3" style="margin-top:16px;">
      ${statCard('A receber', fmtBRL(t.pending), 'pending', pendingOrders.length + ' pedido(s) com saldo em aberto')}
      ${statCard('Clientes ativos', activeClients, 'clients', DB.clients.length + ' cadastrado(s) no total')}
      ${statCard('Pedidos / serviços', t.count, 'orders', 'No período selecionado')}
    </div>

    <div class="section-title">Da receita ao lucro <span class="hint">quanto realmente sobrou para a ABA</span></div>
    <div class="card">
      ${renderFunnel(t)}
    </div>

    <div class="grid grid-2" style="margin-top:26px; align-items:start;">
      <div class="card chart-card">
        <div class="section-title" style="margin:0 0 10px;">Receita × Custos × Lucro <span class="hint">últimos 6 meses</span></div>
        <canvas id="chartRevenue"></canvas>
      </div>
      <div class="card chart-card">
        <div class="section-title" style="margin:0 0 10px;">Custos por categoria <span class="hint">no período</span></div>
        <canvas id="chartCosts"></canvas>
      </div>
    </div>

    <div class="grid grid-2" style="margin-top:20px; align-items:start;">
      <div class="card">
        <div class="section-title" style="margin:0 0 12px;">Clientes mais lucrativos</div>
        ${renderTopClients(orders)}
      </div>
      <div class="card">
        <div class="section-title" style="margin:0 0 6px;">Alertas financeiros</div>
        ${renderAlerts(lowMarginOrders, pendingOrders, overdueOrders)}
      </div>
    </div>

    <div class="grid grid-2" style="margin-top:20px; align-items:start;">
      <div class="card" style="padding:0;">
        <div class="section-title" style="margin:0; padding:18px 18px 0;">Últimos pedidos</div>
        ${renderMiniOrdersTable(orders.slice().sort((a,b)=> b.date.localeCompare(a.date)).slice(0,6))}
      </div>
      <div class="card" style="padding:0;">
        <div class="section-title" style="margin:0; padding:18px 18px 0;">Últimas compras</div>
        ${renderMiniPurchasesTable(DB.purchases.slice().sort((a,b)=> b.date.localeCompare(a.date)).slice(0,6))}
      </div>
    </div>
  `;
}

function statCard(label, value, kind, foot){
  const iconMap = { revenue:'orders', cost:'purchases', profit:'dashboard', margin:'calc', pending:'clock', clients:'users', orders:'box' };
  return `<div class="card stat-card">
    <div class="stat-top">
      <div class="stat-label">${label}</div>
      <div class="stat-icon ic-${kind}">${ic(iconMap[kind]||'dashboard')}</div>
    </div>
    <div class="stat-value">${value}</div>
    <div class="stat-foot">${foot}</div>
  </div>`;
}

function renderFunnel(t){
  const despesas = 0; // reservado para lucro líquido futuro
  const lucroLiquido = t.profit - despesas;
  const maxVal = Math.max(t.revenue, 1);
  const rows = [
    ['Receita', t.revenue, 'var(--green-500)'],
    ['Custos', t.cost, 'var(--gold)'],
    ['Lucro bruto', t.profit, t.profit>=0 ? 'var(--green-400)':'var(--red)'],
    ['Despesas', despesas, 'var(--text-faint)'],
    ['Lucro líquido', lucroLiquido, lucroLiquido>=0 ? 'var(--green-400)':'var(--red)'],
  ];
  return `<div class="funnel-wrap"><div class="funnel-col" style="flex:1 1 100%;">
    ${rows.map((r,i)=>{
      const pct = Math.min(100, Math.max(2, (Math.abs(r[1])/maxVal)*100));
      return `<div class="funnel-row">
        <div class="funnel-label">${r[0]}</div>
        <div class="funnel-bar-track"><div class="funnel-bar-fill" style="width:${pct}%; background:${r[2]};"></div></div>
        <div class="funnel-value">${fmtBRL(r[1])}</div>
      </div>${i<rows.length-1?'<div class="funnel-arrow">↓</div>':''}`;
    }).join('')}
    <div class="field-hint" style="margin-top:10px;">Despesas administrativas (funcionários, contas, sistemas, impostos) ainda não configuradas — lucro líquido = lucro bruto por enquanto.</div>
  </div></div>`;
}

function renderTopClients(periodOrders){
  const byClient = {};
  periodOrders.forEach(o=>{
    if(!byClient[o.clientId]) byClient[o.clientId] = {revenue:0, profit:0};
    byClient[o.clientId].revenue += Number(o.saleValue)||0;
    byClient[o.clientId].profit += orderGrossProfit(o);
  });
  const arr = Object.entries(byClient).map(([id,v])=> ({id, name: clientName(id), ...v})).sort((a,b)=> b.profit-a.profit).slice(0,5);
  if(arr.length===0) return emptyState('users','Sem dados no período', 'Registre pedidos para ver o ranking de clientes.');
  const max = Math.max(...arr.map(a=>a.profit), 1);
  return `<div class="rank-list">${arr.map((a,i)=> `
    <div class="rank-item-wrap" onclick="navigateTo('client-detail','${a.id}')" style="cursor:pointer;">
      <div class="rank-item">
        <div class="rank-num">${i+1}</div>
        <div style="flex:1;">
          <div class="rank-name">${escapeHtml(a.name)}</div>
          <div class="rank-bar-track"><div class="rank-bar-fill" style="width:${Math.max(4,(a.profit/max)*100)}%"></div></div>
        </div>
        <div class="rank-value">${fmtBRL(a.profit)}</div>
      </div>
    </div>`).join('')}</div>`;
}

function renderAlerts(lowMargin, pending, overdue){
  const items = [];
  if(overdue.length) items.push(['red','alert', `<b>${overdue.length} pedido(s) em atraso</b> com saldo pendente de recebimento.`]);
  if(pending.length) items.push(['gold','clock', `<b>${pending.length} pedido(s)</b> com valores ainda não recebidos, totalizando ${fmtBRL(pending.reduce((s,o)=>s+orderBalance(o),0))}.`]);
  if(lowMargin.length) items.push(['red','alert', `<b>${lowMargin.length} pedido(s)</b> com margem de lucro abaixo de 15%.`]);
  if(items.length===0) return emptyState('check','Tudo em ordem', 'Nenhum alerta financeiro no período selecionado.');
  return items.map(([tone,icon,text])=> `<div class="alert-item">
    <div class="alert-icon" style="background:rgba(${tone==='red'?'193,102,107':'211,168,76'},0.16); color:${tone==='red'?'#f0aeb1':'var(--gold)'};">${ic(icon)}</div>
    <div class="alert-text">${text}</div>
  </div>`).join('');
}

function renderMiniOrdersTable(orders){
  if(orders.length===0) return emptyState('orders','Nenhum pedido ainda','Cadastre o primeiro pedido para começar.', "openOrderModal()", "Novo pedido");
  return `<div class="table-wrap" style="border:none; border-radius:0;"><table><thead><tr><th>Cliente</th><th>Data</th><th>Margem</th><th class="td-num">Valor</th></tr></thead><tbody>
    ${orders.map(o=> `<tr onclick="openOrderModal('${o.id}')">
      <td>${escapeHtml(clientName(o.clientId))}</td>
      <td>${fmtDate(o.date)}</td>
      <td>${marginBadge(orderMargin(o))}</td>
      <td class="td-num">${fmtBRL(o.saleValue)}</td>
    </tr>`).join('')}
  </tbody></table></div>`;
}
function renderMiniPurchasesTable(purchases){
  if(purchases.length===0) return emptyState('purchases','Nenhuma compra registrada','Registre compras para acompanhar seus custos.', "openPurchaseModal()", "Nova compra");
  return `<div class="table-wrap" style="border:none; border-radius:0;"><table><thead><tr><th>Fornecedor</th><th>Data</th><th>Comprovante</th><th class="td-num">Valor</th></tr></thead><tbody>
    ${purchases.map(p=> `<tr onclick="openPurchaseModal('${p.id}')">
      <td>${escapeHtml(p.supplier||'—')}</td>
      <td>${fmtDate(p.date)}</td>
      <td>${p.hasReceipt ? '<span class="badge badge-green">Com nota</span>' : '<span class="badge badge-gray">Sem nota</span>'}</td>
      <td class="td-num">${fmtBRL(p.total)}</td>
    </tr>`).join('')}
  </tbody></table></div>`;
}

function marginBadge(margin){
  if(margin >= 25) return `<span class="badge badge-green">${fmtPct(margin)}</span>`;
  if(margin >= 15) return `<span class="badge badge-gold">${fmtPct(margin)}</span>`;
  return `<span class="badge badge-red">${fmtPct(margin)}</span>`;
}
function statusBadge(status){
  const map = { 'Pago':'badge-green', 'Parcial':'badge-gold', 'Não pago':'badge-gray', 'Em atraso':'badge-red' };
  return `<span class="badge ${map[status]||'badge-gray'}">${status}</span>`;
}

function emptyState(icon, title, sub, action, actionLabel){
  return `<div class="empty-state">
    ${ic(icon)}
    <h4>${title}</h4>
    <p>${sub}</p>
    ${action ? `<button class="btn btn-primary btn-sm" onclick="${action}">${ic('plus')} ${actionLabel}</button>` : ''}
  </div>`;
}

/* ---------- Gráficos ---------- */
function destroyCharts(){ Object.values(charts).forEach(c=> c && c.destroy()); charts = {}; }

function buildDashboardCharts(){
  destroyCharts();
  const revCanvas = document.getElementById('chartRevenue');
  const costCanvas = document.getElementById('chartCosts');
  if(!revCanvas || !window.Chart) return;

  // últimos 6 meses
  const months = [];
  const now = new Date();
  for(let i=5;i>=0;i--){ const d = new Date(now.getFullYear(), now.getMonth()-i, 1); months.push(d); }
  const labels = months.map(d=> d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','') );
  const revData=[], costData=[], profitData=[];
  months.forEach(d=>{
    const start = toISODate(new Date(d.getFullYear(), d.getMonth(),1));
    const end = toISODate(new Date(d.getFullYear(), d.getMonth()+1,0));
    const os = ordersInRange(start,end);
    const t = periodTotals(os);
    revData.push(t.revenue.toFixed(2)); costData.push(t.cost.toFixed(2)); profitData.push(t.profit.toFixed(2));
  });

  const gridColor = 'rgba(255,255,255,0.05)';
  const textColor = '#9aa89e';
  charts.revenue = new Chart(revCanvas, {
    type:'bar',
    data:{ labels, datasets:[
      {label:'Receita', data:revData, backgroundColor:'#40916c', borderRadius:5, barPercentage:0.62},
      {label:'Custos', data:costData, backgroundColor:'#d3a84c', borderRadius:5, barPercentage:0.62},
      {label:'Lucro', data:profitData, backgroundColor:'#52b788', borderRadius:5, barPercentage:0.62, type:'line', borderColor:'#eee2cf', tension:.35, pointRadius:3, pointBackgroundColor:'#eee2cf'},
    ]},
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ labels:{ color: textColor, font:{family:'DM Sans', size:11}, boxWidth:10 } } },
      scales:{
        x:{ grid:{color:'transparent'}, ticks:{color:textColor, font:{size:11}} },
        y:{ grid:{color:gridColor}, ticks:{color:textColor, font:{size:10}, callback:(v)=> 'R$'+Number(v).toLocaleString('pt-BR')} }
      }
    }
  });

  const [start,end] = getPeriodRange();
  const orders = ordersInRange(start,end);
  const catTotals = {};
  orders.forEach(o=>{ const m = costsByCategory(o); Object.entries(m).forEach(([k,v])=> catTotals[k]=(catTotals[k]||0)+v); });
  const catLabels = Object.keys(catTotals);
  const catVals = Object.values(catTotals);
  const palette = ['#40916c','#d3a84c','#c1666b','#52b788','#e9e2cf','#2d6a4f','#a3823c'];
  charts.costs = new Chart(costCanvas, {
    type: catLabels.length ? 'doughnut' : 'bar',
    data:{ labels: catLabels.length?catLabels:['Sem dados'], datasets:[{ data: catVals.length?catVals:[1], backgroundColor: catLabels.length? palette : ['#233928'], borderWidth:0 }] },
    options:{
      responsive:true, maintainAspectRatio:false, cutout:'62%',
      plugins:{ legend:{ position:'bottom', labels:{ color:textColor, font:{family:'DM Sans', size:11}, boxWidth:10, padding:12 } } }
    }
  });
}
</script>

<script>
/* ============================================================
   CLIENTES
   ============================================================ */
function renderClients(){
  const q = state.searchClients.toLowerCase();
  const list = DB.clients.filter(c=> c.name.toLowerCase().includes(q)).sort((a,b)=> a.name.localeCompare(b.name));
  return `
    <div class="topbar">
      <div>
        <div class="page-title">Clientes</div>
        <div class="page-sub">${DB.clients.length} cliente(s) cadastrado(s)</div>
      </div>
      <button class="btn btn-primary" onclick="openClientModal()">${ic('plus')} Novo cliente</button>
    </div>
    <div class="toolbar">
      <div class="search-box">${ic('search')}<input placeholder="Buscar cliente..." value="${escapeHtml(state.searchClients)}" oninput="state.searchClients=this.value; render();"></div>
    </div>
    ${list.length===0 ? `<div class="card">${emptyState('users','Nenhum cliente encontrado','Cadastre clientes para começar a acompanhar pedidos e lucro.', "openClientModal()", "Novo cliente")}</div>` : `
    <div class="table-wrap"><table><thead><tr>
      <th>Cliente</th><th>Cidade</th><th>Status</th><th class="td-num">Pedidos</th><th class="td-num">Receita total</th><th class="td-num">Lucro gerado</th><th></th>
    </tr></thead><tbody>
      ${list.map(c=>{
        const orders = DB.orders.filter(o=>o.clientId===c.id);
        const t = periodTotals(orders);
        return `<tr onclick="navigateTo('client-detail','${c.id}')">
          <td>
            <div class="client-row-name">${escapeHtml(c.name)}</div>
            <div class="client-row-sub">${escapeHtml(c.phone||c.whatsapp||'sem contato cadastrado')}</div>
          </td>
          <td>${escapeHtml(c.city||'—')}</td>
          <td><span class="tag-status status-${c.status}">${c.status==='ativo'?'Ativo':'Inativo'}</span></td>
          <td class="td-num">${orders.length}</td>
          <td class="td-num">${fmtBRL(t.revenue)}</td>
          <td class="td-num" style="color:${t.profit>=0?'#7fe0ab':'#f0aeb1'}">${fmtBRL(t.profit)}</td>
          <td class="td-actions"><button class="icon-btn" onclick="event.stopPropagation(); openClientModal('${c.id}')" aria-label="Editar cliente">${ic('edit')}</button></td>
        </tr>`;
      }).join('')}
    </tbody></table></div>`}
  `;
}

function renderClientDetail(){
  const c = DB.clients.find(x=>x.id===state.clientDetailId);
  if(!c) return `<div class="card">${emptyState('users','Cliente não encontrado','Volte para a lista de clientes.', "navigateTo('clients')", "Voltar")}</div>`;
  const orders = DB.orders.filter(o=>o.clientId===c.id).sort((a,b)=> b.date.localeCompare(a.date));
  const t = periodTotals(orders);
  const totalPaid = orders.reduce((s,o)=>s+orderPaid(o),0);
  const totalPending = orders.reduce((s,o)=>s+Math.max(0,orderBalance(o)),0);
  const initials = c.name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();

  return `
    <a class="back-link" onclick="navigateTo('clients')" style="cursor:pointer;">${ic('chevron')} Voltar para clientes</a>
    <div class="detail-header">
      <div class="avatar-lg">${initials}</div>
      <div style="flex:1;">
        <div class="page-title" style="font-size:20px;">${escapeHtml(c.name)}</div>
        <div class="page-sub">${escapeHtml(c.city||'Cidade não informada')} · <span class="tag-status status-${c.status}">${c.status==='ativo'?'Ativo':'Inativo'}</span></div>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="openClientModal('${c.id}')">${ic('edit')} Editar</button>
      <button class="btn btn-primary btn-sm" onclick="openOrderModal(null,'${c.id}')">${ic('plus')} Novo pedido</button>
    </div>

    <div class="grid grid-4">
      ${statCard('Receita total', fmtBRL(t.revenue), 'revenue', orders.length+' pedido(s)')}
      ${statCard('Custos totais', fmtBRL(t.cost), 'cost', 'Compras + logística')}
      ${statCard('Lucro gerado', fmtBRL(t.profit), 'profit', 'Margem média '+fmtPct(t.margin))}
      ${statCard('Pendente', fmtBRL(totalPending), 'pending', fmtBRL(totalPaid)+' já recebido')}
    </div>

    ${(c.phone||c.whatsapp||c.doc||c.address||c.notes) ? `
    <div class="card" style="margin-top:20px;">
      <div class="section-title" style="margin:0 0 10px;">Dados do cliente</div>
      <div class="grid grid-2" style="gap:10px;">
        ${c.doc?`<div><div class="stat-label">CPF/CNPJ</div><div style="margin-top:4px;">${escapeHtml(c.doc)}</div></div>`:''}
        ${c.phone?`<div><div class="stat-label">Telefone</div><div style="margin-top:4px;">${escapeHtml(c.phone)}</div></div>`:''}
        ${c.whatsapp?`<div><div class="stat-label">WhatsApp</div><div style="margin-top:4px;">${escapeHtml(c.whatsapp)}</div></div>`:''}
        ${c.cep?`<div><div class="stat-label">CEP</div><div style="margin-top:4px;">${escapeHtml(c.cep)}</div></div>`:''}
        ${c.address?`<div style="grid-column:1/-1;"><div class="stat-label">Endereço</div><div style="margin-top:4px;">${escapeHtml(c.address)}</div></div>`:''}
        ${c.notes?`<div style="grid-column:1/-1;"><div class="stat-label">Observações</div><div style="margin-top:4px; color:var(--text-dim);">${escapeHtml(c.notes)}</div></div>`:''}
      </div>
    </div>` : ''}

    <div class="section-title">Histórico de pedidos e serviços</div>
    ${orders.length===0 ? `<div class="card">${emptyState('orders','Nenhum pedido ainda','Registre o primeiro pedido deste cliente.', `openOrderModal(null,'${c.id}')`, "Novo pedido")}</div>` : `
    <div class="table-wrap"><table><thead><tr>
      <th>Data</th><th>Descrição</th><th>Pagamento</th><th class="td-num">Receita</th><th class="td-num">Custo</th><th class="td-num">Lucro</th><th class="td-num">Margem</th>
    </tr></thead><tbody>
      ${orders.map(o=> `<tr onclick="openOrderModal('${o.id}')">
        <td>${fmtDate(o.date)}</td>
        <td>${escapeHtml(o.description||o.type)}</td>
        <td>${statusBadge(orderPaymentStatus(o))}</td>
        <td class="td-num">${fmtBRL(o.saleValue)}</td>
        <td class="td-num">${fmtBRL(orderTotalCost(o))}</td>
        <td class="td-num" style="color:${orderGrossProfit(o)>=0?'#7fe0ab':'#f0aeb1'}">${fmtBRL(orderGrossProfit(o))}</td>
        <td class="td-num">${marginBadge(orderMargin(o))}</td>
      </tr>`).join('')}
    </tbody></table></div>`}

    <div class="section-title">Comprovantes anexados</div>
    <div class="card">
      ${renderClientReceipts(orders)}
    </div>
  `;
}

function renderClientReceipts(orders){
  const withReceipts = [];
  orders.forEach(o=> (o.costs||[]).forEach(c=>{ if(c.hasReceipt) withReceipts.push({order:o, cost:c}); }));
  if(withReceipts.length===0) return emptyState('receipt','Sem comprovantes','Os comprovantes anexados aos custos de cada pedido aparecerão aqui.');
  return `<div class="rank-list">${withReceipts.map(({order,cost})=> `
    <div class="mini-row" style="border-bottom:1px solid var(--border-soft);">
      <div class="icon-btn" style="color:var(--green-400); cursor:default;">${ic('receipt')}</div>
      <div class="mr-desc"><b style="color:var(--text)">${escapeHtml(cost.category)}</b> — ${escapeHtml(cost.description||'')} <span class="client-row-sub">(${fmtDate(order.date)})</span></div>
      <div class="mr-val">${fmtBRL(cost.value)}</div>
    </div>`).join('')}</div>`;
}
</script>

    <div class="table-wrap"><table><thead><tr>

        <td><div class="client-row-name">${escapeHtml(clientName(o.clientId))}</div><div class="client-row-sub">${escapeHtml(o.description||'')}</div></td>
        <td>${fmtDate(o.date)}</td>
        <td><span class="badge badge-gray">${escapeHtml(o.type||'—')}</span></td>
        <td>${statusBadge(orderPaymentStatus(o))}</td>
        <td class="td-num">${fmtBRL(o.saleValue)}</td>

/* ============================================================

   ============================================================ */
function renderPurchases(){
  const q = state.searchPurchases.toLowerCase();
  const list = DB.purchases.filter(p=> (p.supplier||'').toLowerCase().includes(q) || (p.description||'').toLowerCase().includes(q)).sort((a,b)=> b.date.localeCompare(a.date));
  const total = DB.purchases.reduce((s,p)=>s+(Number(p.total)||0),0);
  return `
    <div class="topbar">
      <div>
        <div class="page-title">Compras</div>
        <div class="page-sub">${DB.purchases.length} registro(s) · ${fmtBRL(total)} acumulado</div>
      </div>
      <button class="btn btn-primary" onclick="openPurchaseModal()">${ic('plus')} Nova compra</button>
    </div>
    <div class="field-hint" style="margin-bottom:16px; max-width:640px;">Este módulo é um arquivo geral de compras e notas fiscais. Para que uma compra entre no cálculo de lucro de um pedido específico, adicione o custo diretamente na aba "Custos" dentro do pedido correspondente.</div>
    <div class="toolbar">
      <div class="search-box">${ic('search')}<input placeholder="Buscar por fornecedor ou descrição..." value="${escapeHtml(state.searchPurchases)}" oninput="state.searchPurchases=this.value; render();"></div>
    </div>
    ${list.length===0 ? `<div class="card">${emptyState('purchases','Nenhuma compra registrada','Registre compras, mesmo sem comprovante, para manter o histórico completo.', "openPurchaseModal()", "Nova compra")}</div>` : `
    <div class="table-wrap"><table><thead><tr>
      <th>Fornecedor</th><th>Data</th><th>Cliente vinculado</th><th>Comprovante</th><th class="td-num">Valor</th><th></th>
    </tr></thead><tbody>
      ${list.map(p=> `<tr onclick="openPurchaseModal('${p.id}')">
        <td><div class="client-row-name">${escapeHtml(p.supplier||'—')}</div><div class="client-row-sub">${escapeHtml(p.description||'')}</div></td>
        <td>${fmtDate(p.date)}</td>
        <td>${p.clientId ? escapeHtml(clientName(p.clientId)) : '<span class="client-row-sub">—</span>'}</td>
        <td>${p.hasReceipt ? '<span class="badge badge-green">Com comprovante</span>' : '<span class="badge badge-gray">Sem comprovante — já lançada</span>'}</td>
        <td class="td-num">${fmtBRL(p.total)}</td>
        <td class="td-actions"><button class="icon-btn" onclick="event.stopPropagation(); deletePurchase('${p.id}')" aria-label="Excluir compra">${ic('trash')}</button></td>
      </tr>`).join('')}
    </tbody></table></div>`}
  `;
}
function deletePurchase(id){
  if(!confirm('Excluir esta compra?')) return;
  DB.purchases = DB.purchases.filter(p=>p.id!==id);
  saveDB(); render(); toast('Compra excluída.');
}

/* ============================================================
   CONFIGURAÇÕES
   ============================================================ */
function renderSettings(){
  const cats = DB.settings.costCategories;
  return `
    <div class="topbar">
      <div>
        <div class="page-title">Configurações</div>
        <div class="page-sub">Categorias de custo e preferências do sistema</div>
      </div>
    </div>
    <div class="card" style="max-width:520px;">
      <div class="section-title" style="margin:0 0 12px;">Categorias de custo</div>
      <div id="catList">
        ${cats.map((c,i)=> `<div class="mini-row">
          <div class="mr-desc">${escapeHtml(c)}</div>
          ${['Compras','Frete','Gasolina','Entrega','Outros'].includes(c) ? '' : `<button class="icon-btn" onclick="removeCategory(${i})" aria-label="Remover categoria ${escapeHtml(c)}">${ic('trash')}</button>`}
        </div>`).join('')}
      </div>
      <div class="add-row-form">
        <input id="newCatInput" class="f-desc" placeholder="Nova categoria (ex: Embalagem)">
        <button class="btn btn-ghost btn-sm" onclick="addCategory()">${ic('plus')} Adicionar</button>
      </div>
    </div>
    <div class="card" style="max-width:520px; margin-top:16px;">
      <div class="section-title" style="margin:0 0 10px;">Dados</div>
      <div class="field-hint" style="margin-bottom:12px;">Todos os dados ficam salvos localmente neste navegador (localStorage). Nada é enviado para nenhum servidor.</div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn btn-ghost btn-sm" onclick="exportData()">Exportar backup (.json)</button>
        <button class="btn btn-danger btn-sm" onclick="resetData()">${ic('trash')} Apagar todos os dados</button>
      </div>
    </div>
  `;
}
function addCategory(){
  const input = document.getElementById('newCatInput');
  const val = input.value.trim();
  if(!val) return;
  if(DB.settings.costCategories.includes(val)){ toast('Categoria já existe.'); return; }
  DB.settings.costCategories.push(val);
  saveDB(); render(); toast('Categoria adicionada.');
}
function removeCategory(i){
  if(!confirm('Remover esta categoria de custo? Custos já lançados com ela continuam existindo, mas ela não aparecerá mais nas opções.')) return;
  DB.settings.costCategories.splice(i,1);
  saveDB(); render(); toast('Categoria removida.');
}
function exportData(){
  const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'aba-gestao-backup-'+todayISO()+'.json';
  a.click(); URL.revokeObjectURL(url);
}
function resetData(){
  if(!confirm('Isso vai apagar TODOS os dados salvos neste navegador. Deseja continuar?')) return;
  localStorage.removeItem(DB_KEY);
  DB = loadDB();
  render(); toast('Dados reiniciados.');
}
</script>

<script>
/* ============================================================
   CALCULADORA DE LUCRO / SIMULADOR
   ============================================================ */
const calcState = { qty:1, unitPrice:0, unitCost:0, freight:0, gas:0, delivery:0, other:0 };

function renderCalculator(){
  return `
    <div class="topbar">
      <div>
        <div class="page-title">Calculadora de lucro</div>
        <div class="page-sub">Simule uma venda antes de fechar e veja o lucro na hora</div>
      </div>
    </div>
    <div class="calc-grid">
      <div class="card">
        <div class="section-title" style="margin:0 0 14px;">Dados da venda</div>
        <div class="field-row">
          <div class="field"><label for="c_qty">Quantidade</label><input type="number" min="1" step="1" id="c_qty" value="${calcState.qty}" oninput="updateCalc('qty',this.value)"></div>
          <div class="field"><label for="c_unitPrice">Preço de venda (unitário)</label><input type="number" min="0" step="0.01" id="c_unitPrice" value="${calcState.unitPrice}" oninput="updateCalc('unitPrice',this.value)"></div>
        </div>
        <div class="field"><label for="c_unitCost">Custo dos produtos (unitário)</label><input type="number" min="0" step="0.01" id="c_unitCost" value="${calcState.unitCost}" oninput="updateCalc('unitCost',this.value)"></div>
        <div class="field-row">
          <div class="field"><label for="c_freight">Frete (total)</label><input type="number" min="0" step="0.01" id="c_freight" value="${calcState.freight}" oninput="updateCalc('freight',this.value)"></div>
          <div class="field"><label for="c_gas">Gasolina (total)</label><input type="number" min="0" step="0.01" id="c_gas" value="${calcState.gas}" oninput="updateCalc('gas',this.value)"></div>
        </div>
        <div class="field-row">
          <div class="field"><label for="c_delivery">Entrega (total)</label><input type="number" min="0" step="0.01" id="c_delivery" value="${calcState.delivery}" oninput="updateCalc('delivery',this.value)"></div>
          <div class="field"><label for="c_other">Outros custos (total)</label><input type="number" min="0" step="0.01" id="c_other" value="${calcState.other}" oninput="updateCalc('other',this.value)"></div>
        </div>
        <div class="field-hint">Dica: para simular uma venda como "10 cestas a R$ 65,90", informe a quantidade e o preço unitário — a receita é calculada automaticamente.</div>
      </div>
      <div class="card calc-result-card" id="calcResult"></div>
    </div>
  `;
}
function updateCalc(key, val){
  calcState[key] = key==='qty' ? Math.max(1, parseInt(val)||1) : Math.max(0, parseFloat(val)||0);
  renderCalcResult();
}
function renderCalcResult(){
  const el = document.getElementById('calcResult');
  if(!el) return;
  const revenue = calcState.qty * calcState.unitPrice;
  const productCost = calcState.qty * calcState.unitCost;
  const totalCost = productCost + calcState.freight + calcState.gas + calcState.delivery + calcState.other;
  const profit = revenue - totalCost;
  const margin = revenue>0 ? (profit/revenue)*100 : 0;
  let tag, tagClass;
  if(revenue<=0){ tag='Informe os valores'; tagClass='tag-low'; }
  else if(margin >= 20){ tag='Venda saudável'; tagClass='tag-healthy'; }
  else if(margin >= 10){ tag='Margem baixa — atenção'; tagClass='tag-low'; }
  else { tag='Margem crítica'; tagClass='tag-bad'; }

  el.innerHTML = `
    <div class="section-title" style="margin:0 0 6px;">Resultado</div>
    <div class="calc-big">${fmtBRL(profit)}</div>
    <div class="field-hint" style="margin:2px 0 14px;">Lucro estimado</div>
    <div class="calc-line"><span>Receita (${calcState.qty} × ${fmtBRL(calcState.unitPrice)})</span><b class="mono">${fmtBRL(revenue)}</b></div>
    <div class="calc-line"><span>Custo dos produtos</span><b class="mono">${fmtBRL(productCost)}</b></div>
    <div class="calc-line"><span>Frete + gasolina + entrega + outros</span><b class="mono">${fmtBRL(calcState.freight+calcState.gas+calcState.delivery+calcState.other)}</b></div>
    <div class="calc-line"><span>Custo total</span><b class="mono">${fmtBRL(totalCost)}</b></div>
    <div class="calc-line"><span>Margem de lucro</span><b class="mono">${fmtPct(margin)}</b></div>
    <div class="calc-tag ${tagClass}">${tag}</div>
  `;
}
</script>

<script>
/* ============================================================
   MODAL: helpers genéricos
   ============================================================ */
function closeModal(){
  document.getElementById('modalRoot').innerHTML = '';
}
document.addEventListener('keydown', (e)=>{
  if(e.key==='Escape' && document.getElementById('modalOverlay')) closeModal();
});
function modalShell(title, bodyHtml, footHtml){
  return `<div class="modal-overlay open" id="modalOverlay" onclick="if(event.target.id==='modalOverlay') closeModal();">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitleText">
      <div class="modal-head">
        <div class="modal-title" id="modalTitleText">${title}</div>
        <button class="modal-close" onclick="closeModal()" aria-label="Fechar">${ic('x')}</button>
      </div>
      <div class="modal-body">${bodyHtml}</div>
      <div class="modal-foot">${footHtml}</div>
    </div>
  </div>`;
}

/* ============================================================
   MODAL: CLIENTE
   ============================================================ */
function openClientModal(id){
  const editing = id ? DB.clients.find(c=>c.id===id) : null;
  const c = editing || { id:null, name:'', doc:'', phone:'', whatsapp:'', address:'', cep:'', city:'', notes:'', status:'ativo' };
  const body = `
    <div class="field"><label for="f_name">Nome do cliente *</label><input id="f_name" value="${escapeHtml(c.name)}" placeholder="Ex: Creche Renascer"></div>
    <div class="field-row">
      <div class="field"><label for="f_doc">CPF / CNPJ</label><input id="f_doc" value="${escapeHtml(c.doc)}"></div>
      <div class="field"><label for="f_status">Status</label>
        <select id="f_status"><option value="ativo" ${c.status==='ativo'?'selected':''}>Ativo</option><option value="inativo" ${c.status==='inativo'?'selected':''}>Inativo</option></select>
      </div>
    </div>
    <div class="field-row">
      <div class="field"><label for="f_phone">Telefone</label><input id="f_phone" value="${escapeHtml(c.phone)}"></div>
      <div class="field"><label for="f_whatsapp">WhatsApp</label><input id="f_whatsapp" value="${escapeHtml(c.whatsapp)}"></div>
    </div>
    <div class="field"><label for="f_address">Endereço</label><input id="f_address" value="${escapeHtml(c.address)}"></div>
    <div class="field-row">
      <div class="field"><label for="f_cep">CEP</label><input id="f_cep" value="${escapeHtml(c.cep)}"></div>
      <div class="field"><label for="f_city">Cidade</label><input id="f_city" value="${escapeHtml(c.city)}"></div>
    </div>
    <div class="field"><label for="f_notes">Observações</label><textarea id="f_notes">${escapeHtml(c.notes)}</textarea></div>
  `;
  const foot = `
    <div>${editing ? `<button class="btn btn-danger btn-sm" onclick="deleteClient('${c.id}')">${ic('trash')} Excluir</button>` : '<span></span>'}</div>
    <div style="display:flex; gap:8px;"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveClient('${c.id||''}')">Salvar cliente</button></div>
  `;
  document.getElementById('modalRoot').innerHTML = modalShell(editing?'Editar cliente':'Novo cliente', body, foot);
}
function saveClient(id){
  const name = document.getElementById('f_name').value.trim();
  if(!name){ toast('Informe o nome do cliente.'); return; }
  const data = {
    name,
    doc: document.getElementById('f_doc').value.trim(),
    status: document.getElementById('f_status').value,
    phone: document.getElementById('f_phone').value.trim(),
    whatsapp: document.getElementById('f_whatsapp').value.trim(),
    address: document.getElementById('f_address').value.trim(),
    cep: document.getElementById('f_cep').value.trim(),
    city: document.getElementById('f_city').value.trim(),
    notes: document.getElementById('f_notes').value.trim(),
  };
  if(id){
    const c = DB.clients.find(x=>x.id===id);
    Object.assign(c, data);
  } else {
    DB.clients.push({ id: uid(), createdAt: todayISO(), ...data });
  }
  saveDB(); closeModal(); render(); toast('Cliente salvo.');
}
function deleteClient(id){
  const hasOrders = DB.orders.some(o=>o.clientId===id);
  if(hasOrders){ toast('Este cliente possui pedidos vinculados e não pode ser excluído.'); return; }
  if(!confirm('Excluir este cliente?')) return;
  DB.clients = DB.clients.filter(c=>c.id!==id);
  saveDB(); closeModal(); navigateTo('clients'); toast('Cliente excluído.');
}

/* ============================================================
   MODAL: PEDIDO / SERVIÇO  (com custos e pagamentos dinâmicos)
   ============================================================ */
let orderDraft = null;

function openOrderModal(id, presetClientId){
  const editing = id ? DB.orders.find(o=>o.id===id) : null;
  orderDraft = editing ? JSON.parse(JSON.stringify(editing)) : {
    id:null, clientId: presetClientId||'', date: todayISO(), description:'', type:'Cesta Básica',
    saleValue:0, costs:[], payments:[], notes:'', overdue:false
  };
  document.getElementById('modalRoot').innerHTML = orderModalHtml(editing);
}
function orderModalHtml(editing){
  const o = orderDraft;
  const clientOptions = DB.clients.map(c=> `<option value="${c.id}" ${o.clientId===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('');
  const body = `
    <div class="field-row">
      <div class="field"><label for="f_clientId">Cliente *</label>
        <select id="f_clientId">${clientOptions || '<option value="">Cadastre um cliente primeiro</option>'}</select>
      </div>
      <div class="field"><label for="f_date">Data *</label><input type="date" id="f_date" value="${o.date}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label for="f_type">Tipo</label>
        <select id="f_type">
          ${['Cesta Básica','Compra sob demanda','Outro serviço'].map(t=>`<option ${o.type===t?'selected':''}>${t}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label for="f_saleValue">Valor total cobrado do cliente (R$) *</label><input type="number" step="0.01" min="0" id="f_saleValue" value="${o.saleValue}" oninput="orderDraft.saleValue=Math.max(0,parseFloat(this.value)||0); renderOrderTotals();"></div>
    </div>
    <div class="field"><label for="f_description">Descrição</label><input id="f_description" value="${escapeHtml(o.description)}" placeholder="Ex: 10 Cestas Básicas P"></div>

    <div class="subblock">
      <div class="subblock-head"><div class="subblock-title">Custos do pedido</div></div>
      <div id="costRows">${renderCostRows()}</div>
      <div class="add-row-form">
        <select class="f-cat" id="nc_cat" aria-label="Categoria do custo">${DB.settings.costCategories.map(c=>`<option>${c}</option>`).join('')}</select>
        <input class="f-desc" id="nc_desc" placeholder="Descrição (ex: comprovante 1)" aria-label="Descrição do custo">
        <input class="f-val" id="nc_val" type="number" step="0.01" placeholder="Valor" aria-label="Valor do custo">
        <label class="checkbox-row" style="font-size:11.5px; color:var(--text-dim);"><input type="checkbox" id="nc_receipt"> Tem comprovante</label>
        <button class="btn btn-ghost btn-sm" onclick="addCostRow()">${ic('plus')} Add</button>
      </div>
      <div class="totals-mini"><span>Custo total do pedido</span><b id="costTotalDisplay">${fmtBRL(orderTotalCost(o))}</b></div>
    </div>

    <div class="subblock">
      <div class="subblock-head"><div class="subblock-title">Pagamentos recebidos</div></div>
      <div id="paymentRows">${renderPaymentRows()}</div>
      <div class="add-row-form">
        <input class="f-val" id="np_date" type="date" value="${todayISO()}" style="width:130px;" aria-label="Data do pagamento">
        <input class="f-val" id="np_val" type="number" step="0.01" placeholder="Valor" style="width:100px;" aria-label="Valor do pagamento">
        <input class="f-desc" id="np_method" placeholder="Forma (PIX, dinheiro...)" aria-label="Forma de pagamento">
        <button class="btn btn-ghost btn-sm" onclick="addPaymentRow()">${ic('plus')} Add</button>
      </div>
    </div>

    <div class="field checkbox-row" style="margin-bottom:14px;">
      <input type="checkbox" id="f_overdue" ${o.overdue?'checked':''} onchange="orderDraft.overdue=this.checked;">
      <label for="f_overdue" style="margin:0; text-transform:none; font-size:12.5px;">Marcar como pagamento em atraso</label>
    </div>
    <div class="field"><label for="f_notes">Observações</label><textarea id="f_notes">${escapeHtml(o.notes)}</textarea></div>

    <div id="orderTotalsBox"></div>
  `;
  const foot = `
    <div>${editing ? `<button class="btn btn-danger btn-sm" onclick="deleteOrder('${o.id}'); closeModal();">${ic('trash')} Excluir</button>` : '<span></span>'}</div>
    <div style="display:flex; gap:8px;"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveOrder()">Salvar pedido</button></div>
  `;
  return modalShell(editing?'Editar pedido':'Novo pedido / serviço', body, foot) ;
}
function renderCostRows(){
  const o = orderDraft;
  if(o.costs.length===0) return `<div class="field-hint">Nenhum custo adicionado ainda.</div>`;
  return o.costs.map((c,i)=> `<div class="mini-row">
    <div class="mr-cat">${escapeHtml(c.category)}</div>
    <div class="mr-desc">${escapeHtml(c.description||'')} ${c.hasReceipt? '<span class="badge badge-green" style="margin-left:4px;">com nota</span>' : '<span class="badge badge-gray" style="margin-left:4px;">sem nota</span>'}</div>
    <div class="mr-val">${fmtBRL(c.value)}</div>
    <button class="icon-btn mr-del" onclick="removeCostRow(${i})" aria-label="Remover custo">${ic('trash')}</button>
  </div>`).join('');
}
function renderPaymentRows(){
  const o = orderDraft;
  if(o.payments.length===0) return `<div class="field-hint">Nenhum pagamento registrado ainda.</div>`;
  return o.payments.map((p,i)=> `<div class="mini-row">
    <div class="mr-cat">${fmtDate(p.date)}</div>
    <div class="mr-desc">${escapeHtml(p.method||'')}</div>
    <div class="mr-val" style="color:var(--green-400);">${fmtBRL(p.value)}</div>
    <button class="icon-btn mr-del" onclick="removePaymentRow(${i})" aria-label="Remover pagamento">${ic('trash')}</button>
  </div>`).join('');
}
function addCostRow(){
  const cat = document.getElementById('nc_cat').value;
  const desc = document.getElementById('nc_desc').value.trim();
  const val = parseFloat(document.getElementById('nc_val').value)||0;
  const hasReceipt = document.getElementById('nc_receipt').checked;
  if(val<=0){ toast('Informe um valor de custo válido.'); return; }
  orderDraft.costs.push({id:uid(), category:cat, description:desc, value:val, hasReceipt});
  document.getElementById('nc_desc').value=''; document.getElementById('nc_val').value=''; document.getElementById('nc_receipt').checked=false;
  refreshOrderModal();
}
function removeCostRow(i){ orderDraft.costs.splice(i,1); refreshOrderModal(); }
function addPaymentRow(){
  const date = document.getElementById('np_date').value || todayISO();
  const val = parseFloat(document.getElementById('np_val').value)||0;
  const method = document.getElementById('np_method').value.trim();
  if(val<=0){ toast('Informe um valor de pagamento válido.'); return; }
  orderDraft.payments.push({id:uid(), date, value:val, method});
  document.getElementById('np_val').value=''; document.getElementById('np_method').value='';
  refreshOrderModal();
}
function removePaymentRow(i){ orderDraft.payments.splice(i,1); refreshOrderModal(); }
function refreshOrderModal(){
  // preserve current field values before re-render
  const cur = {
    clientId: document.getElementById('f_clientId')?.value,
    date: document.getElementById('f_date')?.value,
    type: document.getElementById('f_type')?.value,
    description: document.getElementById('f_description')?.value,
    notes: document.getElementById('f_notes')?.value,
  };
  if(cur.clientId!==undefined) orderDraft.clientId = cur.clientId;
  if(cur.date) orderDraft.date = cur.date;
  if(cur.type) orderDraft.type = cur.type;
  if(cur.description!==undefined) orderDraft.description = cur.description;
  if(cur.notes!==undefined) orderDraft.notes = cur.notes;
  document.getElementById('modalRoot').innerHTML = orderModalHtml(!!orderDraft.id);
  renderOrderTotals();
}
function renderOrderTotals(){
  const box = document.getElementById('orderTotalsBox');
  const disp = document.getElementById('costTotalDisplay');
  if(disp) disp.textContent = fmtBRL(orderTotalCost(orderDraft));
  if(!box) return;
  const cost = orderTotalCost(orderDraft);
  const profit = (Number(orderDraft.saleValue)||0) - cost;
  const margin = orderDraft.saleValue>0 ? (profit/orderDraft.saleValue)*100 : 0;
  box.innerHTML = `<div class="subblock" style="margin-bottom:0;">
    <div class="calc-line"><span>Custo total</span><b class="mono">${fmtBRL(cost)}</b></div>
    <div class="calc-line"><span>Lucro bruto</span><b class="mono" style="color:${profit>=0?'#7fe0ab':'#f0aeb1'}">${fmtBRL(profit)}</b></div>
    <div class="calc-line"><span>Margem</span><b class="mono">${fmtPct(margin)}</b></div>
  </div>`;
}
function saveOrder(){
  const clientId = document.getElementById('f_clientId').value;
  if(!clientId){ toast('Selecione um cliente.'); return; }
  const saleValue = parseFloat(document.getElementById('f_saleValue').value)||0;
  if(saleValue<=0){ toast('Informe o valor total cobrado do cliente.'); return; }
  const data = {
    clientId,
    date: document.getElementById('f_date').value || todayISO(),
    type: document.getElementById('f_type').value,
    saleValue,
    description: document.getElementById('f_description').value.trim(),
    notes: document.getElementById('f_notes').value.trim(),
    costs: orderDraft.costs,
    payments: orderDraft.payments,
    overdue: orderDraft.overdue,
  };
  if(orderDraft.id){
    const o = DB.orders.find(x=>x.id===orderDraft.id);
    Object.assign(o, data);
  } else {
    DB.orders.push({ id: uid(), ...data });
  }
  saveDB(); closeModal(); orderDraft=null; render(); toast('Pedido salvo.');
}

/* ============================================================
   MODAL: COMPRA
   ============================================================ */
function openPurchaseModal(id){
  const editing = id ? DB.purchases.find(p=>p.id===id) : null;
  const p = editing || { id:null, date: todayISO(), supplier:'', clientId:'', description:'', products:'', total:0, paymentMethod:'', hasReceipt:true, notes:'' };
  const clientOptions = `<option value="">Nenhum (compra geral)</option>` + DB.clients.map(c=> `<option value="${c.id}" ${p.clientId===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('');
  const body = `
    <div class="field-row">
      <div class="field"><label for="pf_date">Data *</label><input type="date" id="pf_date" value="${p.date}"></div>
      <div class="field"><label for="pf_supplier">Fornecedor</label><input id="pf_supplier" value="${escapeHtml(p.supplier)}"></div>
    </div>
    <div class="field"><label for="pf_client">Cliente relacionado (opcional)</label><select id="pf_client">${clientOptions}</select></div>
    <div class="field"><label for="pf_desc">Descrição</label><input id="pf_desc" value="${escapeHtml(p.description)}" placeholder="Ex: Primeira parte das compras"></div>
    <div class="field"><label for="pf_products">Produtos</label><textarea id="pf_products">${escapeHtml(p.products||'')}</textarea></div>
    <div class="field-row">
      <div class="field"><label for="pf_total">Valor total (R$) *</label><input type="number" step="0.01" min="0" id="pf_total" value="${p.total}"></div>
      <div class="field"><label for="pf_method">Forma de pagamento</label><input id="pf_method" value="${escapeHtml(p.paymentMethod||'')}"></div>
    </div>
    <div class="field checkbox-row">
      <input type="checkbox" id="pf_receipt" ${p.hasReceipt?'checked':''} onchange="document.getElementById('noReceiptNote').style.display=this.checked?'none':'block';">
      <label for="pf_receipt" style="margin:0; text-transform:none; font-size:12.5px;">Possui comprovante / nota fiscal</label>
    </div>
    <div id="noReceiptNote" class="field-hint" style="display:${p.hasReceipt?'none':'block'}; margin-bottom:12px;">Será registrada como "Compra sem comprovante — já lançada". Isso não impede o cálculo do custo.</div>
    <div class="field"><label for="pf_notes">Observações</label><textarea id="pf_notes">${escapeHtml(p.notes||'')}</textarea></div>
  `;
  const foot = `
    <div>${editing ? `<button class="btn btn-danger btn-sm" onclick="deletePurchase('${p.id}'); closeModal();">${ic('trash')} Excluir</button>` : '<span></span>'}</div>
    <div style="display:flex; gap:8px;"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="savePurchase('${p.id||''}')">Salvar compra</button></div>
  `;
  document.getElementById('modalRoot').innerHTML = modalShell(editing?'Editar compra':'Nova compra', body, foot);
}
function savePurchase(id){
  const total = parseFloat(document.getElementById('pf_total').value)||0;
  if(total<=0){ toast('Informe o valor total da compra.'); return; }
  const data = {
    date: document.getElementById('pf_date').value || todayISO(),
    supplier: document.getElementById('pf_supplier').value.trim(),
    clientId: document.getElementById('pf_client').value || null,
    description: document.getElementById('pf_desc').value.trim(),
    products: document.getElementById('pf_products').value.trim(),
    total,
    paymentMethod: document.getElementById('pf_method').value.trim(),
    hasReceipt: document.getElementById('pf_receipt').checked,
    notes: document.getElementById('pf_notes').value.trim(),
  };
  if(id){
    const p = DB.purchases.find(x=>x.id===id);
    Object.assign(p, data);
  } else {
    DB.purchases.push({ id: uid(), ...data });
  }
  saveDB(); closeModal(); render(); toast('Compra salva.');
}

/* ============================================================
   AFTER RENDER / INIT
   ============================================================ */
function afterRender(){
  if(state.view==='dashboard'){ buildDashboardCharts(); }
  if(state.view==='calculator'){ renderCalcResult(); }
}

render();
</script>
